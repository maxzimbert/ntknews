[build]
  ignore = "git diff --quiet HEAD^ HEAD -- . ':(exclude)ntk-desk/data/' ':(exclude)ntk-desk/data/**' ':(exclude)ntk-pulse/data/' ':(exclude)ntk-pulse/data/**'"

[[redirects]]
  from = "/digest/latest"
  to = "/digest/v2/"
  status = 200

[[redirects]]
  from = "/digest/latest/*"
  to = "/digest/v2/:splat"
  status = 200
