/* ─── render: lineup ─── */
function bodyChip(a){
  if (a.dupOf) return `<span class="chip dup">syndicated · ${esc(a.dupOf)}</span>`;
  if (isSup(a.url)) return `<span class="chip dup">suppressed</span>`;
  if (a.bodyFrom==='er') return `<span class="chip body">er body ${(a.body.length/1000).toFixed(1)}k</span>`;
  if (a.bodyFrom==='fetch') return `<span class="chip thin">meta ${a.body.length}ch</span>`;
  return `<span class="chip thin">headline only</span>`;
}
function editionScoreChips(key){
  if (!EDITION) return '';
  const s = (EDITION.stories||[]).find(x=>x.key===key);
  if (!s || !s.scores) return '';
  const sc = s.scores;
  const hot = sc.emotional_load>=4 ? ' style="color:var(--stale)"' : '';
  return ` · <span${hot}>emotion ${sc.emotional_load}</span> · action ${sc.actionability} · currency ${sc.conversational_currency}`+
    (s.ledger_class ? ` · <b>${esc(s.ledger_class)}</b>` : '');
}

// ─── recommended-zone (edition candidates) selection/expand state ───
// Ephemeral — resets on reload, same posture as Stream's SELECTED/OPEN_CLUSTERS.
let CAND_SELECTED = new Set();   // candidate keys checked for batch dismiss
let OPEN_CANDIDATES = new Set(); // candidate keys currently expanded to show sources
let candLastIndex = null;        // last clicked row index, for shift-click range select

function visibleCandidates(){
  return (EDITION?._candidates||[]).filter(s=>!DISMISSED[s.key]);
}
function dismissedCandidateCount(){
  return (EDITION?._candidates||[]).filter(s=>DISMISSED[s.key]).length;
}
function dismissCandidate(key){
  DISMISSED[key]=true; CAND_SELECTED.delete(key); saveDismissed(); render();
}
function dismissSelectedCandidates(){
  if (!CAND_SELECTED.size) return;
  for (const k of CAND_SELECTED) DISMISSED[k]=true;
  CAND_SELECTED.clear(); saveDismissed(); render();
}
function restoreDismissedCandidates(){
  if (!dismissedCandidateCount()) return;
  if (!confirm('Restore all dismissed candidates back into the recommended list?')) return;
  DISMISSED = {}; saveDismissed(); render();
}
function toggleCandOpen(key){
  if (OPEN_CANDIDATES.has(key)) OPEN_CANDIDATES.delete(key); else OPEN_CANDIDATES.add(key);
  render();
}
function toggleCandSelect(key, shiftKey, index, visibleKeys){
  if (shiftKey && candLastIndex!==null){
    const [a,b] = [candLastIndex, index].sort((x,y)=>x-y);
    for (let i=a;i<=b;i++) CAND_SELECTED.add(visibleKeys[i]);
  } else if (CAND_SELECTED.has(key)) {
    CAND_SELECTED.delete(key);
  } else {
    CAND_SELECTED.add(key);
  }
  candLastIndex = index;
  render();
}
function toggleCandSelectAll(visibleKeys, checked){
  if (checked) visibleKeys.forEach(k=>CAND_SELECTED.add(k)); else CAND_SELECTED.clear();
  render();
}
// Same source detail Stream shows — pulled from the live 6h window when the
// cluster is still there. Clusters age out of that window over the course
// of a day, so candidates promoted earlier fall back to the canonical URLs
// lineup_promote.py recorded at promotion time (no per-article title/pub
// pairing in that case — best available, not the full picture).
function candidateArticles(key){
  const sc = (STREAM?.clusters||[]).find(c=>c.key===key);
  if (sc && sc.items && sc.items.length){
    return sc.items.map(it=>
      `<div class="article"><span class="pub">${esc(it.publisher)}</span> · `+
      `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a> `+
      `<span class="t">${rel(it.published)}</span></div>`
    ).join('');
  }
  const s = (EDITION?._candidates||[]).find(x=>x.key===key);
  const urls = (s && s.urls) || [];
  if (!urls.length){
    return `<div style="font-size:11px;color:var(--dim);padding:2px 0">No source detail available — cluster aged out of the stream window and no URLs were recorded.</div>`;
  }
  return `<div style="font-size:10.5px;color:var(--dim);padding:2px 0 4px">cluster aged out of the stream window — showing recorded source URLs only</div>`+
    urls.map(u=>`<div class="article"><a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a></div>`).join('');
}

function wireCandidateButtons(root){
  const keys = visibleCandidates().map(s=>s.key);
  root.querySelectorAll('.add-candidate').forEach(btn=>{
    btn.addEventListener('click',()=>addEditionCandidate(btn.dataset.key));
  });
  root.querySelectorAll('.cand-dismiss').forEach(btn=>{
    btn.addEventListener('click',()=>dismissCandidate(btn.dataset.key));
  });
  root.querySelectorAll('.cand-label').forEach(lbl=>{
    lbl.addEventListener('click',()=>toggleCandOpen(lbl.dataset.key));
  });
  root.querySelectorAll('.cand-chk').forEach(cb=>{
    cb.addEventListener('click',e=>{
      e.stopPropagation();
      toggleCandSelect(cb.dataset.key, e.shiftKey, +cb.dataset.i, keys);
    });
  });
  root.querySelector('#cand-select-all')?.addEventListener('change', e=>{
    toggleCandSelectAll(keys, e.target.checked);
  });
  root.querySelector('#cand-dismiss-sel')?.addEventListener('click', dismissSelectedCandidates);
  root.querySelector('#cand-restore-dismissed')?.addEventListener('click', restoreDismissedCandidates);
}

function candidatesPanel(){
  const cands = visibleCandidates();
  const dismissedN = dismissedCandidateCount();
  if (!cands.length && !dismissedN) return '';
  const allSelected = cands.length>0 && cands.every(s=>CAND_SELECTED.has(s.key));
  const header = `<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px">
      <div style="font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px">
        ${cands.length} from today's edition not yet in your lineup — choose what to add`+
        (LINEUP.length>=LINEUP_MAX?' (full — remove a story first)':'')+
        (dismissedN?` · ${dismissedN} dismissed <button class="mini" id="cand-restore-dismissed" style="margin-left:2px">restore</button>`:'')+`
      </div>`+
      (cands.length ? `<div style="display:flex;gap:10px;align-items:center">
        <label style="font-size:11px;display:flex;gap:4px;align-items:center;cursor:pointer">
          <input type="checkbox" id="cand-select-all" ${allSelected?'checked':''}> select all
        </label>
        <button class="mini" id="cand-dismiss-sel" ${CAND_SELECTED.size?'':'disabled'}>dismiss selected (${CAND_SELECTED.size})</button>
      </div>` : '')+
    `</div>`;
  const rows = cands.map((s,i)=>{
    const open = OPEN_CANDIDATES.has(s.key);
    return `<div class="cand-row" data-key="${esc(s.key)}" style="border-bottom:1px solid var(--rule);padding:4px 0">
      <div style="display:flex;gap:6px;align-items:baseline">
        <input type="checkbox" class="cand-chk" data-key="${esc(s.key)}" data-i="${i}" ${CAND_SELECTED.has(s.key)?'checked':''}>
        <label class="cand-label" data-key="${esc(s.key)}" style="flex:1;cursor:pointer">
          <span class="slot-tag" style="background:#666">${esc(s.slot_label||'')}</span> ${esc(s.title)}
          <span style="color:var(--dim);font-size:10.5px"> · ${s.publisher_count||0} pub${s.publisher_count===1?'':'s'}</span>
        </label>
        <button class="mini add-candidate" data-key="${esc(s.key)}" ${LINEUP.length>=LINEUP_MAX?'disabled':''}>+ add</button>
        <button class="mini cand-dismiss" data-key="${esc(s.key)}">dismiss</button>
      </div>`+
      (open ? `<div style="padding-left:22px;margin-top:2px">${candidateArticles(s.key)}</div>` : '')+
    `</div>`;
  }).join('');
  return `<div class="ed-head" style="margin-top:8px">${header}${rows}</div>`;
}

// T-0037. Formats a "HH:MM" hour string (already in the editor's own
// broadcast-hour terms — NPR's own episode ids use the same digits as
// their displayed EDT hour, confirmed against a live capture) as a
// compact "3p"/"6a"/"12a" label for the grid's column headers.
function nprHourLabel(hhmm){
  const h = parseInt(hhmm.slice(0,2), 10);
  const ap = h < 12 ? 'a' : 'p';
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return h12 + ap;
}

// T-0037 — NPR News Now monitor. Reads data/newscasts/today.json only;
// never touches STREAM/EDITION/LINEUP. Confirmed with the editor
// 2026-09-23: monitoring only, no action taken off this data. Returns ''
// whenever there's nothing to show, same posture as candidatesPanel().
function nprModule(){
  if (!NEWSCAST || !(NEWSCAST.threads||[]).length) return '';
  const hours = (NEWSCAST.episodes||[]).map(e=>e.hour);
  // Only threads that showed up more than once — a story NPR covered
  // exactly one hour isn't an "hour-over-hour" signal, just inventory.
  const persisting = NEWSCAST.threads.filter(t=>t.count>=2);
  const nowList = (NEWSCAST.latest_topics||[]).slice(0,6).map(t=>
    `<li><span class="npr-tick">most recent</span>${esc(t)}</li>`).join('');
  const gridCols = hours.length;
  const rows = persisting.map(th=>{
    const cells = hours.map(h=>
      `<div class="npr-cell">${th.hours.includes(h)?'<div class="npr-dot"></div>':''}</div>`).join('');
    return `<div class="npr-rowlabel">${esc(th.text)}</div>${cells}`;
  }).join('');
  const grid = gridCols && persisting.length ? `<div class="npr-grid-wrap">
      <div class="npr-grid" style="grid-template-columns:minmax(160px,260px) repeat(${gridCols},22px)">
        <div></div>${hours.map(h=>`<div class="npr-colhead">${esc(nprHourLabel(h))}</div>`).join('')}
        ${rows}
      </div>
    </div>
    <div class="npr-legend">● covered that hour · monitoring only, not wired into any story or score below</div>`
    : `<div class="npr-empty">Nothing has repeated across hours yet today.</div>`;
  return `<div class="npr-mod">
    <div class="npr-row1">
      <span><span class="k">npr news now</span></span>
      <span class="npr-right">${esc(nprHourLabel(NEWSCAST.latest_hour))} hour · ${hours.length} hours tracked · updated ${rel(NEWSCAST.generated_at)} ago</span>
    </div>
    <ul class="npr-now-list">${nowList}</ul>
    ${grid}
  </div>`;
}

function editionStrip(){
  const npr = nprModule();
  if (!EDITION) return npr;
  const fails = EDITION.lint_failures||[], unfilled = EDITION.slots_unfilled||[];
  return npr + `<div class="ed-head">
    <div class="row">
      <span><span class="k">plan</span> <b>${esc(EDITION.slot_plan)}</b></span>
      <span><span class="k">day</span> ${esc(EDITION.daytype)}</span>
      <span><span class="k">size</span> ${EDITION.actual_size} <span style="color:var(--dim)">(target ${(EDITION.target_size||[]).join('–')})</span></span>
      <span><span class="k">assembled</span> ${rel(EDITION.assembled_at)} ago</span>
    </div>
    <div class="lint">${fails.length
        ? fails.map(f=>`<div class="lint-fail">✕ ${esc(f)}</div>`).join('')
        : `<div class="lint-ok">✓ passes all set constraints</div>`}
      ${unfilled.length?`<div class="lint-fail">✕ unfilled: ${esc(unfilled.join(', '))}</div>`:''}
    </div>
  </div>` +
  candidatesPanel() +
  ((EDITION.excluded_sample||[]).length ? `<details class="killed"><summary style="cursor:pointer;color:var(--dim);font-size:11px">`+
    `${EDITION.excluded_sample.length} candidates excluded before slot-filling</summary>`+
    EDITION.excluded_sample.map(x=>`<div class="k-item">✕ ${esc(x.why)} — ${esc(x.title||'')}</div>`).join('')+
    `</details>` : '');
}

// T-0010 — the per-story Backstory row assignment.
//
// Empty means "let the classifier decide", which is the previous behaviour and
// stays the default: the editor should not have to tag eight stories a day to
// publish. What this buys is the ability to override one, and to SEE when two
// stories are heading for the same row — which the classifier cannot notice,
// because it assigns each story independently with no view of the others.
//
// The count is over explicit assignments only. A collision between two
// classifier picks is invisible here by definition; that is T-0014.
function bsrCollisionCounts(){
  const n = {};
  LINEUP.forEach(s => { if (s.backstoryRow) n[s.backstoryRow] = (n[s.backstoryRow]||0)+1; });
  return n;
}
// What the last publish did with this story, read from the published
// backstory.json: which row, who chose it, and how well it fit. This is how a
// bad pairing reaches the editor, since the classifier's own confidence does
// not (T-0076: the three poor fits on 2026-10-05 scored 0.68 to 0.74).
function bsrPublishedFor(s){
  const ps = (BSR_PUBLISHED && BSR_PUBLISHED.todays_pairings) || [];
  return ps.find(p => p.story_id === s.key) || null;
}
function bsrPublishedChip(s){
  const p = bsrPublishedFor(s);
  if (!p) return '';
  const title = (BSR_ROWS.find(r => r.id === p.row) || {title: p.row}).title;
  const poor = p.origin && p.origin.row_fit === 'poor';
  const who = p.source === 'editor' ? 'you' : 'classifier ' + (p.confidence != null ? Number(p.confidence).toFixed(2) : '');
  const changed = s.backstoryRow && s.backstoryRow !== p.row;
  return `<span class="chip" title="what the last publish did with this story"`+
    (poor ? ' style="background:var(--warn);color:#fff"' : '')+`>`+
    `published: ${esc(title)} \u00b7 ${esc(who)}${poor ? ' \u00b7 poor fit' : ''}${changed ? ' \u00b7 will change' : ''}</span>`;
}
function bsrTagControl(s){
  if (!BSR_ROWS.length) return '';
  const counts = bsrCollisionCounts();
  const dup = s.backstoryRow && counts[s.backstoryRow] > 1;
  const unset = !s.backstoryRow;
  const style = dup ? ' style="border-color:var(--warn)"' : unset ? ' style="border-color:var(--warn);color:var(--warn)"' : '';
  const cat = s.backstoryRow && catRecord(s.backstoryRow);
  const own = Object.values(CATS).filter(c => !BSR_ROWS.some(r => r.id === c.id));
  return `<select class="bsr-tag" title="Row for this story's Backstory. Left unset, the classifier chooses and can pick a poor fit."`+
    style+`>`+
    `<option value=""${unset?' selected':''}>row: not set (classifier picks)</option>`+
    BSR_ROWS.map(r=>`<option value="${esc(r.id)}"${s.backstoryRow===r.id?' selected':''}>`+
      `row: ${esc(r.title)}${r.provisional ? ' (category)' : ''}</option>`).join('')+
    own.map(c=>`<option value="${esc(c.id)}"${s.backstoryRow===c.id?' selected':''}>row: ${esc(c.title)} (${esc(c.status)})</option>`).join('')+
    `</select>`+
    `<button class="mini bsr-gap" title="No row fits this story. Make a category: the system drafts its page for you to review in the Backstory tab."`+
      (cat ? ' style="background:var(--ink);color:#fff"' : '')+`>`+
      (cat ? 'category: '+esc(cat.title)+' \u2192' : '+ new category')+`</button>`+
    bsrPublishedChip(s)+
    (dup ? `<span class="chip" style="background:var(--warn);color:#fff" `+
           `title="another story in this lineup is tagged to the same row">`+
           `${counts[s.backstoryRow]}\u00d7 same row</span>` : '');
}

// Publish check for rows. A warning, not a block: the digest is the product
// and docs/decisions.md keeps Backstory additive. Pure, so it can be tested.
function rowPreflight(stories, cats){
  const warn = [];
  const unset = stories.filter(s => !s.backstory_row);
  if (unset.length)
    warn.push(unset.length + ' stor' + (unset.length === 1 ? 'y has' : 'ies have') +
      ' no row set, so the classifier will pick: ' +
      unset.map(s => '"' + String(s.headline || s.key).slice(0, 40) + '"').join(', '));
  const sent = new Set((cats || []).map(c => c.id));
  const known = new Set((typeof BSR_ROWS !== 'undefined' ? BSR_ROWS : []).map(r => r.id));
  const orphan = stories.filter(s => s.backstory_row && s.backstory_row.indexOf('p-') === 0 && !sent.has(s.backstory_row) && !known.has(s.backstory_row));
  if (orphan.length)
    warn.push(orphan.length + ' stor' + (orphan.length === 1 ? 'y is' : 'ies are') + ' filed under a category that is still a draft, so the classifier will pick instead: ' +
      orphan.map(s => '"' + String(s.headline || s.key).slice(0, 40) + '"').join(', ') + '. Approve it in the Backstory tab.');
  return warn;
}

/* ─── Subjects: the vocabulary Expertise keys to ───
   Every subject in use, what it has been attached to, and which concepts have
   turned up beneath it. Rename is the point: with nothing to fold onto, the
   first spelling of a subject becomes canonical, and without this the only way
   to fix a bad one is to edit every story that used it. */
function subjectUsage(){
  var use = {};
  SUBJECTS.forEach(function(v){ use[v] = { subject: v, stories: [], concepts: {} }; });
  LINEUP.forEach(function(st){
    var v = (st.subject || '').trim();
    if (!v) return;
    if (!use[v]) use[v] = { subject: v, stories: [], concepts: {} };
    use[v].stories.push(st.title || '(untitled)');
    var c = (st.conceptMatch || st.conceptEntity || '').trim();
    if (c) use[v].concepts[c] = (use[v].concepts[c] || 0) + 1;
  });
  return Object.keys(use).map(function(k){ return use[k]; }).sort(function(a,b){
    return b.stories.length - a.stories.length || a.subject.localeCompare(b.subject);
  });
}

function renderSubjects(root){
  var rows = subjectUsage();
  var unused = rows.filter(function(r){ return !r.stories.length; }).length;
  root.innerHTML =
    '<div class="subj-head">' +
      '<p class="subj-note">What a reader can build expertise in. Attached to a story in the lineup under <b>subject:</b>, drafted by Step 1 and correctable there or here. ' +
      'Concepts underneath are the entities that turned up in those stories; they are texture on a reader\'s profile and carry no status.</p>' +
      '<p class="subj-note">' + rows.length + ' in the vocabulary, ' + (rows.length - unused) + ' used in this lineup. ' +
      'Renaming one rewrites every story in the lineup that used it.</p>' +
      '<div class="subj-add"><input type="text" id="subj-new" placeholder="add a subject"><button class="mini" id="subj-add-go">add</button></div>' +
    '</div>' +
    rows.map(function(r, i){
      var cs = Object.keys(r.concepts).sort(function(a,b){ return r.concepts[b]-r.concepts[a] || a.localeCompare(b); });
      return '<div class="subj-row' + (r.stories.length ? ' in-use' : '') + '">' +
        '<div class="subj-top">' +
          '<input type="text" class="subj-name" data-i="' + i + '" value="' + esc(r.subject) + '">' +
          '<span class="subj-count">' + (r.stories.length || 0) + ' in lineup</span>' +
          '<button class="mini subj-del" data-i="' + i + '" ' + (r.stories.length ? 'disabled title="in use by ' + r.stories.length + ' story(s)"' : '') + '>remove</button>' +
        '</div>' +
        (cs.length ? '<div class="subj-concepts">' + cs.map(function(c){
            return '<span class="subj-concept">' + esc(c) + (r.concepts[c] > 1 ? ' \u00d7' + r.concepts[c] : '') + '</span>';
          }).join('') + '</div>' : '') +
        (r.stories.length ? '<div class="subj-stories">' + r.stories.map(function(t){
            return '<div>' + esc(t.slice(0, 84)) + '</div>'; }).join('') + '</div>' : '') +
      '</div>';
    }).join('');

  var rowData = rows;
  root.querySelectorAll('.subj-name').forEach(function(el){
    el.addEventListener('change', function(e){
      var old = rowData[+e.target.dataset.i].subject;
      var next = normalizeSubject(e.target.value);
      if (!next || next === old) { e.target.value = old; return; }
      var hits = LINEUP.filter(function(st){ return (st.subject || '') === old; }).length;
      if (hits && !confirm('Rename "' + old + '" to "' + next + '"?\n\n' + hits + ' story(s) in the lineup will be updated.')) {
        e.target.value = old; return;
      }
      LINEUP.forEach(function(st){ if ((st.subject || '') === old) st.subject = next; });
      SUBJECTS = SUBJECTS.filter(function(v){ return v !== old; });
      if (!SUBJECTS.some(function(v){ return v.toLowerCase() === next.toLowerCase(); })) SUBJECTS.push(next);
      saveSubjects(); saveLineup(); render();
    });
  });
  root.querySelectorAll('.subj-del').forEach(function(el){
    el.addEventListener('click', function(e){
      var v = rowData[+e.target.dataset.i].subject;
      if (!confirm('Remove "' + v + '" from the vocabulary? No story is using it.')) return;
      SUBJECTS = SUBJECTS.filter(function(x){ return x !== v; });
      saveSubjects(); render();
    });
  });
  var go = root.querySelector('#subj-add-go');
  if (go) go.addEventListener('click', function(){
    var v = normalizeSubject(root.querySelector('#subj-new').value);
    if (v) { rememberSubject(v); render(); }
  });
}

        el.querySelector(`.revise-btn[data-sec="${sec}"]`)?.addEventListener('click',()=>{
          reviseBox.classList.toggle('open'); flagBox.classList.remove('open');
        });
        el.querySelector(`.flag-btn[data-sec="${sec}"]`)?.addEventListener('click',()=>{
          flagBox.classList.toggle('open'); reviseBox.classList.remove('open');
        });
        el.querySelector(`.revise-go[data-sec="${sec}"]`)?.addEventListener('click',()=>{
          const note = reviseBox.querySelector('.revise-note').value;
          reviseSection(s, sec, note);
        });
        el.querySelector(`.flag-go[data-sec="${sec}"]`)?.addEventListener('click',()=>{
          const sel = flagBox.querySelector('.flag-select').value;
          const newText = flagBox.querySelector('.flag-new').value;
          flagSection(s, sec, sel, newText);
        });
        // Click-to-edit: swap the rendered prose for a plain textarea over
        // the RAW markdown. Enter (no Shift) or clicking away saves; Escape
        // discards; Shift+Enter inserts a literal newline (paragraphs in
        // this text are blank-line separated, so restructuring needs that
        // occasionally, but this is meant for light edits — trims, swapped
        // words, cutting a pull quote or STAT line — not fresh composition.
        const bodyEl = el.querySelector(`.body[data-sec="${sec}"]`);
        bodyEl?.addEventListener('click', function startEdit(){
          if (bodyEl.querySelector('textarea')) return;   // already editing
          const raw = s.packages[sec] || '';
          bodyEl.innerHTML = '';
          const ta = document.createElement('textarea');
          ta.className = 'body-edit';
          ta.value = raw;
          bodyEl.appendChild(ta);
          ta.focus();
          ta.setSelectionRange(ta.value.length, ta.value.length);
          ta.style.height = Math.min(Math.max(ta.scrollHeight, 120), 600) + 'px';
          let cancelled = false;
          const finish = (save) => {
            if (save && !cancelled){
              s.packages[sec] = ta.value;
              s.editedSections = s.editedSections || {};
              s.editedSections[sec] = true;
              saveLineup();
            }
            render();
          };
          ta.addEventListener('keydown', e=>{
            if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); finish(true); }
            else if (e.key === 'Escape'){ cancelled = true; finish(false); }
          });
          ta.addEventListener('blur', ()=>finish(true));
        });
      });
    }

      });
    });

/* ─── notes panel ─── */
function renderNotes(){
  const panel = document.getElementById('notesPanel');
  panel.className = notesOpen ? 'open' : '';
  document.getElementById('notesBadge').textContent = NOTES.items.length ? ' '+NOTES.items.length : '';
  if (!notesOpen) { panel.innerHTML=''; return; }
  panel.innerHTML = `<div class="note-add">
      <textarea id="new-note" placeholder="New standing note — applies to every section, every story, from now on"></textarea>
      <button class="mini go" id="add-note-btn">add</button>
    </div>`+
    (NOTES.items.length ? NOTES.items.map(n=>{
      const since = (NOTES.genCounter||0) - (n.baseline||0);
      return `<div class="note-item" data-id="${n.id}">`+
        `<textarea class="note-text">${esc(n.text)}</textarea>`+
        `<div class="note-meta"><span>added ${new Date(n.addedAt).toLocaleDateString()}</span>`+
        `<span>${since} ${since===1?'story':'stories'} since</span>`+
        `<span>${n.flags.length} flagged example${n.flags.length===1?'':'s'}</span>`+
        `<button class="mini promote-btn" ${n.busy?'disabled':''}>${n.promotedText?'re-promote':'promote'}</button>`+
        `<button class="mini remove-note">remove</button></div>`+
        (n.flags.length ? `<div class="note-flags">${n.flags.slice(-5).map(f=>
          `<div>· <strong>${esc(f.section)}</strong> in "${esc(f.title)}": "${esc(f.snippet)}…"</div>`).join('')}</div>` : '')+
        (n.promotedText ? `<div class="promoted-box">${esc(n.promotedText)}<br><button class="mini copy-promoted">copy rule</button>`+
          `<span class="copied">${copiedFlag===n.id+'-promo'?' copied':''}</span>`+
          `<div style="color:var(--dim);margin-top:4px">Paste into the matching voice-discipline block in this file's SEC_PROMPTS and bump the version.</div></div>` : '')+
      `</div>`;
    }).join('') : `<div style="color:var(--dim);font-size:12px">No standing notes yet. Add one above, or flag a generated section below and create one from there.</div>`);

  panel.querySelector('#add-note-btn').addEventListener('click',()=>{
    addNote(panel.querySelector('#new-note').value);
  });
  panel.querySelectorAll('.note-item').forEach(row=>{
    const id = row.dataset.id; const note = NOTES.items.find(n=>n.id===id);
    row.querySelector('.note-text').addEventListener('change',e=>{ note.text=e.target.value; saveNotes(); });
    row.querySelector('.remove-note').addEventListener('click',()=>removeNote(id));
    row.querySelector('.promote-btn').addEventListener('click',()=>promoteNote(note));
    row.querySelector('.copy-promoted')?.addEventListener('click',()=>cp(note.promotedText, id+'-promo'));
  });
}

/* ─── edition -> lineup sync ───
   assembly.py picks the day's stories; this materializes each pick into a
   normal, fully-authorable LINEUP entry — same object shape certify() has
   always built — so Enrich/Summon/Generate/Revise work identically whether
   a story arrived by manual certify or by the automated edition. This is
   the "Lineup is the homepage" change: assembly's picks ARE the lineup now,
   not a separate read-only report you look at before manually certifying.

   Strictly non-destructive both directions:
     - An edition story that's already in LINEUP (matched by key) is left
       completely alone — title, angle, packages, everything an editor may
       have already authored survives untouched. Only a story with NO
       existing entry gets one created.
     - A LINEUP entry whose story fell OUT of today's edition is never
       deleted. It's flagged `inEdition:false` so the UI can show it as
       "not in today's edition" — the editor decides whether to keep
       working on it, certify it anyway, or remove it. Same principle as
       suppression and extraction: the machine marks, the editor decides. */
// Builds the actual LINEUP entry object for an edition pick. Shared by
// bootstrap auto-fill and manual candidate-add so there's exactly one
// place that defines what a synced story looks like.
// The key a story was assembled under isn't a permanent identity — it's
// whichever article cluster.py picked as earliest-and-lowest-tier WITHIN
// THAT RUN'S window. Every 20 minutes the scan re-clusters and that pick
// can shift for a story that's still very much alive, just now filed under
// a different key. An exact-key lookup failing doesn't mean the story is
// gone; it usually means it got renamed out from under itself. Before
// admitting defeat, try to recognize it anyway — same entity+cosine
// matcher already proven for manual-cluster Rescan, just run once against
// the story's own title instead of an existing cluster's centroid.
// Auto-attach and merely-suggest need different bars, and it took a real
// test case to see why: mcEntities()'s alias map (fed -> federal+reserv)
// only feeds the entity-overlap check, never the cosine vector — "Fed" and
// "Federal Reserve" are correctly recognized as the same ENTITY but are
// still different TOKENS to the cosine math, so a real, correct entity
// match can still score a low cosine. Fine for a suggestion (you confirm
// it anyway); not fine to auto-attach on alone, where cosine agreeing too
// is what justifies skipping your confirmation.
const RECONNECT_CONFIDENT = 0.30;  // auto-attach without asking — needs BOTH signals
function findReconnectCandidate(storyTitle){
  const clusters = STREAM?.clusters || [];
  if (!clusters.length) return null;
  const pool = clusters.map((c,i)=>({id:'c'+i, title:c.title, summary:''}));
  pool.push({id:'story', title:storyTitle, summary:''});
  const vecs = mcBuildVectors(pool);
  const storyEnts = mcEntities(storyTitle, '');
  let best = null;
  clusters.forEach((c,i)=>{
    const sim = mcCosine(vecs['story'], vecs['c'+i]);
    const shared = [...mcEntities(c.title,'')].filter(e=>storyEnts.has(e));
    // Rank candidates by entity-overlap count first, cosine as tiebreaker —
    // a shared specific entity is stronger evidence than a marginally
    // higher cosine on a pool this small.
    if (shared.length >= 1 && (!best || shared.length > best.shared.length ||
        (shared.length === best.shared.length && sim > best.sim))){
      best = {cluster:c, sim, shared};
    }
  });
  return best;
}

function materializeEditionStory(s){
  const streamCluster = (STREAM?.clusters||[]).find(c=>c.key===s.key);
  let items = streamCluster ? streamCluster.items : [];
  let recoveredFrom = null, suggestion = null;

  if (!streamCluster){
    const match = findReconnectCandidate(s.title);
    if (match && match.sim >= RECONNECT_CONFIDENT){
      items = match.cluster.items;
      recoveredFrom = match.cluster.title;
    } else if (match){
      // Any real entity match (blocklist already filters generic words —
      // "trump", "white house" — so what's left is a genuine name/place/org)
      // is worth surfacing for a human to confirm, even without cosine's
      // agreement. This is the tier the earlier version was undershooting.
      suggestion = {key: match.cluster.key, title: match.cluster.title,
        pubCount: match.cluster.publisher_count, sim: match.sim};
    }
  }

  return {
    id: 'ln-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),
    key: s.key, title: s.title,
    beat: s.beat, category: BEAT_TO_CAT[s.beat] || 'Nation', categoryCustom: '',
    angle: s.line || '',
    conceptEntity:'', narrowKeyword:'',
    articles: items.map(it=>({
      url: it.url, title: it.title, source: it.publisher, date: it.published||'',
      body:'', bodyFrom:'', included:true, dupOf:null, origin:'rss'
    })),
    enrichedAt: null, packages: null, open: false, outOpen: false,
    fromEdition: true, slotLabel: s.slot_label,
    syncFailed: !streamCluster && !recoveredFrom && !suggestion,
    recoveredFrom, reconnectSuggestion: suggestion,
  };
}

// Called when the editor accepts a suggested reconnect from the banner.
function acceptReconnect(story){
  const s = story.reconnectSuggestion;
  const cluster = (STREAM?.clusters||[]).find(c=>c.key===s.key);
  if (!cluster) return;
  story.articles = cluster.items.map(it=>({
    url: it.url, title: it.title, source: it.publisher, date: it.published||'',
    body:'', bodyFrom:'', included:true, dupOf:null, origin:'rss'
  }));
  story.syncFailed = false;
  story.recoveredFrom = cluster.title;
  story.reconnectSuggestion = null;
  saveLineup(); render();
}
function dismissReconnect(story){
  story.reconnectSuggestion = null; saveLineup(); render();
}

// Manual add: called when the editor clicks a specific candidate in the
// "available to add" list, never automatically once the editor has started
// curating (see the bootstrap check below).
function addEditionCandidate(key){
  if (LINEUP.length >= LINEUP_MAX){ alert('Lineup is full ('+LINEUP_MAX+'). Remove a story first.'); return; }
  const s = (EDITION?.stories||[]).find(x=>x.key===key);
  if (!s || LINEUP.find(l=>l.key===key)) return;
  LINEUP.push(materializeEditionStory(s));
  saveLineup(); render();
}

function syncEditionToLineup(){
  if (!EDITION || !EDITION.stories) return;
  const editionKeys = new Set(EDITION.stories.map(s=>s.key));
  let changed = false;
  // Auto-fill only applies to a genuinely empty Lineup — pure bootstrap, the
  // very first time the homepage has anything to show. The instant you've
  // started curating (removed a story, edited an angle, whatever), a slot
  // opening back up should never be silently refilled with whichever
  // edition pick happens to sort first — that's the machine making an
  // editorial choice you didn't ask it to make. Candidates get offered
  // instead; you choose.
  const bootstrap = LINEUP.length === 0;
  const candidates = [];

  for (const s of EDITION.stories){
    const existing = LINEUP.find(l=>l.key===s.key);
    // Backfill articles into an entry that was auto-created before STREAM
    // had loaded (a real race: lineup.json can resolve before clusters.json
    // does). Only touches entries that are still genuinely empty and
    // untouched by the editor — anything with real articles, an angle worth
    // keeping, or generated work is left completely alone.
    if (existing && existing.fromEdition && existing.articles.length===0 && !existing.packages){
      const sc = (STREAM?.clusters||[]).find(c=>c.key===s.key);
      if (sc && sc.items.length){
        existing.articles = sc.items.map(it=>({
          url: it.url, title: it.title, source: it.publisher, date: it.published||'',
          body:'', bodyFrom:'', included:true, dupOf:null, origin:'rss'
        }));
        changed = true;
      }
      continue;
    }
    if (existing){ continue; }   // never touch authored state
    if (!bootstrap){ candidates.push(s); continue; }   // offer, don't auto-add
    if (LINEUP.length >= LINEUP_MAX){ candidates.push(s); continue; }
    LINEUP.push(materializeEditionStory(s));
    changed = true;
  }
  EDITION._candidates = candidates;
  // Flag (never delete) anything that fell out of today's edition.
  for (const l of LINEUP){
    const stillIn = editionKeys.has(l.key);
    if (l.inEdition !== stillIn){ l.inEdition = stillIn; changed = true; }
  }
  if (changed) saveLineup();
}

/* ─── edition view: what assembly.py decided, and why ─── */
let EDITION = null;
let NEWSCAST = null;   // T-0037 — data/newscasts/today.json. Monitoring only,
                        // never written back into LINEUP/EDITION/STREAM.

function renderToday(root){
  const n = LINEUP.filter(s => s.packages && s.packages.truths).length;
  root.innerHTML = `<div class="lineup-bar">
      <button class="mini go" id="gen-today" ${TODAY_OV.busy?'disabled':''}>${TODAY_OV.busy?'Generating…':'Generate Today'}</button>
      <span style="font-size:11px;color:var(--dim);align-self:center">${n} of ${LINEUP.length} lineup stories have finished Truths — feeds this generation</span>
      <span class="spacer"></span>
      ${TODAY_OV.generatedAt ? `<span style="font-size:11px;color:var(--dim);align-self:center">generated ${rel(TODAY_OV.generatedAt)} ago</span>` : ''}
    </div>
    <div class="ed-head out" style="margin-top:8px">
      <div style="font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">
        Today overview — click the text below to edit the raw draft
      </div>
      <div class="body today-body" id="today-body">${TODAY_OV.text
        ? esc(TODAY_OV.text).replace(/\n/g,'<br>')
        : '<span style="color:var(--dim)">Nothing generated yet. Click Generate Today above — it reads Truths/Probabilities/Possibilities from every lineup story that has finished packages, and skips Lies entirely.</span>'}</div>
    </div>`;

  document.getElementById('gen-today').addEventListener('click', generateToday);

  const bodyEl = document.getElementById('today-body');
  bodyEl.addEventListener('click', function startEdit(){
    if (bodyEl.querySelector('textarea')) return;
    const raw = TODAY_OV.text || '';
    bodyEl.innerHTML = '';
    const ta = document.createElement('textarea');
    ta.className = 'body-edit';
    ta.value = raw;
    bodyEl.appendChild(ta);
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
    ta.style.height = Math.min(Math.max(ta.scrollHeight, 160), 600) + 'px';
    let cancelled = false;
    const finish = (save) => {
      if (save && !cancelled){ TODAY_OV.text = ta.value; saveToday(); }
      render();
    };
    ta.addEventListener('keydown', e=>{
      if (e.key === 'Escape'){ cancelled = true; finish(false); }
    });
    ta.addEventListener('blur', ()=>finish(true));
  });
}


/* ─── shell ─── */
function render(){
  const root=document.getElementById('view');
  document.getElementById('notesBadge').textContent = NOTES.items.length ? ' '+NOTES.items.length : '';
  document.getElementById('tab-stream').classList.toggle('on', TAB==='stream');
  document.getElementById('tab-lineup').classList.toggle('on', TAB==='lineup');
  document.getElementById('tab-today').classList.toggle('on', TAB==='today');
  document.getElementById('tab-backstory').classList.toggle('on', TAB==='backstory');
  document.getElementById('tab-subjects').classList.toggle('on', TAB==='subjects');
  document.getElementById('tab-subjects').textContent = 'subjects'+(SUBJECTS.length?' ('+SUBJECTS.length+')':'');
  document.getElementById('tab-lineup').textContent = 'lineup'+(LINEUP.length?' ('+LINEUP.length+')':'');
  document.getElementById('tab-backstory').textContent = 'backstory'+(catListAll().length?' ('+catListAll().length+')':'');
  if (TAB==='stream') renderStream(root);
  else if (TAB==='today') renderToday(root);
  else if (TAB==='backstory') renderBackstory(root);
  else if (TAB==='subjects') renderSubjects(root);
  else renderLineup(root);
}
document.getElementById('tab-stream').addEventListener('click',()=>{ TAB='stream'; render(); });
document.getElementById('tab-lineup').addEventListener('click',()=>{ TAB='lineup'; render(); });
document.getElementById('tab-today').addEventListener('click',()=>{ TAB='today'; render(); });
document.getElementById('tab-backstory').addEventListener('click',()=>{ TAB='backstory'; render(); });
document.getElementById('tab-subjects').addEventListener('click',()=>{ TAB='subjects'; render(); });
document.getElementById('notesToggle').addEventListener('click',()=>{ notesOpen=!notesOpen; renderNotes(); });
document.getElementById('gear').addEventListener('click',()=>{
  const p=document.getElementById('settings'); p.classList.toggle('open');
  document.getElementById('set-key').value=SETTINGS.antKey;
  document.getElementById('set-proxy').value=SETTINGS.proxyBase;
  document.getElementById('set-ghtoken').value=SETTINGS.ghToken||'';
  document.getElementById('set-recraftkey').value=SETTINGS.recraftKey||'';
  document.getElementById('set-bodylen').value=SETTINGS.bodyLen;
  document.getElementById('set-maxarts').value=SETTINGS.maxArts;
});
['set-key','set-proxy','set-ghtoken','set-recraftkey','set-bodylen','set-maxarts'].forEach(id=>{
  document.getElementById(id).addEventListener('change',e=>{
    if(id==='set-key') SETTINGS.antKey=e.target.value.trim();
    if(id==='set-proxy') SETTINGS.proxyBase=e.target.value.trim();
    if(id==='set-ghtoken') SETTINGS.ghToken=e.target.value.trim();
    if(id==='set-recraftkey') SETTINGS.recraftKey=e.target.value.trim();
    if(id==='set-bodylen') SETTINGS.bodyLen=Math.max(500,parseInt(e.target.value)||4000);
    if(id==='set-maxarts') SETTINGS.maxArts=Math.min(30,Math.max(5,parseInt(e.target.value)||15));
    saveSettings();
  });
});
function tick(){ document.getElementById('clock').textContent =
  new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}); }
tick(); setInterval(tick,30000);

/* ─── data freshness ───────────────────────────────────────────────
   Pulse fetches its data relative to whatever host serves this file, so a
   host that lags shows a completely normal-looking tool that simply
   recommends worse stories. There is no error to notice — the failure
   presents as bad editorial judgement. Hence a banner rather than the
   11px header note, which is easy to miss and which renderLineup() used
   to clear on the one tab where picks actually get judged.

   Thresholds allow real slack: the scan workflow is nominally every 20
   minutes but GitHub's free tier runs it closer to hourly, and the full
   pipeline is every 4 hours. */
const STALE_LIMITS = { stream: 3, lineup: 9 };   // hours

function ageHours(iso){
  if (!iso) return null;
  const h = (Date.now() - new Date(iso)) / 3600000;
  return isFinite(h) ? h : null;
}
function ageWords(h){
  if (h < 1)  return Math.max(1, Math.round(h * 60)) + ' minutes old';
  if (h < 36) return (h < 10 ? h.toFixed(1) : Math.round(h)) + ' hours old';
  return Math.round(h / 24) + ' days old';
}

function renderStaleBanner(){
  const el = document.getElementById('staleBanner');
  if (!el) return;

  const bad = [];
  const s = ageHours(STREAM && STREAM.updated);
  if (s !== null && s > STALE_LIMITS.stream)  bad.push('Stream is ' + ageWords(s));
  const l = ageHours(EDITION && EDITION.assembled_at);
  if (l !== null && l > STALE_LIMITS.lineup)  bad.push('Lineup is ' + ageWords(l));

  if (!bad.length){ el.className = ''; el.innerHTML = ''; return; }

  // The known trap: netlify.toml's build-skip rule excludes ntk-pulse/data/,
  // so the scan pipelines' commits never deploy and this host's copy freezes
  // until a publish. Name it directly rather than blaming the workflow.
  const host = location.hostname;
  const netlifyServed = host === 'ntknews.org' || host.endsWith('.netlify.app');
  const why = netlifyServed
    ? 'This host does not receive Pulse data updates — <code>netlify.toml</code> skips deploys for commits that only touch <code>ntk-pulse/data/</code>. Use the GitHub&nbsp;Pages copy: <a href="https://maxzimbert.github.io/ntknews/ntk-pulse/pulse.html">maxzimbert.github.io/ntknews/ntk-pulse/pulse.html</a>'
    : 'The scan workflow may not have run. Check the Actions tab.';

  el.innerHTML = '<b>Stale data — recommendations below are not current.</b> '
    + bad.join(' · ') + '.<span class="sb-why">' + why + '</span>';
  el.className = 'show';
}

fetch('data/clusters.json?t='+Date.now())
  .then(r=>{ if(!r.ok) throw 0; return r.json(); })
  .then(d=>{ STREAM=d; syncEditionToLineup(); render(); renderStaleBanner(); })
  .catch(()=>{ STREAM=null; render(); });

// The assembled edition. Absent until the workflow's Assemble step has run —
// a 404 here is normal, not an error worth surfacing.
fetch('data/lineup.json?t='+Date.now())
  .then(r=>{ if(!r.ok) throw 0; return r.json(); })
  .then(d=>{ EDITION=d; syncEditionToLineup(); render(); renderStaleBanner(); })
  .catch(()=>{ EDITION=null; });

// T-0037. Absent until the newscast workflow's first commit — a 404 here
// is normal, not an error worth surfacing, same posture as lineup.json.
fetch('data/newscasts/today.json?t='+Date.now())
  .then(r=>{ if(!r.ok) throw 0; return r.json(); })
  .then(d=>{ NEWSCAST=d; render(); })
  .catch(()=>{ NEWSCAST=null; });

fetchLastPublished();

// The Backstory row library, for the per-story tag in the Lineup tab (T-0010).
// Fired at startup rather than on first visit to the Backstory tab, because the
// control lives in Lineup and would otherwise be invisible until the editor
// happened to open a different tab.
loadBsrRows();
