<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pulse</title>
<style>
  /* Deliberately undesigned. Memeorandum register: text-forward, dense. */
  :root {
    --ink: #111; --dim: #777; --faint: #aaa; --link: #1a0dab;
    --rule: #ddd; --certified: #0a7a2f; --stale: #b03a00; --warn: #a05a00;
    --card: #fafafa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto; max-width: 840px; padding: 14px 16px 80px;
    font: 13px/1.45 Verdana, Geneva, "DejaVu Sans", sans-serif;
    color: var(--ink); background: #fff;
  }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font: inherit; cursor: pointer; }
  input, textarea, select { font: 12px/1.4 Verdana, sans-serif; color: var(--ink);
    border: 1px solid var(--rule); background: #fff; padding: 4px 6px; }
  textarea { width: 100%; resize: vertical; }

  header {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    border-bottom: 2px solid var(--ink); padding-bottom: 6px; margin-bottom: 12px;
  }
  header h1 { font-size: 17px; margin: 0; letter-spacing: 1px; }
  .tab { background: none; border: none; font-size: 12px; color: var(--dim); padding: 0; letter-spacing: 0.5px; }
  .tab.on { color: var(--ink); font-weight: bold; border-bottom: 2px solid var(--ink); }
  header .meta { color: var(--dim); font-size: 11px; }
  header .stale { color: var(--stale); font-size: 11px; }
  header .right { margin-left: auto; display: flex; gap: 10px; align-items: baseline; }
  header .count { color: var(--dim); font-size: 11px; }
  .gear { background: none; border: none; color: var(--dim); font-size: 13px; }

  /* Settings drawer */
  #settings { border: 1px solid var(--rule); background: var(--card); padding: 10px; margin-bottom: 12px; display: none; }
  #settings.open { display: block; }
  #settings label { display: block; font-size: 10.5px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px; margin: 8px 0 2px; }
  #settings input { width: 100%; max-width: 480px; }
  #settings .row { display: flex; gap: 16px; flex-wrap: wrap; }
  #settings .note { font-size: 11px; color: var(--dim); margin-top: 8px; }

  /* Stream */
  .cluster { padding: 7px 0; border-bottom: 1px solid var(--rule); }
  .cluster.no-verdict-no { opacity: 0.55; }
  .hed { font-size: 13.5px; font-weight: bold; cursor: pointer; }
  .hed:hover { text-decoration: underline; }
  .meta-line { font-size: 11px; color: var(--dim); margin-top: 2px; }
  .beat { text-transform: uppercase; letter-spacing: 0.5px; font-size: 10px; font-weight: bold; margin-right: 6px; }
  .beat-national { color: #8a1f1f; } .beat-international { color: #1f4d8a; }
  .beat-tech { color: #5a2d82; } .beat-health { color: #0a7a2f; }
  .beat-education { color: #a05a00; } .beat-science { color: #006b6b; }
  .beat-business { color: #705500; } .beat-culture { color: #8a1f6e; }
  .beat-other { color: var(--dim); }
  .line { font-size: 12px; color: #444; margin-top: 2px; }
  .articles { display: none; margin: 6px 0 2px; padding-left: 12px; border-left: 2px solid var(--rule); }
  .cluster.open .articles { display: block; }
  .article { font-size: 12px; padding: 2px 0; }
  .article .pub { font-weight: bold; color: #333; }
  .article .t { color: var(--faint); font-size: 10.5px; }
  .article.suppressed a { text-decoration: line-through; color: var(--faint); }
  .article.suppressed .pub { color: var(--faint); }
  .x {
    background: none; border: none; color: var(--faint); font-size: 11px;
    padding: 0 3px; line-height: 1;
  }
  .x:hover { color: var(--stale); }
  .article.suppressed .x { color: var(--stale); }
  .certify { margin-top: 5px; font: bold 10.5px Verdana, sans-serif; padding: 2px 8px;
    border: 1px solid var(--dim); background: #fff; color: var(--ink); }
  .certify.done { border-color: var(--certified); color: var(--certified); }
  .cluster.solo { padding: 3px 0; border-bottom: 1px dotted var(--rule); }
  .cluster.solo .hed { font-weight: normal; font-size: 12.5px; }
  .empty { color: var(--dim); padding: 30px 0; }

  /* Lineup */
  .story {
    border: 1px solid var(--rule); background: var(--card);
    padding: 10px 12px; margin-bottom: 10px;
  }
  .story-top { display: flex; gap: 8px; align-items: baseline; }
  .ord { font-size: 15px; font-weight: bold; color: var(--ink); min-width: 38px; max-width: 38px;
    text-align: center; border: 1px solid var(--rule); background: transparent; padding: 1px 2px; }
  .ord:focus { outline: 1px solid var(--dim); background: #fff; }
  .drag-handle { cursor: grab; color: var(--faint); font-size: 14px; padding: 0 2px; user-select: none; }
  .story.dragging { opacity: 0.4; }
  .story.drag-over { border-top: 2px solid var(--certified); }
  .story-title { flex: 1; font-weight: bold; font-size: 13px; border: none; background: transparent; width: 100%; padding: 0; }
  .story-title:focus { outline: 1px solid var(--rule); background: #fff; }
  .mini { background: none; border: 1px solid var(--rule); color: var(--dim); font-size: 10.5px; padding: 1px 6px; }
  .mini:hover { color: var(--ink); border-color: var(--dim); }
  .mini:disabled { opacity: 0.4; cursor: default; }
  .mini.primary { border-color: var(--ink); color: var(--ink); font-weight: bold; }
  .mini.go { border-color: var(--certified); color: var(--certified); font-weight: bold; }
  .angle-row { display: flex; gap: 6px; margin-top: 6px; align-items: flex-start; }
  .angle-row textarea { flex: 1; min-height: 34px; }
  .story-meta { font-size: 10.5px; color: var(--dim); margin-top: 5px; display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
  .story-status { font-size: 11px; color: var(--warn); margin-top: 4px; min-height: 14px; }
  .story-status.err { color: var(--stale); }
  .pkg { margin-top: 8px; border-top: 1px dotted var(--rule); padding-top: 6px; }
  .pkg .article { display: flex; gap: 6px; align-items: baseline; }
  .pkg .article .grow { flex: 1; }
  .chip { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.4px; padding: 0 4px; border: 1px solid var(--rule); color: var(--dim); white-space: nowrap; }
  .chip.body { border-color: var(--certified); color: var(--certified); }
  .chip.thin { border-color: var(--warn); color: var(--warn); }
  .chip.dup { border-color: var(--faint); color: var(--faint); }
  .chip.xstory { border-color: #1f4d8a; color: #1f4d8a; }
  .chip.ctx { border-color: #5a2d82; color: #5a2d82; }
  .chip.arc { border-color: #006b6b; color: #006b6b; }
  .ctx-row { display: flex; gap: 6px; margin-top: 6px; align-items: flex-start; }
  .concept-row { display: flex; gap: 6px; margin-top: 6px; align-items: baseline; flex-wrap: wrap; }
  .concept-row input[type=text] { min-width: 160px; }
  .concept-row .kw { max-width: 120px; }
  .concept-status { font-size: 10.5px; }
  .concept-status.ok { color: var(--certified); }
  .concept-status.miss { color: var(--stale); }
  .concept-status.unchecked { color: var(--dim); }
  .ctx-row textarea { flex: 1; min-height: 30px; font-size: 11px; }
  .ctx-note { font-size: 11.5px; color: #444; margin: 2px 0 4px 12px; border-left: 2px solid var(--rule); padding-left: 8px; }
  .qpanel { border: 1px dashed var(--rule); padding: 8px 10px; margin-bottom: 12px; }
  .qpanel .qrow { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .qpanel input[type=text] { flex: 1; min-width: 160px; }
  .qpanel .qres { font-size: 12px; padding: 2px 0; display: flex; gap: 6px; align-items: baseline; }
  .selbar { position: sticky; top: 0; background: #fff; border-bottom: 2px solid var(--ink);
    padding: 6px 0; margin-bottom: 8px; display: none; gap: 8px; align-items: baseline; z-index: 5; }
  .selbar.show { display: flex; }
  .selchk { margin-right: 6px; }
  .cluster.selected { background: #fffbe6; }
  @media (prefers-color-scheme: dark) { .selbar { background: #141414; } .cluster.selected { background: #2a2610; } }
  .manual-badge { background: #5a2d82; color: #fff; font-size: 9.5px; padding: 0 5px;
    text-transform: uppercase; letter-spacing: 0.5px; margin-right: 6px; }
  .rescan-sugg { margin: 6px 0 0 12px; border-left: 2px solid var(--rule); padding-left: 8px; }
  .rescan-sugg .article { display: flex; gap: 6px; align-items: baseline; font-size: 11.5px; }
  .rescan-sugg .why { color: var(--dim); font-size: 10px; }
  .mc-search { border: 1px dashed var(--rule); padding: 6px 8px; margin-top: 6px; font-size: 12px; }
  .qpanel .qres label { flex: 1; }
  .addurl { display: flex; gap: 6px; margin-top: 6px; }
  .addurl input { flex: 1; }
  .out { margin-top: 10px; border-top: 1px solid var(--rule); padding-top: 8px; }
  .out h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); margin: 12px 0 4px; }
  .out .body { font-size: 12.5px; line-height: 1.55; }
  .out .body p { margin: 0 0 8px; }
  .out .body { cursor: text; }
  .out .body:hover { background: rgba(0,0,0,0.02); }
  .out .body-edit { font: 12.5px/1.55 Verdana, sans-serif; width: 100%; min-height: 120px;
    border: 1px solid var(--ink); padding: 6px 8px; resize: vertical; color: var(--ink); background: #fff; }
  .img-row { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
  .img-thumb { width: 54px; height: 34px; object-fit: cover; border: 1px solid var(--rule); }
  .img-thumb-empty { width: 54px; height: 34px; border: 1px dashed var(--rule); display: flex;
    align-items: center; justify-content: center; font-size: 9px; color: var(--dim); }
  .img-row input[type=file] { display: none; }
  .edited-badge { font-size: 9px; color: var(--warn); text-transform: uppercase;
    letter-spacing: .5px; margin-left: 6px; border: 1px solid var(--warn); padding: 0 4px; }
  @media (prefers-color-scheme: dark) { .out .body-edit { background: #101010; } .out .body:hover { background: rgba(255,255,255,0.04); } }
  .ntk-pullquote { border-left: 3px solid var(--ink); margin: 10px 0; padding: 4px 10px; }
  .ntk-pq-text { font-size: 13px; font-style: italic; margin: 0; }
  .ntk-pq-cite { font-size: 10.5px; color: var(--dim); }
  .ntk-stat { margin: 10px 0; }
  .ntk-stat-num { font-size: 18px; font-weight: bold; }
  .ntk-stat-ctx { font-size: 11px; color: var(--dim); }
  .lineup-bar { display: flex; gap: 8px; margin-bottom: 12px; align-items: baseline; flex-wrap: wrap; }
  .lineup-bar .spacer { flex: 1; }
  .copied { color: var(--certified); font-size: 10.5px; }
  .ed-head { border: 1px solid var(--rule); background: var(--card); padding: 10px; margin-bottom: 12px; }
  .ed-head .row { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; align-items: baseline; }
  .ed-head .k { color: var(--dim); text-transform: uppercase; font-size: 10px; letter-spacing: .5px; }
  .lint { margin-top: 8px; }
  .lint-ok { color: var(--certified); font-size: 12px; font-weight: bold; }
  .lint-fail { color: var(--stale); font-size: 12px; padding: 2px 0; }
  .ed-story { border-bottom: 1px solid var(--rule); padding: 8px 0; }
  .slot-tag { display: inline-block; background: var(--ink); color: #fff; font-size: 9.5px;
    text-transform: uppercase; letter-spacing: .5px; padding: 1px 6px; margin-right: 7px; }
  .sc { display: inline-block; font-size: 10px; margin-right: 8px; color: var(--dim); }
  .sc b { color: var(--ink); font-size: 11px; }
  .sc.hot b { color: var(--stale); }
  .sc.good b { color: var(--certified); }
  .facts { font-size: 11.5px; color: #444; margin: 4px 0 0 12px; border-left: 2px solid var(--rule); padding-left: 8px; }
  .killed { margin-top: 14px; border-top: 1px dashed var(--rule); padding-top: 8px; }
  .killed .k-item { font-size: 11px; color: var(--dim); padding: 1px 0; }
  @media (prefers-color-scheme: dark) { .slot-tag { background: #ddd; color: #111; } }
  #notesPanel { border: 1px solid var(--rule); background: var(--card); padding: 10px; margin-bottom: 12px; display: none; }
  #notesPanel.open { display: block; }
  .note-add { display: flex; gap: 6px; margin-bottom: 8px; }
  .note-add textarea { flex: 1; min-height: 32px; }
  .note-item { border-top: 1px dotted var(--rule); padding: 6px 0; }
  .note-item textarea { width: 100%; min-height: 30px; font-size: 12px; }
  .note-meta { font-size: 10.5px; color: var(--dim); display: flex; gap: 10px; margin-top: 3px; flex-wrap: wrap; align-items: baseline; }
  .note-flags { font-size: 11px; color: #444; margin: 4px 0 0 10px; border-left: 2px solid var(--rule); padding-left: 8px; }
  .note-flags div { margin-bottom: 2px; }
  .promoted-box { margin-top: 6px; border: 1px dashed var(--certified); padding: 6px 8px; font-size: 12px; }
  .sec-h { display: flex; gap: 8px; align-items: baseline; }
  .sec-h .mini { font-size: 9.5px; padding: 0 5px; }
  .revise-box, .flag-box { display: none; margin: 4px 0 8px; gap: 6px; }
  .revise-box.open, .flag-box.open { display: flex; }
  .revise-box textarea { flex: 1; min-height: 28px; font-size: 11.5px; }
  .flag-box select { font-size: 11.5px; }
  .flag-box input[type=text] { flex: 1; font-size: 11.5px; }

  @media (prefers-color-scheme: dark) {
    body { background: #141414; }
    :root { --ink: #ddd; --dim: #909090; --faint: #6a6a6a; --link: #8ab4f8; --rule: #333; --card: #1b1b1b; }
    header { border-color: var(--ink); }
    .line { color: #b5b5b5; }
    .article .pub { color: #ccc; }
    .certify, input, textarea, select { background: transparent; color: var(--ink); }
    .story-title:focus { background: #101010; }
  }
</style>
</head>
<body>
<header>
  <h1>PULSE</h1>
  <button class="tab on" id="tab-stream">stream</button>
  <button class="tab" id="tab-lineup">lineup</button>
  <span class="meta" id="clock"></span>
  <span class="stale" id="stale"></span>
  <span class="right">
    <span class="count" id="count"></span>
    <button class="gear" id="notesToggle" title="editorial notes">📝<span id="notesBadge"></span></button>
    <button class="gear" id="gear" title="settings">⚙</button>
  </span>
</header>

<div id="notesPanel"></div>

<div id="settings">
  <div class="row">
    <div style="flex:1;min-width:260px">
      <label>Anthropic API key</label>
      <input id="set-key" type="password" placeholder="sk-ant-…">
      <label>Netlify proxy base (where ntk-production lives)</label>
      <input id="set-proxy" type="text" placeholder="https://your-site.netlify.app">
      <label>GitHub token (scoped: contents write, this repo only) — powers Publish</label>
      <input id="set-ghtoken" type="password" placeholder="github_pat_…">
      <label>Recraft API key — powers Generate photo</label>
      <input id="set-recraftkey" type="password" placeholder="paste from Recraft → profile → API">
    </div>
    <div>
      <label>Body chars per article</label>
      <input id="set-bodylen" type="number" min="500" max="8000" step="500" style="width:90px">
      <label>ER articles per story</label>
      <input id="set-maxarts" type="number" min="5" max="30" style="width:90px">
    </div>
  </div>
  <div class="note">Key and settings live in this browser's localStorage only. The proxy base is the domain where ntk-production.html is served — its Netlify functions do the EventRegistry and body fetching.</div>
</div>

<main id="view"><div class="empty">Loading…</div></main>

<script>
/* ═══ NTK PULSE v2 — monitoring stream + lineup CMS ═══
   Stream: reads data/clusters.json from the pipeline (unchanged).
   Lineup: certify snapshots a cluster; suppress-x prunes links; ER
   enrichment builds the source package; v14 Jefferson prompts generate
   truths/probabilities/possibilities/lies; export produces the
   digest/index.html stories-array block. All state in localStorage. */

const SECS = ['truths','probabilities','possibilities','lies'];
const TODAY = new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
// USA Today-style section names — plain, reader-facing nouns rather than
// policy-desk language. 'Under-Reported' and 'Orienting' are NTK's own
// editorial curation tags (not subject-matter sections) and have no USA
// Today equivalent, so they stay. Renamed 2026-08-14.
const CATEGORIES = ['World','Nation','Politics','Money','Tech','Health','Life','Under-Reported','Orienting'];
const BEAT_TO_CAT = { national:'Nation', international:'World', business:'Money',
  tech:'Tech', science:'Tech', health:'Health', education:'Life', culture:'Life', other:'Nation' };
const LINEUP_MAX = 8;

/* ─── persisted state ─── */
const LS = {
  settings:  'ntk_pulse_settings_v1',
  lineup:    'ntk_pulse_lineup_v1',
  sup:       'ntk_pulse_suppressed_v1',
  notes:     'ntk_pulse_notes_v1',
  manual:    'ntk_pulse_manual_clusters_v1',
  dismissed: 'ntk_pulse_dismissed_candidates_v1',
};
function load(k, fallback) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? fallback; } catch { return fallback; } }
let SETTINGS = load(LS.settings, { antKey:'', proxyBase:'', ghToken:'', recraftKey:'', bodyLen:4000, maxArts:15 });
let LINEUP = load(LS.lineup, []);          // [{id, title, angle, beat, category, conceptEntity, narrowKeyword, articles:[], enrichedAt, packages, busy?, status?, open?, outOpen?}]
let SUP = load(LS.sup, {});                 // canonical url -> true  (editor suppressions, global, persistent)
let DISMISSED = load(LS.dismissed, {});      // candidate key -> true  (recommended-zone dismissals, persistent, reversible)
function saveDismissed(){ localStorage.setItem(LS.dismissed, JSON.stringify(DISMISSED)); }
// Standing editorial notes: ongoing directives that ride into every
// generation call until removed or promoted into v14 itself. genCounter
// increments once per completed generateStory call; each note's baseline
// is the counter's value at the moment it was added, so "stories since"
// only counts generations the note could actually have influenced.
let NOTES = load(LS.notes, { items: [], genCounter: 0 });
let notesOpen = false;
let STREAM = null;                          // clusters.json payload
let TAB = 'lineup';   // Lineup is the homepage — assembled by assembly.py, authored here
function saveSettings(){ localStorage.setItem(LS.settings, JSON.stringify(SETTINGS)); }
function saveLineup(){ const clean = LINEUP.map(({busy,status,err,...s})=>s); localStorage.setItem(LS.lineup, JSON.stringify(clean)); }
function saveSup(){ localStorage.setItem(LS.sup, JSON.stringify(SUP)); }
function saveNotes(){
  const clean = { ...NOTES, items: NOTES.items.map(({busy,...n})=>n) };
  localStorage.setItem(LS.notes, JSON.stringify(clean));
}
function addNote(text){
  if (!text.trim()) return;
  NOTES.items.push({ id:'note-'+Date.now(), text:text.trim(),
    addedAt:new Date().toISOString(), baseline:NOTES.genCounter||0, flags:[] });
  saveNotes(); renderNotes();
}
function removeNote(id){
  if (!confirm('Remove this standing note? It will stop applying to future generations.')) return;
  NOTES.items = NOTES.items.filter(n=>n.id!==id); saveNotes(); renderNotes();
}
function notesBlock(){
  const items = (NOTES.items||[]).filter(n=>n.text && n.text.trim());
  if (!items.length) return '';
  return `\n\nSTANDING EDITORIAL NOTES — ongoing directives from the editor, apply to every section, every story, until told otherwise:\n`+
    items.map(n=>`- ${n.text}`).join('\n');
}
function flagSection(story, sectionName, noteId, newNoteText){
  let note;
  if (noteId==='__new__'){
    if (!newNoteText || !newNoteText.trim()) return;
    note = { id:'note-'+Date.now(), text:newNoteText.trim(), addedAt:new Date().toISOString(),
      baseline:NOTES.genCounter||0, flags:[] };
    NOTES.items.push(note);
  } else {
    note = NOTES.items.find(n=>n.id===noteId);
  }
  if (!note) return;
  note.flags.push({ storyId:story.id, title:story.title, section:sectionName,
    snippet:(story.packages[sectionName]||'').slice(0,180), flaggedAt:new Date().toISOString() });
  saveNotes();
  if (notesOpen) renderNotes(); else render();  // flag can be triggered while the notes panel is closed
}
async function promoteNote(note){
  note.busy = true; renderNotes();
  try {
    const examples = note.flags.slice(-5).map(f=>`- (${f.section}, "${f.title}"): "${f.snippet}"`).join('\n');
    const prompt = `You are editing the NTK News v14 editorial prompt system. An editor has been applying this standing note across recent output: "${note.text}"\n\n`+
      (examples?`Flagged examples of the pattern in actual output:\n${examples}\n\n`:'')+
      `Write ONE terse rule line in the EXACT house style of these existing v14 rules — absolute, imperative, no explanation, one sentence, no preamble:\n"No exclamation points."\n"No benefit claims."\n"Never re-establish facts from prior sections."\n\nReturn ONLY the new rule line. No quotes around it, no commentary.`;
    note.promotedText = (await ai(prompt, 200)).trim();
  } catch(e){ note.promotedText = '[Promote failed: '+e.message+']'; }
  note.busy = false; saveNotes(); renderNotes();
}

/* ─── utils ─── */
function esc(s){ const d=document.createElement('span'); d.textContent=s==null?'':s; return d.innerHTML; }
function rel(iso){ if(!iso) return ''; const m=Math.round((Date.now()-new Date(iso))/60000);
  if(m<1) return 'now'; if(m<60) return m+'m'; const h=m/60; return (h<10?h.toFixed(1):Math.round(h))+'h'; }
function pubList(p){ return p.length<=3 ? p.join(', ') : p.slice(0,3).join(', ')+' +'+(p.length-3); }

// Canonical URL: identity key for suppression + RSS/ER dedup (layer 2).
const TRACK_PARAMS = /^(utm_|fbclid|gclid|mc_cid|mc_eid|cmpid|ref$|smid|ocid|ito)/i;
function canon(u){
  try {
    const url = new URL(u);
    let host = url.hostname.toLowerCase().replace(/^(www|m|amp)\./,'');
    let path = url.pathname.replace(/\/amp\/?$/,'/').replace(/\/+$/,'') || '/';
    const keep = [];
    url.searchParams.forEach((v,k)=>{ if(!TRACK_PARAMS.test(k)) keep.push(k+'='+v); });

// Syndication detection (layer 3): 8-word shingle Jaccard over body text.
function shingles(text, n=8){
  const w = (text||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(Boolean);
  const out = new Set();
  for (let i=0; i+n<=w.length; i++) out.add(w.slice(i,i+n).join(' '));
  return out;
}
function jaccard(a,b){ if(!a.size||!b.size) return 0; let inter=0;
  const [s,l]=a.size<b.size?[a,b]:[b,a]; for(const x of s) if(l.has(x)) inter++;
  return inter/(a.size+b.size-inter); }
function titleTokens(t){ return new Set((t||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(x=>x.length>2)); }

function parseJSON(raw){
  let c = raw.trim().replace(/^```json?\n?/,'').replace(/\n?```$/,'').trim();
  const i = c.indexOf('['); const j = c.indexOf('{');
  if (i>0 && (j<0 || i<j)) c = c.slice(i);
  else if (j>0 && (i<0 || j<i)) c = c.slice(j);
  try { return JSON.parse(c); }
  catch (e) {
    // Truncated mid-array (a max_tokens ceiling hit on a big response) —
    // salvage whatever complete top-level objects exist before the cutoff
    // rather than losing the entire batch to one unterminated string.
    // Same principle already proven in ledger.py's Python-side parser.
    if (c.trim().startsWith('[')){
      const objs = []; let depth = 0, start = -1, inStr = false, esc = false;
      for (let k = 0; k < c.length; k++){
        const ch = c[k];
        if (inStr){
          if (esc) esc = false;
          else if (ch === '\\') esc = true;
          else if (ch === '"') inStr = false;
          continue;
        }
        if (ch === '"') { inStr = true; continue; }
        if (ch === '{'){ if (depth === 0) start = k; depth++; }
        else if (ch === '}'){ depth--; if (depth === 0 && start >= 0){
          try { objs.push(JSON.parse(c.slice(start, k+1))); } catch {}
        }}
      }
      if (objs.length) return objs;
    }
    throw e;
  }
}

/* ─── API plumbing (ported from ntk-production) ─── */
async function ai(prompt, maxTok=1500){
  if (!SETTINGS.antKey) throw new Error('No Anthropic key — set it in ⚙');
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':SETTINGS.antKey,
      'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    // thinking explicitly disabled (2026-08-17): Sonnet 5 defaults to
    // adaptive thinking when this is omitted, and thinking tokens draw
    // from the SAME max_tokens ceiling as the response text — confirmed
    // in Anthropic's own Sonnet 5 migration notes. That's what produced
    // "[Generation failed: No text content in response (content blocks:
    // thinking)]" on Truths and a mid-word truncation on Possibilities:
    // thinking consumed most or all of the budget before any real text
    // came out, and how much it consumes varies call to call — the same
    // section can succeed on one run and fail on the next. None of Pulse's
    // editorial writing is the kind of multi-step logical/math task
    // thinking is built for, so disabling it trades a marginal, unproven
    // quality gain for actually reliable output.
    body:JSON.stringify({model:'claude-sonnet-5',max_tokens:maxTok,
      thinking:{type:'disabled'},messages:[{role:'user',content:prompt}]})
  });
  const d = await r.json();
  if (d.error) throw new Error(d.error.message);
  // Defense in depth, kept even with thinking disabled above: still filter
  // by block type rather than trusting position, matching the pattern
  // triage.py already uses server-side for Haiku. Throws a clear,
  // diagnosable error instead of silently handing undefined to a caller
  // three functions away.
  const blocks = d.content || [];
  const text = blocks.filter(b => b.type === 'text').map(b => b.text || '').join('');
  if (!text) {
    const types = blocks.map(b => b.type).join(', ') || 'empty';
    throw new Error(`No text content in response (content blocks: ${types})`);
  }
  return text;
}
// Recraft image generation. Direct browser call, same convention as ai()
// above — key lives in SETTINGS/localStorage only, never written to a file.
// Style is optional and only meaningful on V2/V3 models; the model choice
// itself (not the style string) is what determines raster vs vector output
// — anything ending _vector returns SVG.
// NTK brand defaults — applied to every Recraft call automatically so the
// "global rules" live in code, not in something typed per-prompt. Recraft
// itself has no persistent memory between calls; this is how we fake it
// until there's a real style_id (see the style guide, §7).
const NTK_BRAND_COLORS = [
  [7,152,242],   // electric blue
  [242,174,46],  // amber
  [220,101,80],  // terracotta
  [114,90,191],  // purple
  [1,178,167],   // teal
];
const NTK_BRAND_SUFFIX = 'Documentary, restrained composition, no embedded text, no generic corporate iconography.';

async function recraftGenerate(prompt, model, style, size, n, useBrandColors){
  if (!SETTINGS.recraftKey) throw new Error('No Recraft key — set it in ⚙');
  const body = { prompt, model, size, n, response_format:'url' };
  if (style) body.style = style;
  if (useBrandColors) body.controls = { colors: NTK_BRAND_COLORS.map(rgb=>({rgb})) };
  const r = await fetch('https://external.api.recraft.ai/v1/images/generations', {
    method:'POST',
    headers:{ 'Authorization':'Bearer '+SETTINGS.recraftKey, 'Content-Type':'application/json' },
    body: JSON.stringify(body)
  });
  const raw = await r.text();
  if (!r.ok) throw new Error('Recraft error '+r.status+': '+raw.slice(0,400));
  let d; try { d = JSON.parse(raw); } catch { throw new Error('Non-JSON response: '+raw.slice(0,400)); }
  return (d.data||[]).map(x=>x.url).filter(Boolean);
}
function buildImgPrompt(story){
  const seed = [story.title, story.angle].filter(Boolean).join('. ');
  return `Editorial illustration for a news story. ${seed}. `+
    `Clean composition, no embedded text, suitable as a digest card header image.`;
}
// Pulls a generated image down and runs it through the exact same
// compress-to-800px-JPEG-base64 pipeline as handleStoryImageUpload, so a
// Recraft pick lands in story.featuredImage identically to an uploaded
// photo — same schema, same build script decode step downstream. Falls
// back to storing the bare Recraft URL only if the canvas read is blocked
// (cross-origin without CORS headers) — flag that to the reader in status
// if it happens, since a raw URL skips the usual base64-decode-on-build step.
function lockGeneratedImage(story, url){
  story.status = 'Fetching generated image…'; render();
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    try {
      const canvas = document.createElement('canvas');
      const MAX_W = 800, ratio = Math.min(MAX_W / img.width, 1);
      canvas.width = Math.round(img.width * ratio);
      canvas.height = Math.round(img.height * ratio);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      story.featuredImage = canvas.toDataURL('image/jpeg', 0.75);
    } catch (e) {
      // Tainted canvas — CORS blocked the pixel read. Store the direct URL
      // instead so the pick isn't lost; note this differs from the uploaded-
      // photo path and won't go through the base64 decode step in the build script.
      story.featuredImage = url;
      story.status = 'Locked (stored as a direct URL — canvas read was CORS-blocked, so this bypasses the usual base64 export step).';
    }
    story.overlayColor = story.overlayColor || '#0798F2';
    story.overlayOpacity = story.overlayOpacity || 45;
    story.imgGenOpen = false; story.imgCandidates = null;
    saveLineup(); render();
  };
  img.onerror = () => {
    story.status = 'Could not load the generated image (network or CORS). Try again or download and use "add photo" instead.';
    render();
  };
  img.src = url;
}
async function generateStoryImage(story, promptOverride){
  story.imgBusy = true; story.imgErr = ''; render();
  try {
    const prompt = promptOverride || story.imgGenPrompt || buildImgPrompt(story);
    story.imgGenPrompt = prompt; // stored/displayed unsuffixed — suffix is applied silently below
    const model = story.imgGenModel || 'recraftv4_1';
    const styleCompatible = /^recraftv[23]/.test(model);
    const style = styleCompatible ? (story.imgGenStyle || '') : '';
    const size = story.imgGenSize || '1:1';
    const useBrandColors = story.imgGenUseColors !== false; // default on
    const finalPrompt = prompt + ' ' + NTK_BRAND_SUFFIX;
    story.imgCandidates = await recraftGenerate(finalPrompt, model, style, size, 4, useBrandColors);
  } catch (e) {
    story.imgErr = e.message;
  } finally {
    story.imgBusy = false; saveLineup(); render();
  }
}

// Wikimedia Commons search, ranked toward 16:9. The MediaWiki API supports
// anonymous cross-origin calls via origin=* — no key, no CORS uncertainty,
// unlike Recraft. This can't judge "best" editorially — it surfaces
// landscape-leaning candidates with real width/height so you're picking from
// a shortlist instead of scrolling a wall of portrait crops.
async function commonsSearch(query){
  const url = 'https://commons.wikimedia.org/w/api.php?action=query&generator=search'+
    '&gsrsearch='+encodeURIComponent(query)+'&gsrnamespace=6&gsrlimit=40'+
    '&prop=imageinfo&iiprop=url|size|extmetadata&format=json&origin=*';
  const r = await fetch(url);
  if (!r.ok) throw new Error('Commons error '+r.status);
  const d = await r.json();
  const pages = d.query && d.query.pages ? Object.values(d.query.pages) : [];
  const results = pages.map(p=>{
    const info = p.imageinfo && p.imageinfo[0];
    if (!info || !info.width || !info.height) return null;
    const meta = info.extmetadata || {};
    const strip = html => { const d = document.createElement('div'); d.innerHTML = html||''; return d.textContent.trim(); };
    return {
      title: p.title,
      url: info.url,
      width: info.width,
      height: info.height,
      ratio: info.width / info.height,
      credit: strip(meta.Artist && meta.Artist.value) || strip(meta.Credit && meta.Credit.value) || '',
      license: meta.LicenseShortName ? meta.LicenseShortName.value : '',
      attributionRequired: !(meta.LicenseShortName && /public domain|pd-/i.test(meta.LicenseShortName.value))
    };
  }).filter(Boolean)
    .filter(x=>x.ratio > 1.2) // landscape only — drop portrait crops before ranking
    .sort((a,b)=>Math.abs(a.ratio-16/9)-Math.abs(b.ratio-16/9)); // closest to 16:9 first
  return results.slice(0, 12);
}
async function searchStoryCommons(story, queryOverride){
  story.commonsBusy = true; story.commonsErr = ''; render();
  try {
    const q = queryOverride || story.commonsQuery || story.title;
    story.commonsQuery = q;
    story.commonsResults = await commonsSearch(q);
  } catch (e) {
    story.commonsErr = e.message;
  } finally {
    story.commonsBusy = false; saveLineup(); render();
  }
}
// Same lock pipeline as Recraft — compress to the standard 800px JPEG so a
// Commons pick lands in featuredImage identically either way. Commons images
// are served with CORS headers, so the canvas read should succeed; same
// URL-fallback safety net as the Recraft path if it doesn't.
function lockCommonsImage(story, result){
  story.status = 'Fetching Commons image…'; render();
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    try {
      const canvas = document.createElement('canvas');
      const MAX_W = 800, ratio = Math.min(MAX_W / img.width, 1);
      canvas.width = Math.round(img.width * ratio);
      canvas.height = Math.round(img.height * ratio);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      story.featuredImage = canvas.toDataURL('image/jpeg', 0.85);
    } catch (e) {
      story.featuredImage = result.url;
      story.status = 'Locked (stored as a direct URL — canvas read was CORS-blocked).';
    }
    story.featuredImageCredit = result.attributionRequired
      ? (result.credit + (result.license ? ' · ' + result.license : '')).trim()
      : '';
    story.overlayColor = story.overlayColor || '#0798F2';
    story.overlayOpacity = story.overlayOpacity || 45;
    story.commonsOpen = false; story.commonsResults = null;
    saveLineup(); render();
  };
  img.onerror = () => {
    story.status = 'Could not load that Commons image. Try another candidate.';
    render();
  };
  img.src = result.url;
}

function proxyUrl(params){
  const base = (SETTINGS.proxyBase||'').replace(/\/+$/,'');
  if (!base) throw new Error('No proxy base — set the Netlify domain in ⚙');
  return base + '/.netlify/functions/news?' + new URLSearchParams(params);
}
async function netlifyFetch(params){
  const r = await fetch(proxyUrl(params));
  const raw = await r.text();
  if (!r.ok) throw new Error('Proxy error '+r.status+': '+raw.slice(0,400));
  let data;
  try { data = JSON.parse(raw); }
  catch {
    // EventRegistry sometimes rejects a request with a plain-text response
    // (bad/foreign key, account issue) instead of JSON — that response was
    // getting truncated to a few characters by the generic "not valid
    // JSON" parse error. Surface the actual sentence instead.
    throw new Error('Non-JSON response: '+raw.slice(0,400));
  }
  // The proxy always answers 200 even when EventRegistry itself failed
  // internally (bad key, exhausted quota, malformed request) — ER expresses
  // that as {"error": "..."} in the body, not an HTTP error code. Without
  // this check that failure looks identical to "zero real results."
  if (data && typeof data.error === 'string') throw new Error('EventRegistry: '+data.error);
  if (Array.isArray(data)) return data;
  if (data.events?.results) return data.events.results;
  return data.articles?.results || [];
}
async function fetchUrlBody(url){
  try {
    const r = await fetch(proxyUrl({mode:'fetch-url', url}));
    if (!r.ok) return {url, title:'', body:''};
    const d = await r.json();
    return {url, title:d.title||'', body:d.body||d.description||''};
  } catch { return {url, title:'', body:''}; }
}

READER CONTEXT: The reader has already read Truths, Probabilities, and Possibilities. Do not re-establish the factual record already laid out there. Name the lie, show the mechanism, and move — the reader already knows what actually happened.

Lies are false or manipulative narratives in active circulation by identifiable actors. Not honest disagreements — deliberate distortion.

- Name the claim and who makes it. "Some people say" is not NTK's voice.
- Show why someone would believe it — what fear or need it answers — then who actually benefits from it spreading: clout, cash, or power. Vary the construction item to item; don't reuse the same sentence shape twice in one section.

function makePrompt(section, articlesText, suppUrls) {
  const suppBlock = suppUrls && suppUrls.length
    ? '\n\nEDITOR-IMPORTED SOURCES:\n' + suppUrls.map(u=>`URL: ${u.url}\n${u.body||'[unavailable]'}`).join('\n\n---\n\n')
    : '';
  const visualBlock = `

VISUAL MARKERS — insert at most one of each per section, only when the element genuinely earns it:

[PULLQUOTE: "verbatim quote from a named source in your articles" | Speaker Name, role or context]
Use only when a direct quote does something your prose cannot — not to break up text. Must be verbatim. Must name the speaker. Place inline where the quote lands in the narrative.
This marker IS your one allowed direct quote for the section (see VOICE_REF rule 3) — it is not a second, separate quote opportunity. If you use PULLQUOTE, do not also render that same line as a quoted sentence in the surrounding prose; paraphrase the moment in prose instead and let the marker carry the verbatim words.

[STAT: the number with its unit | one plain sentence of what it means]
Use only when a specific number is the sharpest way to land the stakes. The number should be surprising or concrete enough to stop the reader. Not a decoration.

A section without a visual marker is not incomplete. Omit both if neither earns its place.`;
  return `${GLOBAL}\n\n${VOICE_REF}\n\n${SEC_PROMPTS[section]}${visualBlock}${suppBlock}\n\nARTICLES TO ANALYZE:\n\n${articlesText}`;
}

/* ─── export (ported from ntk-production) ─── */
function jsEsc(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/\r?\n/g,' ').trim(); }
function extractTruthsTags(text){
  const grab = (tag)=>{ const m=text.match(new RegExp('\\['+tag+':\\s*([\\s\\S]*?)\\]')); return m?m[1].trim():''; };
  return { headline: grab('HEADLINE'), lede: grab('LEDE'),
    body: text.replace(/\[HEADLINE:[\s\S]*?\]/,'').replace(/\[LEDE:[\s\S]*?\]/,'').replace(/\[SUBHEAD:[\s\S]*?\]/,'').trim() };
}
function mdToHtml(text){
  const marks=[];
  let out = text.replace(/\[PULLQUOTE:\s*"([^"]+)"\s*\|\s*([^\]]+)\]/g,(f,quote,speaker)=>{
    marks.push({quote,speaker}); return `\u0000PQ${marks.length-1}\u0000`; });
  marks.forEach(({quote})=>{ if(!quote) return;
    const escaped = quote.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    out = out.replace(new RegExp('["\u201c]'+escaped+'["\u201d][,.]?\\s*','g'),''); });
  marks.forEach((m,i)=>{ out = out.replace(`\u0000PQ${i}\u0000`,
    `<div class="ntk-pullquote"><p class="ntk-pq-text">${m.quote}</p><cite class="ntk-pq-cite">${m.speaker}</cite></div>`); });
  return out
    .replace(/\[STAT:\s*([^|\]]+?)\s*\|\s*([^\]]+?)\s*\]/g,
      '<div class="ntk-stat"><div class="ntk-stat-num">$1</div><div class="ntk-stat-ctx">$2</div></div>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g,'<em>$1</em>')
    .replace(/\(\[([^\]]+)\]\(([^)]+)\)\)/g,'(<a href="$2" target="_blank" rel="noopener">$1</a>)')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function toSiteHtml(text){
  const blocks=[];
  let t = text
    .replace(/\[PULLQUOTE:\s*"([^"]+)"\s*\|\s*([^\]]+)\]/g,(m,quote,speaker)=>{
      blocks.push(`<div class="ntk-pullquote"><p class="ntk-pq-text">${quote}</p><cite class="ntk-pq-cite">${speaker}</cite></div>`);
      return `\n\n\u0000BLOCK${blocks.length-1}\u0000\n\n`; })
    .replace(/\[STAT:\s*([^|\]]+?)\s*\|\s*([^\]]+?)\s*\]/g,(m,num,ctx)=>{
      blocks.push(`<div class="ntk-stat"><div class="ntk-stat-num">${num}</div><div class="ntk-stat-ctx">${ctx}</div></div>`);
      return `\n\n\u0000BLOCK${blocks.length-1}\u0000\n\n`; })
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g,'<em>$1</em>')
    .replace(/\(\[([^\]]+)\]\(([^)]+)\)\)/g,'(<a href="$2" target="_blank" rel="noopener">$1</a>)')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return t.split(/\n{2,}/).map(p=>p.trim()).filter(Boolean).map(p=>{
    const m=p.match(/^\u0000BLOCK(\d+)\u0000$/);
    return m ? blocks[+m[1]] : (p.startsWith('<p')?p:`<p>${p}</p>`);
  }).join('');
}
// Same compression pipeline as editor.html's proven handleImageUpload —
// resize to 800px max width preserving aspect ratio, JPEG at 75% quality,
// stored as base64 directly on the story. Ported rather than reimplemented
// so behavior matches exactly what's already been working there.
function handleStoryImageUpload(story, file){
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const MAX_W = 800, ratio = Math.min(MAX_W / img.width, 1);
      canvas.width = Math.round(img.width * ratio);
      canvas.height = Math.round(img.height * ratio);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      story.featuredImage = canvas.toDataURL('image/jpeg', 0.75);
      story.overlayColor = story.overlayColor || '#0798F2';
      story.overlayOpacity = story.overlayOpacity || 45;
      saveLineup(); render();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

  delete story.featuredImage; delete story.overlayColor; delete story.overlayOpacity; delete story.featuredImageCredit;
  saveLineup(); render();
}

function toSiteStoryBlock(story){

function inLineup(key){ return LINEUP.some(s=>s.key===key); }
function certify(cluster){
  const existing = LINEUP.findIndex(s=>s.key===cluster.key);
  if (existing>=0){ LINEUP.splice(existing,1); saveLineup(); render(); return; }
  if (LINEUP.length>=LINEUP_MAX){ alert('Lineup is full ('+LINEUP_MAX+'). Remove a story first.'); return; }
  // SNAPSHOT: copy title + links now. The stream churns between runs; the
  // lineup doesn't. Re-certify (toggle off, toggle on) to pick up new links.
  // Items that have been extracted elsewhere are excluded — they're no
  // longer this cluster's active content, even though the underlying data
  // is left untouched (non-destructive, so rescan/undo still works).
  const extracted = EXTRACTED_ELSEWHERE.get(cluster.key);
  const activeItems = extracted ? cluster.items.filter(it=>!extracted.has(it.id)) : cluster.items;
  LINEUP.push({
    id: 'ln-'+Date.now(), key: cluster.key,
    title: cluster.title, beat: (cluster.triage&&cluster.triage.beat)||cluster.beat_hint||'other',
    category: BEAT_TO_CAT[(cluster.triage&&cluster.triage.beat)||cluster.beat_hint||'other']||'Nation',
    categoryCustom: '',
    angle: (cluster.triage&&cluster.triage.line)||'',
    conceptEntity:'', narrowKeyword:'',
    articles: activeItems.map(it=>({
      url: it.url, title: it.title, source: it.publisher, date: it.published||'',
      body:'', bodyFrom:'', included:true, dupOf:null, origin:'rss'
    })),
    enrichedAt: null, packages: null, open: true, outOpen: false,
  });
  saveLineup(); render();
}
function removeStory(id){ LINEUP = LINEUP.filter(s=>s.id!==id); saveLineup(); render(); }
function clearLineup(){
  if (!LINEUP.length) return;
  if (!confirm(`Remove all ${LINEUP.length} stories from the lineup? This clears drafts, angles, and generated packages for every story currently in the digest. This can't be undone.`)) return;
  LINEUP = [];
  saveLineup();
  render();
}
// Replaces the old up/down-arrow moveStory — reordering now happens by
// drag-and-drop or by typing a target position directly, both funneling
// into this one function. Moves the story to a 1-indexed target position,
// shifting everything between its old and new spot rather than swapping
// pairwise, so typing "1" on the last story actually jumps it to the
// front in one move instead of needing N-1 arrow clicks to get there.
function reorderStory(id, targetPos){
  const from = LINEUP.findIndex(s=>s.id===id);
  if (from < 0) return;
  const to = Math.max(0, Math.min(LINEUP.length - 1, targetPos - 1));
  if (from === to) return;
  const [story] = LINEUP.splice(from, 1);
  LINEUP.splice(to, 0, story);
  saveLineup(); render();
}
function setStatus(story, msg, err){ story.status=msg; story.err=!!err; render(); }

// One Haiku call drafts angle + concept targeting together.
// Same craft rules as the default triage.py headline generation, applied
// on demand to a specific lineup story — for the moment you're actually
// choosing what leads the edition and want options to compare, not just
// the one the pipeline already committed to. Same guardrail language,
// same governing principle: compression and selection, never invention.
async function punchUpHeadline(story){
  story.busy = true; story.headlineCandidates = null; setStatus(story, 'Punching up the headline…');
  try {
    const arts = activeArts(story).slice(0, 8);
    const context = arts.map(a=>`- [${a.source}] ${a.title}`).join('\n');
    const prompt = `Current headline: "${story.title}"\n\nWhat the sources actually say:\n${context}\n\n`+
      `Write 3 alternative headlines for this story. Most true headlines are written at the flattest level — the administrative fact, not the stakes. Find the sharpest TRUE sentence available, not the first true sentence available.\n\n`+
      `Three moves, in order of how much they help:\n`+
      `- STRONGER VERB. "Switches to," "announces," "reports" are administrative. Reach for the verb that carries the actual weight — "scraps," "ends," "kills," "drops," "blocks" — WHEN the sources genuinely support that verb's force.\n`+
      `- STAKES OVER MECHANISM. Given a choice between how something happened and why it matters, lead with why it matters — provided the "why" is already in the sources, not an inference you're adding.\n`+
      `- CUT THE HEDGE-PHRASE. "Amid concerns about," "in a move that," "for [vague] reasons" soften a headline into safety. If the sources name the actual thing being hedged, name it.\n\n`+
      `THE GUARDRAIL, which governs all three: this is compression and selection, never invention. No superlative ("unprecedented," "historic," "shocking") unless the sources establish it. No rhetorical questions. No manufactured urgency for a story that isn't breaking. If a sharper phrasing would require implying anything not already in the sources, write the plainer version instead — a flat accurate headline always beats a sharp inaccurate one. No wordplay. Under 90 characters each.\n\n`+
      `Return ONLY a JSON array of exactly 3 strings, no fences: ["headline one","headline two","headline three"]`;
    const candidates = parseJSON(await ai(prompt, 400));
    story.headlineCandidates = Array.isArray(candidates) ? candidates.slice(0,3) : [];
    setStatus(story, story.headlineCandidates.length ? '' : 'No candidates returned — try again', !story.headlineCandidates.length);
  } catch(e){ setStatus(story, 'Punch-up failed: '+e.message, true); }
  story.busy = false; saveLineup(); render();
}
function applyPunchedHeadline(story, text){
  story.title = text; story.headlineCandidates = null; saveLineup(); render();
}

async function draftMeta(story){
  // Same failure this crashed on before: an empty headline list makes the
  // model answer in plain English ("I don't see any articles...") instead
  // of the JSON it was asked for, and that non-JSON response is what threw
  // the raw parse error. Catching it here means a clear, specific message
  // instead of "Unexpected token 'I'" leaking out of a JSON parser.
  if (activeArts(story).length === 0){
    setStatus(story, 'No source material to draft from — this story has no active articles. Use search or add-URL to bring in real sources first.', true);
    return;
  }
  story.busy=true; setStatus(story,'Drafting angle + concept…');
  try {
    const heds = story.articles.slice(0,8).map(a=>`- [${a.source}] ${a.title}`).join('\n');
    const prompt = `Today is ${TODAY}. You are the NTK News editor. Story cluster:\n${heds}\n\nReturn ONLY a JSON object, no fences:\n{"angle":"one sharp NTK sentence — what is actually happening and what's at stake, plain vocabulary, no hype","conceptEntity":"single most distinctive named person/org/place at the story's center, written exactly as a Wikipedia article title (disambiguate surnames), or \\"\\" if none","narrowKeyword":"exactly ONE word likely to appear verbatim in any article about this specific story, or \\"\\""}`;
    const raw = await ai(prompt, 400);
    const d = parseJSON(raw);
    if (d.angle && !story.angle) story.angle = d.angle;
    else if (d.angle && story.angle && confirm('Replace current angle with draft?\n\n'+d.angle)) story.angle = d.angle;
    if (d.conceptEntity && d.conceptEntity !== story.conceptEntity){
      story.conceptUri = null; story.conceptMatch = null; story.conceptChecked = false; // entity changed — old resolution is stale
    }
    story.conceptEntity = d.conceptEntity||story.conceptEntity||'';
    story.narrowKeyword = d.narrowKeyword||story.narrowKeyword||'';
    setStatus(story,'');
  } catch(e){ setStatus(story,'Draft failed: '+e.message,true); }
  story.busy=false; saveLineup(); render();
}

/* Enrichment: ER pool search first (real bodies), fetch-url fallback for
   uncovered RSS links (meta/paragraph text), then dedup layers 2+3. */
async function enrich(story){
  story.busy=true;
  let hadError=false;                 // an actual failure occurred somewhere in this run
  let errMsg='';                      // the real cause — captured separately so the
                                       // fetch-url loop's own progress text ("Fetching:
                                       // NBC News…") can never overwrite it before the
                                       // final summary is built.
  let fetchFails=0;                   // count of fetch-url attempts that returned nothing
  try {
    if (!story.conceptEntity && !story.angle) await draftMeta(story);
    else if (!story.conceptEntity){
      setStatus(story,'Resolving concept…');
      try { const raw = await ai(`Story: "${story.title}". Return ONLY JSON, no fences: {"conceptEntity":"single most distinctive named person/org/place, as a Wikipedia article title, or \\"\\"","narrowKeyword":"ONE word likely verbatim in coverage, or \\"\\""}`, 200);
        const d = parseJSON(raw); story.conceptEntity=d.conceptEntity||''; story.narrowKeyword=d.narrowKeyword||'';
      } catch {}
    }

    // 1. ER pool search — the body engine.
    let er = [];
    if (story.conceptEntity){
      setStatus(story,'EventRegistry: resolving "'+story.conceptEntity+'"…');
      try {
        const matches = await netlifyFetch({mode:'resolve-concept', q:story.conceptEntity});
        const conceptUri = matches?.[0]?.uri;
        story.conceptUri = conceptUri || story.conceptUri || null;
        if (conceptUri){
          setStatus(story,'EventRegistry: pool coverage…');
          const base = {mode:'scan-by-concept', conceptUri, pool:'ntk',
            articlesCount:String(SETTINGS.maxArts), bodyLen:String(SETTINGS.bodyLen)};
          if (story.narrowKeyword){
            er = await netlifyFetch({...base, keyword:story.narrowKeyword});
            if (!er.length) er = await netlifyFetch(base);   // guessed keyword missed — concept alone
          } else er = await netlifyFetch(base);
          if (!er.length){ const {pool, ...broad} = base; er = await netlifyFetch(broad); }  // pool empty — go broad
        } else setStatus(story,'ER: no concept match for "'+story.conceptEntity+'" — RSS links only');
      } catch(e){ hadError=true; errMsg='ER unavailable: '+e.message; setStatus(story,errMsg+' — RSS links only',true); }
    } else if (!er.length && !story.conceptEntity){
      hadError=true; errMsg='No concept entity set — type one and hit check, or Draft first';
      setStatus(story,errMsg,true);
    }
    const erArts = er.map(a=>({
      url:a.url||'', title:a.title||'Untitled', source:a.source?.title||'Unknown',
      date:a.date||'', body:(a.body||''), bodyFrom: a.body?'er':'', included:true, dupOf:null, origin:'er'
    })).filter(a=>a.url);

    // 2. Merge (layer 2): canonical-URL match. ER copy wins — it has the body.
    const byCanon = new Map();
    for (const a of erArts) byCanon.set(canon(a.url), a);
    const rssOnly = [];
    for (const a of story.articles.filter(x=>x.origin==='rss')){
      const hit = byCanon.get(canon(a.url));
      if (hit) hit.origin='both';
      else rssOnly.push(a);
    }
    // Editor-added URLs from a previous package survive enrichment.
    const editorArts = story.articles.filter(x=>x.origin==='editor');

    // 3. fetch-url fallback for uncovered, unsuppressed RSS links.
    for (const a of rssOnly){
      if (isSup(a.url)) { a.body=''; a.bodyFrom=''; continue; }
      setStatus(story,'Fetching: '+a.source+'…');
      const r = await fetchUrlBody(a.url);
      a.body = r.body||''; a.bodyFrom = a.body ? 'fetch' : '';
      if (!a.body) fetchFails++;
    }

    let all = [...erArts, ...rssOnly, ...editorArts];

    // 4. Syndication pass (layer 3): near-identical text under different URLs.
    //    Keep the longest body (tie: earliest date); auto-x the copies —
    //    visibly, reversibly, never off-screen.
    const sh = all.map(a=>({ t:titleTokens(a.title), b:shingles(a.body) }));
    for (let i=0;i<all.length;i++){
      for (let j=i+1;j<all.length;j++){
        if (all[i].dupOf||all[j].dupOf) continue;
        const tSim = jaccard(sh[i].t, sh[j].t);
        // Body-similarity dedup only when both bodies are substantial —
        // short identical boilerplate (cookie walls, subscribe stubs) must
        // not collapse distinct articles into "syndicated" false positives.
        const bothFat = all[i].body.length>600 && all[j].body.length>600;
        const bSim = bothFat ? jaccard(sh[i].b, sh[j].b) : 0;
        if (bSim>0.6 || (tSim>0.8 && (bSim>0.3 || !all[i].body || !all[j].body))){
          let keep=i, drop=j;
          if (all[j].body.length>all[i].body.length) { keep=j; drop=i; }
          else if (all[j].body.length===all[i].body.length &&
                   all[j].date && all[i].date && all[j].date<all[i].date) { keep=j; drop=i; }
          all[drop].dupOf = all[keep].source;
          all[drop].included = false;
        }
      }
    }
    story.articles = all;
    story.enrichedAt = new Date().toISOString();
    // Never blindly clear a real mid-run error — summarize instead, always,
    // so "it finished fast and said nothing" can't happen again.
    const nBody = erArts.filter(a=>a.bodyFrom==='er').length;
    const nFetched = rssOnly.filter(a=>a.bodyFrom==='fetch').length;
    if (hadError){
      // Build from errMsg — the captured cause — never from the live
      // story.status, which the fetch-url loop's progress updates have
      // almost certainly overwritten by this point. And set story.err
      // directly rather than via setStatus: every plain progress update
      // in between ("Fetching: NBC News…") called setStatus with no err
      // argument, which resets story.err to false on every call — so by
      // the time we get here the red/error styling has been silently
      // wiped even though the failure is real. Re-assert it explicitly.
      story.status = (errMsg||'Enrichment had an error') +
        ` — result: ${nBody} ER bodies, ${nFetched} fetched, ${fetchFails} fetch failures.`;
      story.err = true;
    } else {
      setStatus(story, `Enriched: ${nBody} ER bodies, ${nFetched} fetched` +
        (fetchFails ? `, ${fetchFails} fetch failures (bot-blocked/paywalled likely)` : '') + '.');
    }
  } catch(e){ hadError=true; setStatus(story,'Enrichment failed: '+e.message,true); }
  story.busy=false; saveLineup(); render();
}

async function addUrl(story, url){
  if (!url.trim()) return;

}

/* ─── Summon Context: curated Wikipedia sections + 29-day ER arc ─── */
const WIKI_API = 'https://en.wikipedia.org/w/api.php';

// Crude wikitext → prose. Not a parser — enough for background material.
function stripWikitext(w){
  let t = w;
  for (let i=0;i<6;i++) t = t.replace(/\{\{[^{}]*\}\}/g,'');       // templates, innermost-out
  t = t.replace(/<ref[^>]*\/>/gi,'').replace(/<ref[^>]*>[\s\S]*?<\/ref>/gi,'');
  t = t.replace(/<!--[\s\S]*?-->/g,'');
  t = t.replace(/\[\[(?:File|Image|Category):[^\]]*\]\]/gi,'');
  t = t.replace(/\[\[[^\]|]*\|([^\]]*)\]\]/g,'$1').replace(/\[\[([^\]]*)\]\]/g,'$1');
  t = t.replace(/\[https?:\/\/[^\s\]]+\s*([^\]]*)\]/g,'$1');
  t = t.replace(/'''([^']*)'''/g,'$1').replace(/''([^']*)''/g,'$1');
  t = t.replace(/^==+[^=]+==+\s*$/gm,'').replace(/<[^>]+>/g,' ');
  return t.replace(/&nbsp;/g,' ').replace(/\n{3,}/g,'\n\n').replace(/[ \t]+/g,' ').trim();
}
async function wikiJson(params){
  const r = await fetch(WIKI_API+'?'+new URLSearchParams({format:'json', origin:'*', ...params}));
  if (!r.ok) throw new Error('Wikipedia '+r.status);
  return r.json();
}
// One curated ID -> raw section text. "Page#Anchor" or bare "Page".
async function fetchWikiId(id){
  const [page, anchor] = id.split('#');
  const url = 'https://en.wikipedia.org/wiki/'+page+(anchor?'#'+anchor:'');
  if (anchor){
    const d = await wikiJson({action:'parse', page, prop:'sections'});
    if (d.error) throw new Error(d.error.info||'page not found');
    const sec = (d.parse.sections||[]).find(s=>s.anchor===anchor);
    if (sec){
      const w = await wikiJson({action:'parse', page, section:sec.index, prop:'wikitext'});
      return {id, url, title: page.replace(/_/g,' ')+' § '+sec.line,
              text: stripWikitext(w.parse.wikitext['*']).slice(0,6000), anchorFound:true};
    }
    // Anchor renamed or wrong — fall through to the lead, but say so.
  }
  const d = await wikiJson({action:'query', prop:'extracts', titles:page,
    exintro:'1', explaintext:'1', redirects:'1'});
  const pages = d.query?.pages||{}; const first = pages[Object.keys(pages)[0]];
  if (!first || first.missing !== undefined) throw new Error('page not found');
  return {id, url, title: (first.title||page.replace(/_/g,' '))+(anchor?' (anchor not found — page lead used)':''),
          text: (first.extract||'').slice(0,6000), anchorFound: !anchor};
}
async function ensureConceptUri(story, force){
  if (story.conceptUri && !force) return story.conceptUri;
  if (!story.conceptEntity) return null;
  const matches = await netlifyFetch({mode:'resolve-concept', q:story.conceptEntity});
  story.conceptUri = matches?.[0]?.uri || null;
  story.conceptMatch = matches?.[0]?.label?.eng || (matches?.[0]?.uri ? story.conceptEntity : null);
  story.conceptChecked = true;
  return story.conceptUri;
}
// Standalone resolve check — the "vibe check" step. No Enrich, no search,
// just: does this entity string actually match something, and what.
async function checkConcept(story){
  if (!story.conceptEntity.trim()){ setStatus(story,'Enter an entity to check',true); return; }
  story.busy=true; story.conceptUri=null; setStatus(story,'Resolving "'+story.conceptEntity+'"…');
  try {
    await ensureConceptUri(story, true);
    setStatus(story, story.conceptUri ? '' : 'No Wikipedia match for "'+story.conceptEntity+'"', !story.conceptUri);
  } catch(e){ setStatus(story,'Resolve failed: '+e.message,true); }
  story.busy=false; saveLineup(); render();
}
const WIKI_CATEGORY_CAP = 15;  // most-recently-modified members expanded per category

// "Category:X" -> its N most-recently-modified member page titles. Lets a
// whole category ("Category:Donald_Trump_controversies") be dropped in as
// one line instead of hand-listing every page in it. Capped and sorted by
// recency rather than "all of them" — categories can run to hundreds of
// pages, and what's freshest is almost always what's relevant to today's
// story, not the exhaustive historical list.
async function expandWikiCategory(catId){
  const name = catId.replace(/^category:/i,'').trim().replace(/ /g,'_');
  const title = 'Category:'+name;
  const params = new URLSearchParams({
    format:'json', origin:'*', action:'query', list:'categorymembers',
    cmtitle:title, cmlimit:String(WIKI_CATEGORY_CAP),
    cmsort:'timestamp', cmdir:'desc',   // most-recently-modified first
    cmtype:'page',                      // pages only — skip subcategories/files
  });
  const r = await fetch('https://en.wikipedia.org/w/api.php?'+params);
  if (!r.ok) throw new Error('Category lookup failed: '+r.status);
  const d = await r.json();
  // Defensive filter: cmtype=page above SHOULD already exclude subcategories,
  // but real API responses have been observed returning ns:14 (Category)
  // entries anyway (confirmed against the live API while building this).
  // Trust the response's own namespace field, not just the request param.
  const members = (d.query?.categorymembers || []).filter(m=>m.ns===0);
  if (!members.length) throw new Error('no article pages found in "'+title+'"');
  return members.map(m=>m.title);
}

async function summonContext(story){
  story.busy=true;
  const ctx = [];
  try {
    // 1. Curated Wikipedia sections — editor-selected precedent threads.
    //    A line can be a page, a page#section, OR a whole category, which
    //    gets expanded into its most-recent member pages before fetching.
    const rawIds = (story.wikiIds||'').split(/[\n,]+/).map(s=>s.trim()).filter(Boolean);
    const ids = [];
    for (const id of rawIds){
      if (/^category:/i.test(id)){
        setStatus(story,'Expanding category: '+id+'…');
        try {
          const members = await expandWikiCategory(id);
          ids.push(...members);
        } catch(e){
          ctx.push({kind:'wiki', id, url:'https://en.wikipedia.org/wiki/'+id,
            title:id, note:'[category unavailable: '+e.message+']', included:false});
        }
      } else {
        ids.push(id);
      }
    }
    const raws = [];
    for (const id of ids){
      setStatus(story,'Wikipedia: '+id+'…');
      try { raws.push(await fetchWikiId(id)); }
      catch(e){ ctx.push({kind:'wiki', id, url:'https://en.wikipedia.org/wiki/'+id.split('#')[0],
        title:id, note:'[unavailable: '+e.message+']', included:false}); }
    }
    // 2. Haiku condenses fetched sections into per-ID notes, each keeping
    //    its URL so generation can cite each thread separately. Batched —
    //    a category expansion can hand this up to WIKI_CATEGORY_CAP (15)
    //    sources at once, and 15 notes at ~120 words each needs well over
    //    2000 tokens of output, which used to truncate against a 1200
    //    ceiling sized for the original few-hand-picked-IDs case. Same
    //    fix already proven in ledger.py: cap items per call so no single
    //    response is ever asked to hold more than it safely can.
    const CONDENSE_BATCH = 6;
    if (raws.length){
      for (let start = 0; start < raws.length; start += CONDENSE_BATCH){
        const batch = raws.slice(start, start + CONDENSE_BATCH);
        setStatus(story, `Condensing background… (${start+1}-${start+batch.length} of ${raws.length})`);
        const prompt = `You are preparing BACKGROUND notes for an NTK News story: "${story.title}".\n`+
          `For each Wikipedia source below, write one factual note of at most 120 words: the prior events and their dates, plainly told, selected for what makes TODAY's incremental news legible. No commentary, no analysis of today's news itself.\n\n`+
          batch.map((r,i)=>`SOURCE ${i} — ${r.title}:\n${r.text}`).join('\n\n')+
          `\n\nReturn ONLY a JSON array, no fences: [{"i":0,"note":"..."}]`;
        try {
          const notes = parseJSON(await ai(prompt, 2000));
          batch.forEach((r,i)=>{
            const n = notes.find(x=>x.i===i);
            ctx.push({kind:'wiki', id:r.id, url:r.url, title:r.title,
              note:(n&&n.note)||r.text.slice(0,600), included:true});
          });
        } catch(e){
          // One bad batch shouldn't cost the others — fall back to the raw
          // (uncondensed) extract for just this batch rather than losing
          // everything summoned so far.
          batch.forEach(r=>ctx.push({kind:'wiki', id:r.id, url:r.url, title:r.title,
            note:r.text.slice(0,600), included:true}));
        }
      }
    }
    // 3. ER arc: concept-scoped, 29-day, relevance-sorted — the story so far.
    const uri = await ensureConceptUri(story).catch(()=>null);
    if (uri){
      setStatus(story,'EventRegistry: 29-day arc…');
      try {
        const arc = await netlifyFetch({mode:'context-scan', conceptUri:uri,
          articlesCount:'5', windowDays:'29', bodyLen:'1200'});
        for (const a of arc){
          if (!a.url || isSup(a.url)) continue;
          // Skip arc items already in the source package — they're news, not background.
          if (story.articles.some(x=>canon(x.url)===canon(a.url))) continue;
          ctx.push({kind:'arc', url:a.url, title:a.title||'Untitled',
            source:a.source?.title||'Unknown', date:a.date||'',
            note:(a.body||'').slice(0,1200), included:true});
        }
      } catch(e){ setStatus(story,'Arc unavailable: '+e.message,true); }
    }
    story.context = ctx; story.contextAt = new Date().toISOString();
    setStatus(story, ctx.length ? '' : 'No context retrieved — check wiki IDs / concept');
  } catch(e){ setStatus(story,'Summon failed: '+e.message,true); }
  story.busy=false; saveLineup(); render();
}
function contextBlock(story){
  const items = (story.context||[]).filter(c=>c.included);
  if (!items.length) return '';
  const wiki = items.filter(c=>c.kind==='wiki');
  const arc = items.filter(c=>c.kind==='arc');
  return `\n\nBACKGROUND — NOT today's news. Today's source articles above remain the ground truth; this block exists only for the History Scoping Rule: name the precedent, date it, make the rhyme land in one sentence, cite the free reference link. Seasoning, not the main course — background should never displace today's development as the subject of a movement.\n`+
    (wiki.length ? `\nPRECEDENT THREADS (editor-curated, cite as ([Wikipedia](URL))):\n`+
      wiki.map(c=>`- ${c.title} — URL: ${c.url}\n  ${c.note}`).join('\n') : '')+
    (arc.length ? `\nTHE STORY SO FAR (last 29 days of coverage, for continuity — not fresh news):\n`+
      arc.map(c=>`- [${c.source}, ${c.date}] ${c.title} — URL: ${c.url}\n  ${c.note}`).join('\n') : '');
}

function activeArts(story){
  return story.articles.filter(a=>a.included && !a.dupOf && !isSup(a.url));
}

function spentStats(pkg, includeList){
  const list = includeList || SECS;
  const spent = [];
  for (const sec of list){
    const t = pkg[sec]; if (!t) continue;
    let m; const statRe = /\[STAT:\s*([^|\]]+?)\s*\|/g;
    while ((m = statRe.exec(t))) spent.push(`"${m[1].trim()}" (${sec} STAT)`);
  }
  if (list.includes('truths')){
    const hed = (pkg.truths||'').match(/\[HEADLINE:\s*([\s\S]*?)\]/);
    if (hed){ const nums = hed[1].match(/\$?[\d,.]+%?/g)||[];
      nums.forEach(n=>{ if(/\d/.test(n)) spent.push(`"${n}" (Truths headline)`); }); }
  }
  return spent;
}
function sectionsBlock(pkg, includeList, label){
  const written = includeList.filter(s=>pkg[s]);
  if (!written.length) return '';
  const spent = spentStats(pkg, includeList);
  return `\n\n${label||'ALREADY WRITTEN'} — the reader has read these sections in full. This is the actual text, not a summary:\n\n`+
    written.map(s=>`═══ ${s.toUpperCase()} (already published) ═══\n${pkg[s]}`).join('\n\n')+
    `\n\nCROSS-SECTION DISCIPLINE:\n`+
    `- Never re-establish, re-quote, or re-summarize facts, figures, or quotes that appear above. The reader holds them.\n`+
    (spent.length ? `- SPENT NUMBERS — already deployed as a STAT or headline figure: ${spent.join('; ')}. A spent number may be referred to obliquely ("the toll," "that figure") but never re-stated digit-for-digit and never used in another [STAT:] marker. If your sharpest number is spent, your section's sharpest number is a different one — or none.\n` : '')+
    `- Build forward, not sideways: a thread opened in an earlier section can be advanced, escalated, or paid off — never reopened as if new. Referring back in shorthand is encouraged; the sections should read as one mind thinking, not four writers briefed separately.`;
}
function priorSectionsBlock(pkg){ return sectionsBlock(pkg, SECS); }
/* ─── deterministic post-generation cleanup ───
   The GLOBAL prompt now instructs the model to leave a space after a
   closing bold marker and never self-label a section. That reduces how
   often it happens; it can't guarantee zero, and it hasn't (confirmed:
   "ForIf", "WhoKevin", "The Lies Section" all recurred after the prompt
   fix shipped). So this runs on every generated section regardless of
   compliance — a deterministic safety net layered on TOP of the prompt
   instruction, not a replacement for it. Applied once, at the moment text
   is received, so the corrected version is what's stored, rendered,
   copied, exported, AND fed to later sections as "already written"
   context — nothing downstream ever sees the raw artifact. */
const NO_SPACE_AFTER = new Set('.,;:\'\u2019")]}-\u2013\u2014!?'.split(''));
function fixBoldSpacing(text){
  let out = '', inBold = false, i = 0;
  while (i < text.length){
    if (text[i]==='*' && text[i+1]==='*'){
      out += '**'; inBold = !inBold; i += 2;
      // Just closed a bold span — if what follows isn't whitespace and
      // isn't punctuation that legitimately hugs the close (a period, an
      // apostrophe for a possessive, a closing paren), insert the space
      // the model dropped. Catches both "**For**If" (letter runs on) and
      // "**Lies****Trump's**" (a second bold span runs on with no gap).
      if (!inBold && i < text.length && text[i]!==' ' && text[i]!=='\n' && !NO_SPACE_AFTER.has(text[i])){
        out += ' ';
      }
      continue;
    }
    out += text[i]; i++;
  }
  return out;
}
function stripSectionSelfLabel(sec, text){
  // A leading bold span that's just the section's own name echoed back
  // ("**Lies**", "**The Lies Section**") is always redundant — the h3
  // header already says LIES — and never intentional content. Matched
  // against THIS section's name specifically, not all four, so a
  // legitimate subhead that happens to share a word stays untouched.
  const re = new RegExp('^\\s*\\*\\*\\s*(the\\s+)?'+sec.toLowerCase()+'(\\s+section)?\\s*\\*\\*\\s*\\n*','i');
  return text.replace(re, '');
}
function cleanSectionText(sec, text){
  return fixBoldSpacing(stripSectionSelfLabel(sec, text||''));
}

async function generateStory(story){
  const arts = activeArts(story);
  if (!arts.length){ setStatus(story,'No active sources — enrich or add URLs first',true); return; }
  story.busy=true;
  const artsText = arts.map(a=>
    `TITLE: ${a.title}\nSOURCE: ${a.source}\nURL: ${a.url}\nDATE: ${a.date}\n\n${(a.body||'[body unavailable — headline only]').slice(0,SETTINGS.bodyLen)}`
  ).join('\n\n---\n\n');
  const angleBlock = story.angle ? `\n\nEDITOR'S ANGLE (the editorial frame for this story — honor it): ${story.angle}` : '';
  // Chained generation: sections run in reading order and each call receives
  // the sections already written, verbatim, plus the spent-numbers ledger.
  // This is what makes the prompts' long-standing "the reader has already
  // read Truths" instruction actually checkable instead of aspirational.
  // A regenerate starts a fresh package — chaining stale sections into new
  // ones would freeze yesterday's text into today's context.
  const pkg = {};
  for (const sec of SECS){
    setStatus(story, story.title.slice(0,40)+' · '+sec+'…');
    try { pkg[sec] = cleanSectionText(sec, await ai(makePrompt(sec, artsText+angleBlock+contextBlock(story)+notesBlock()+priorSectionsBlock(pkg), []), 2500)); }
    catch(e){ pkg[sec] = '[Generation failed: '+e.message+']'; }
  }
  story.packages = pkg; story.generatedAt = new Date().toISOString(); story.outOpen = true;
  NOTES.genCounter = (NOTES.genCounter||0) + 1; saveNotes();
  story.busy=false; setStatus(story,''); saveLineup(); render();
}
async function reviseSection(story, sectionName, note){
  const arts = activeArts(story);
  if (!arts.length){ setStatus(story,'No active sources — enrich first',true); return; }
  story.busy=true; setStatus(story,'Revising '+sectionName+'…'); render();
  const artsText = arts.map(a=>
    `TITLE: ${a.title}\nSOURCE: ${a.source}\nURL: ${a.url}\nDATE: ${a.date}\n\n${(a.body||'[body unavailable — headline only]').slice(0,SETTINGS.bodyLen)}`
  ).join('\n\n---\n\n');
  const angleBlock = story.angle ? `\n\nEDITOR'S ANGLE (the editorial frame for this story — honor it): ${story.angle}` : '';
  // Siblings, not "prior": revise keeps the OTHER three sections fixed
  // regardless of reading order, so a mid-package rewrite stays consistent
  // on both sides of it, not just with what came before.
  const siblings = sectionsBlock(story.packages, SECS.filter(s=>s!==sectionName),
    'ALREADY PUBLISHED — SIBLING SECTIONS (unaffected by this revision)');
  const revisionNote = (note||'').trim()
    ? `\n\nEDITOR'S REVISION NOTE — the specific reason this section is being rewritten; apply it directly and concretely, not just in spirit: ${note.trim()}`
    : '\n\nThis section is being regenerated at the editor\'s request with no specific note — reconsider it freshly against the source material and the standing editorial notes above.';
  try {
    story.packages[sectionName] = cleanSectionText(sectionName, await ai(makePrompt(sectionName,
      artsText+angleBlock+contextBlock(story)+notesBlock()+siblings+revisionNote, []), 2500));
    setStatus(story,'Revised '+sectionName+'.');
  } catch(e){ setStatus(story,'Revise failed: '+e.message,true); }
  story.busy=false; saveLineup(); render();
}
async function generateAll(){
  for (const s of LINEUP) if (!s.packages) await generateStory(s);
}

const GH_REPO = 'maxzimbert/ntknews';
const GH_PUBLISH_PATH = 'ntk-pulse/data/lineup-publish.json';

// Publish: commits the current lineup's story data straight to the repo
// via GitHub's Contents API — confirmed to support direct browser CORS
// requests before this was built, not assumed. That commit itself is the
// trigger for pulse-publish.yml (a path-scoped push trigger), so this one
// call is the entire "zero clicks after this" chain: no separate
// workflow-start call needed.
async function publishToDigest(){
  if (!SETTINGS.ghToken){ alert('Add a GitHub token in ⚙ first — scoped to contents:write on this repo only.'); return; }
  const stories = LINEUP.filter(s=>s.packages);
  if (!stories.length){ alert('Nothing generated yet — nothing to publish.'); return; }
  publishStatus = 'Publishing…'; renderPublishStatus();
  try {
    const content = storyDataExport();
    const b64 = btoa(unescape(encodeURIComponent(content)));
    const apiUrl = `https://api.github.com/repos/${GH_REPO}/contents/${GH_PUBLISH_PATH}`;
    const headers = { 'Authorization': 'Bearer '+SETTINGS.ghToken, 'Accept': 'application/vnd.github+json' };

    // The Contents API needs the current file's sha to UPDATE it — a 404
    // on this GET means it's never been published before, which is fine,
    // just means this PUT will CREATE the file instead.
    let sha = null;
    const getResp = await fetch(apiUrl, {headers});
    if (getResp.ok){ sha = (await getResp.json()).sha; }
    else if (getResp.status !== 404){ throw new Error('GitHub GET failed: '+getResp.status); }

    const putResp = await fetch(apiUrl, {
      method:'PUT', headers:{...headers,'Content-Type':'application/json'},
      body: JSON.stringify({
        message: 'publish: '+stories.length+' stories from Pulse',
        content: b64, branch:'main', ...(sha?{sha}:{}),
      }),
    });
    if (!putResp.ok){ const t=await putResp.text(); throw new Error('GitHub PUT failed: '+putResp.status+' '+t.slice(0,200)); }
    publishStatus = 'Published — build running now, usually a minute or two.';
  } catch(e){ publishStatus = 'Publish failed: '+e.message; }
  renderPublishStatus();
  setTimeout(fetchLastPublished, 45000);   // one check after the build's had time to land
}
let publishStatus = '';

}
