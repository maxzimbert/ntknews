<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pulse</title>
<style>
  /* Deliberately undesigned. Memeorandum register: text-forward, dense. */
  :root {
    --ink: #111; --dim: #777; --faint: #aaa; --link: #1a0dab;
    --rule: #ddd; --certified: #0a7a2f; --stale: #b03a00; --warn: #a05a00;
    --card: #fafafa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto; max-width: 840px; padding: 14px 16px 80px;
    font: 13px/1.45 Verdana, Geneva, "DejaVu Sans", sans-serif;
    color: var(--ink); background: #fff;
  }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font: inherit; cursor: pointer; }
  input, textarea, select { font: 12px/1.4 Verdana, sans-serif; color: var(--ink);
    border: 1px solid var(--rule); background: #fff; padding: 4px 6px; }
  textarea { width: 100%; resize: vertical; }

  header {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    border-bottom: 2px solid var(--ink); padding-bottom: 6px; margin-bottom: 12px;
  }
  header h1 { font-size: 17px; margin: 0; letter-spacing: 1px; }
  .subj-head { margin-bottom: 14px; }
  .subj-note { font-size: 12px; color: var(--dim); line-height: 1.5; margin: 0 0 6px; max-width: 74ch; }
  .subj-add { display: flex; gap: 6px; margin-top: 10px; }
  .subj-add input { flex: 0 0 260px; }
  .subj-row {
    border: 1px solid var(--line);
    border-left: 3px solid var(--line);
    border-radius: 3px;
    padding: 9px 11px;
    margin-bottom: 7px;
    opacity: 0.6;
  }
  .subj-row.in-use { opacity: 1; border-left-color: var(--accent, #0798F2); }
  .subj-top { display: flex; align-items: center; gap: 10px; }
  .subj-name { flex: 0 0 280px; font-weight: 600; }
  .subj-count { font-size: 11px; color: var(--dim); flex: 1; }
  .subj-concepts { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .subj-concept {
    font-size: 10.5px; padding: 2px 7px; border-radius: 3px;
    background: rgba(127,127,127,0.13); color: var(--dim);
  }
  .subj-stories { margin-top: 7px; font-size: 11px; color: var(--dim); line-height: 1.65; }

  .tab { background: none; border: none; font-size: 12px; color: var(--dim); padding: 0; letter-spacing: 0.5px; }
  .tab.on { color: var(--ink); font-weight: bold; border-bottom: 2px solid var(--ink); }
  header .meta { color: var(--dim); font-size: 11px; }
  header .stale { color: var(--stale); font-size: 11px; }
  /* Stale data is the one failure here that looks like normal operation —
     the tool renders fine and just recommends worse stories. Loud by design. */
  #staleBanner { display: none; background: var(--stale); color: #fff;
    padding: 10px 14px; font-size: 13px; line-height: 1.45; }
  #staleBanner.show { display: block; }
  #staleBanner b { font-weight: 700; }
  #staleBanner a { color: #fff; text-decoration: underline; }
  #staleBanner .sb-why { display: block; margin-top: 3px; font-size: 12px; opacity: 0.9; }
  header .right { margin-left: auto; display: flex; gap: 10px; align-items: baseline; }
  header .count { color: var(--dim); font-size: 11px; }
  .gear { background: none; border: none; color: var(--dim); font-size: 13px; }

  /* Settings drawer */
  #settings { border: 1px solid var(--rule); background: var(--card); padding: 10px; margin-bottom: 12px; display: none; }
  #settings.open { display: block; }
  #settings label { display: block; font-size: 10.5px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px; margin: 8px 0 2px; }
  #settings input { width: 100%; max-width: 480px; }
  #settings .row { display: flex; gap: 16px; flex-wrap: wrap; }
  #settings .note { font-size: 11px; color: var(--dim); margin-top: 8px; }

  /* Stream */
  .cluster { padding: 7px 0; border-bottom: 1px solid var(--rule); }
  .cluster.no-verdict-no { opacity: 0.55; }
  .hed { font-size: 13.5px; font-weight: bold; cursor: pointer; }
  .hed:hover { text-decoration: underline; }
  .meta-line { font-size: 11px; color: var(--dim); margin-top: 2px; }
  .beat { text-transform: uppercase; letter-spacing: 0.5px; font-size: 10px; font-weight: bold; margin-right: 6px; }
  .beat-national { color: #8a1f1f; } .beat-international { color: #1f4d8a; }
  .beat-tech { color: #5a2d82; } .beat-health { color: #0a7a2f; }
  .beat-education { color: #a05a00; } .beat-science { color: #006b6b; }
  .beat-business { color: #705500; } .beat-culture { color: #8a1f6e; }
  .beat-other { color: var(--dim); }
  .line { font-size: 12px; color: #444; margin-top: 2px; }
  .articles { display: none; margin: 6px 0 2px; padding-left: 12px; border-left: 2px solid var(--rule); }
  .cluster.open .articles { display: block; }
  .article { font-size: 12px; padding: 2px 0; }
  .article .pub { font-weight: bold; color: #333; }
  .article .t { color: var(--faint); font-size: 10.5px; }
  .article.suppressed a { text-decoration: line-through; color: var(--faint); }
  .article.suppressed .pub { color: var(--faint); }
  .x {
    background: none; border: none; color: var(--faint); font-size: 11px;
    padding: 0 3px; line-height: 1;
  }
  .x:hover { color: var(--stale); }
  .article.suppressed .x { color: var(--stale); }
  .certify { margin-top: 5px; font: bold 10.5px Verdana, sans-serif; padding: 2px 8px;
    border: 1px solid var(--dim); background: #fff; color: var(--ink); }
  .certify.done { border-color: var(--certified); color: var(--certified); }
  .cluster.solo { padding: 3px 0; border-bottom: 1px dotted var(--rule); }
  .cluster.solo .hed { font-weight: normal; font-size: 12.5px; }
  .empty { color: var(--dim); padding: 30px 0; }

  /* Lineup */
  .story {
    border: 1px solid var(--rule); background: var(--card);
    padding: 10px 12px; margin-bottom: 10px;
  }
  .story-top { display: flex; gap: 8px; align-items: baseline; }
  .ord { font-size: 15px; font-weight: bold; color: var(--ink); min-width: 38px; max-width: 38px;
    text-align: center; border: 1px solid var(--rule); background: transparent; padding: 1px 2px; }
  .ord:focus { outline: 1px solid var(--dim); background: #fff; }
  .drag-handle { cursor: grab; color: var(--faint); font-size: 14px; padding: 0 2px; user-select: none; }
  .story.dragging { opacity: 0.4; }
  .story.drag-over { border-top: 2px solid var(--certified); }
  .story-title { flex: 1; font-weight: bold; font-size: 13px; border: none; background: transparent; width: 100%; padding: 0; }
  .story-title:focus { outline: 1px solid var(--rule); background: #fff; }
  .mini { background: none; border: 1px solid var(--rule); color: var(--dim); font-size: 10.5px; padding: 1px 6px; }
  .mini:hover { color: var(--ink); border-color: var(--dim); }
  .mini:disabled { opacity: 0.4; cursor: default; }
  .mini.primary { border-color: var(--ink); color: var(--ink); font-weight: bold; }
  .mini.go { border-color: var(--certified); color: var(--certified); font-weight: bold; }
  .angle-row { display: flex; gap: 6px; margin-top: 6px; align-items: flex-start; }
  .angle-row textarea { flex: 1; min-height: 34px; }
  .story-meta { font-size: 10.5px; color: var(--dim); margin-top: 5px; display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
  .story-status { font-size: 11px; color: var(--warn); margin-top: 4px; min-height: 14px; }
  .story-status.err { color: var(--stale); }
  .pkg { margin-top: 8px; border-top: 1px dotted var(--rule); padding-top: 6px; }
  .pkg .article { display: flex; gap: 6px; align-items: baseline; }
  .pkg .article .grow { flex: 1; }
  .chip { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.4px; padding: 0 4px; border: 1px solid var(--rule); color: var(--dim); white-space: nowrap; }
  .chip.body { border-color: var(--certified); color: var(--certified); }
  .chip.thin { border-color: var(--warn); color: var(--warn); }
  .chip.dup { border-color: var(--faint); color: var(--faint); }
  .chip.xstory { border-color: #1f4d8a; color: #1f4d8a; }
  .chip.ctx { border-color: #5a2d82; color: #5a2d82; }
  .chip.arc { border-color: #006b6b; color: #006b6b; }
  .ctx-row { display: flex; gap: 6px; margin-top: 6px; align-items: flex-start; }
  .concept-row { display: flex; gap: 6px; margin-top: 6px; align-items: baseline; flex-wrap: wrap; }
  .concept-row input[type=text] { min-width: 160px; }
  .concept-row .kw { max-width: 120px; }
  .concept-status { font-size: 10.5px; }
  .concept-status.ok { color: var(--certified); }
  .concept-status.miss { color: var(--stale); }
  .concept-status.unchecked { color: var(--dim); }
  .ctx-row textarea { flex: 1; min-height: 30px; font-size: 11px; }
  .ctx-note { font-size: 11.5px; color: #444; margin: 2px 0 4px 12px; border-left: 2px solid var(--rule); padding-left: 8px; }
  .qpanel { border: 1px dashed var(--rule); padding: 8px 10px; margin-bottom: 12px; }
  .qpanel .qrow { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .qpanel input[type=text] { flex: 1; min-width: 160px; }
  .qpanel .qres { font-size: 12px; padding: 2px 0; display: flex; gap: 6px; align-items: baseline; }
  .selbar { position: sticky; top: 0; background: #fff; border-bottom: 2px solid var(--ink);
    padding: 6px 0; margin-bottom: 8px; display: none; gap: 8px; align-items: baseline; z-index: 5; }
  .selbar.show { display: flex; }
  .selchk { margin-right: 6px; }
  .cluster.selected { background: #fffbe6; }
  @media (prefers-color-scheme: dark) { .selbar { background: #141414; } .cluster.selected { background: #2a2610; } }
  .manual-badge { background: #5a2d82; color: #fff; font-size: 9.5px; padding: 0 5px;
    text-transform: uppercase; letter-spacing: 0.5px; margin-right: 6px; }
  .rescan-sugg { margin: 6px 0 0 12px; border-left: 2px solid var(--rule); padding-left: 8px; }
  .rescan-sugg .article { display: flex; gap: 6px; align-items: baseline; font-size: 11.5px; }
  .rescan-sugg .why { color: var(--dim); font-size: 10px; }
  .mc-search { border: 1px dashed var(--rule); padding: 6px 8px; margin-top: 6px; font-size: 12px; }
  .qpanel .qres label { flex: 1; }
  .addurl { display: flex; gap: 6px; margin-top: 6px; }
  .addurl input { flex: 1; }
  .out { margin-top: 10px; border-top: 1px solid var(--rule); padding-top: 8px; }
  .out h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); margin: 12px 0 4px; }
  .out .body { font-size: 12.5px; line-height: 1.55; }
  .out .body p { margin: 0 0 8px; }
  .out .body { cursor: text; }
  .out .body:hover { background: rgba(0,0,0,0.02); }
  .out .body-edit { font: 12.5px/1.55 Verdana, sans-serif; width: 100%; min-height: 120px;
    border: 1px solid var(--ink); padding: 6px 8px; resize: vertical; color: var(--ink); background: #fff; }
  .img-row { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
  .img-thumb { width: 54px; height: 34px; object-fit: cover; border: 1px solid var(--rule); }
  .img-thumb-empty { width: 54px; height: 34px; border: 1px dashed var(--rule); display: flex;
    align-items: center; justify-content: center; font-size: 9px; color: var(--dim); }
  .img-row input[type=file] { display: none; }
  .edited-badge { font-size: 9px; color: var(--warn); text-transform: uppercase;
    letter-spacing: .5px; margin-left: 6px; border: 1px solid var(--warn); padding: 0 4px; }
  @media (prefers-color-scheme: dark) { .out .body-edit { background: #101010; } .out .body:hover { background: rgba(255,255,255,0.04); } }
  .ntk-pullquote { border-left: 3px solid var(--ink); margin: 10px 0; padding: 4px 10px; }
  .ntk-pq-text { font-size: 13px; font-style: italic; margin: 0; }
  .ntk-pq-cite { font-size: 10.5px; color: var(--dim); }
  .ntk-stat { margin: 10px 0; }
  .ntk-stat-num { font-size: 18px; font-weight: bold; }
  .ntk-stat-ctx { font-size: 11px; color: var(--dim); }
  .lineup-bar { display: flex; gap: 8px; margin-bottom: 12px; align-items: baseline; flex-wrap: wrap; }
  .lineup-bar .spacer { flex: 1; }
  .copied { color: var(--certified); font-size: 10.5px; }
  .ed-head { border: 1px solid var(--rule); background: var(--card); padding: 10px; margin-bottom: 12px; }
  .ed-head .row { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; align-items: baseline; }
  .ed-head .k { color: var(--dim); text-transform: uppercase; font-size: 10px; letter-spacing: .5px; }
  .lint { margin-top: 8px; }
  .lint-ok { color: var(--certified); font-size: 12px; font-weight: bold; }
  .lint-fail { color: var(--stale); font-size: 12px; padding: 2px 0; }
  .ed-story { border-bottom: 1px solid var(--rule); padding: 8px 0; }
  .slot-tag { display: inline-block; background: var(--ink); color: #fff; font-size: 9.5px;
    text-transform: uppercase; letter-spacing: .5px; padding: 1px 6px; margin-right: 7px; }
  .sc { display: inline-block; font-size: 10px; margin-right: 8px; color: var(--dim); }
  .sc b { color: var(--ink); font-size: 11px; }
  .sc.hot b { color: var(--stale); }
  .sc.good b { color: var(--certified); }
  .facts { font-size: 11.5px; color: #444; margin: 4px 0 0 12px; border-left: 2px solid var(--rule); padding-left: 8px; }
  .killed { margin-top: 14px; border-top: 1px dashed var(--rule); padding-top: 8px; }
  .killed .k-item { font-size: 11px; color: var(--dim); padding: 1px 0; }
  @media (prefers-color-scheme: dark) { .slot-tag { background: #ddd; color: #111; } }
  #notesPanel { border: 1px solid var(--rule); background: var(--card); padding: 10px; margin-bottom: 12px; display: none; }
  #notesPanel.open { display: block; }
  .note-add { display: flex; gap: 6px; margin-bottom: 8px; }
  .note-add textarea { flex: 1; min-height: 32px; }
  .note-item { border-top: 1px dotted var(--rule); padding: 6px 0; }
  .note-item textarea { width: 100%; min-height: 30px; font-size: 12px; }
  .note-meta { font-size: 10.5px; color: var(--dim); display: flex; gap: 10px; margin-top: 3px; flex-wrap: wrap; align-items: baseline; }
  .note-flags { font-size: 11px; color: #444; margin: 4px 0 0 10px; border-left: 2px solid var(--rule); padding-left: 8px; }
  .note-flags div { margin-bottom: 2px; }
  .promoted-box { margin-top: 6px; border: 1px dashed var(--certified); padding: 6px 8px; font-size: 12px; }
  .sec-h { display: flex; gap: 8px; align-items: baseline; }
  .sec-h .mini { font-size: 9.5px; padding: 0 5px; }
  .revise-box, .flag-box { display: none; margin: 4px 0 8px; gap: 6px; }
  .revise-box.open, .flag-box.open { display: flex; }
  .revise-box textarea { flex: 1; min-height: 28px; font-size: 11.5px; }
  .flag-box select { font-size: 11.5px; }
  .flag-box input[type=text] { flex: 1; font-size: 11.5px; }

  /* T-0037 — NPR News Now monitor, above the candidates panel in the
     Lineup tab. All colors are var(--ink)/--dim/--rule/--card, same as
     the rest of the page, so dark mode needs no separate override here. */
  .npr-mod { border: 1px solid var(--rule); background: var(--card); padding: 10px; margin-bottom: 8px; }
  .npr-mod .npr-row1 { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .npr-mod .npr-row1 .npr-right { font-size: 10.5px; color: var(--dim); }
  .npr-now-list { list-style: none; margin: 0 0 10px; padding: 0; }
  .npr-now-list li { padding: 2px 0; font-size: 12px; }
  .npr-now-list .npr-tick { color: var(--stale); font-size: 9.5px; text-transform: uppercase; letter-spacing: .3px; margin-right: 5px; }
  .npr-grid-wrap { overflow-x: auto; }
  .npr-grid { display: grid; align-items: center; font-size: 10px; row-gap: 3px; column-gap: 2px; }
  .npr-grid .npr-colhead { text-align: center; color: var(--faint); padding-bottom: 4px; }
  .npr-grid .npr-rowlabel { font-size: 11.5px; color: var(--ink); padding: 3px 8px 3px 0; line-height: 1.35; }
  .npr-grid .npr-cell { display: flex; align-items: center; justify-content: center; align-self: stretch; }
  .npr-dot { width: 11px; height: 11px; background: var(--stale); }
  .npr-legend { font-size: 10.5px; color: var(--dim); margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--rule); }
  .npr-empty { font-size: 11.5px; color: var(--dim); }

  @media (prefers-color-scheme: dark) {
    body { background: #141414; }
    :root { --ink: #ddd; --dim: #909090; --faint: #6a6a6a; --link: #8ab4f8; --rule: #333; --card: #1b1b1b; }
    header { border-color: var(--ink); }
    .line { color: #b5b5b5; }
    .article .pub { color: #ccc; }
    .certify, input, textarea, select { background: transparent; color: var(--ink); }
    .story-title:focus { background: #101010; }
  }
</style>
</head>
<body>
<header>
  <h1>PULSE</h1>
  <button class="tab on" id="tab-stream">stream</button>
  <button class="tab" id="tab-lineup">lineup</button>
  <button class="tab" id="tab-today">today</button>
  <button class="tab" id="tab-backstory">backstory</button>
  <button class="tab" id="tab-subjects">subjects</button>
  <span class="meta" id="clock"></span>
  <span class="stale" id="stale"></span>
  <span class="right">
    <span class="count" id="count"></span>
    <button class="gear" id="notesToggle" title="editorial notes">📝<span id="notesBadge"></span></button>
    <button class="gear" id="gear" title="settings">⚙</button>
  </span>
</header>

<div id="staleBanner"></div>

<div id="notesPanel"></div>

<div id="settings">
  <div class="row">
    <div style="flex:1;min-width:260px">
      <label>Anthropic API key</label>
      <input id="set-key" type="password" placeholder="sk-ant-…">
      <label>Netlify proxy base (the site serving netlify/functions/)</label>
      <input id="set-proxy" type="text" placeholder="https://your-site.netlify.app">
      <label>GitHub token (scoped: contents write, this repo only) — powers Publish</label>
      <input id="set-ghtoken" type="password" placeholder="github_pat_…">
      <label>Recraft API key — powers Generate photo</label>
      <input id="set-recraftkey" type="password" placeholder="paste from Recraft → profile → API">
    </div>
    <div>
      <label>Body chars per article</label>
      <input id="set-bodylen" type="number" min="500" max="8000" step="500" style="width:90px">
      <label>ER articles per story</label>
      <input id="set-maxarts" type="number" min="5" max="30" style="width:90px">
    </div>
  </div>
  <div class="note">Key and settings live in this browser's localStorage only. The proxy base is the Netlify site serving <code>netlify/functions/news.js</code> — it does the EventRegistry and body fetching, keeping that API key server-side.</div>
</div>

<main id="view"><div class="empty">Loading…</div></main>

<script>
/* ═══ NTK PULSE v2 — monitoring stream + lineup CMS ═══
   Stream: reads data/clusters.json from the pipeline (unchanged).
   Lineup: certify snapshots a cluster; suppress-x prunes links; ER
   enrichment builds the source package; v14 Jefferson prompts generate
   truths/probabilities/possibilities/lies; export produces the
   digest/index.html stories-array block. All state in localStorage. */

const SECS = ['truths','probabilities','possibilities','lies'];
const TODAY = new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
// USA Today-style section names — plain, reader-facing nouns rather than
// policy-desk language. 'Under-Reported' and 'Orienting' are NTK's own
// editorial curation tags (not subject-matter sections) and have no USA
// Today equivalent, so they stay. Renamed 2026-08-14.
const CATEGORIES = ['World','Nation','Politics','Money','Tech','Health','Life','Under-Reported','Orienting'];
const BEAT_TO_CAT = { national:'Nation', international:'World', business:'Money',
  tech:'Tech', science:'Tech', health:'Health', education:'Life', culture:'Life', other:'Nation' };
const LINEUP_MAX = 8;

/* ─── persisted state ─── */
const LS = {
  settings:  'ntk_pulse_settings_v1',
  lineup:    'ntk_pulse_lineup_v1',
  sup:       'ntk_pulse_suppressed_v1',
  notes:     'ntk_pulse_notes_v1',
  manual:    'ntk_pulse_manual_clusters_v1',
  dismissed: 'ntk_pulse_dismissed_candidates_v1',
  today:     'ntk_pulse_today_v1',
  subjects:  'ntk_pulse_subjects_v1',
  cats:      'ntk_pulse_categories_v1',
};
function load(k, fallback) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? fallback; } catch { return fallback; } }
let SETTINGS = load(LS.settings, { antKey:'', proxyBase:'', ghToken:'', recraftKey:'', bodyLen:4000, maxArts:15 });
let LINEUP = load(LS.lineup, []);          // [{id, title, angle, beat, category, conceptEntity, narrowKeyword, articles:[], enrichedAt, packages, busy?, status?, open?, outOpen?}]
let SUP = load(LS.sup, {});                 // canonical url -> true  (editor suppressions, global, persistent)
let DISMISSED = load(LS.dismissed, {});      // candidate key -> true  (recommended-zone dismissals, persistent, reversible)
function saveDismissed(){ localStorage.setItem(LS.dismissed, JSON.stringify(DISMISSED)); }
let TODAY_OV = load(LS.today, {text:'', generatedAt:null, busy:false});
// A reload kills any generation in flight, so a saved busy:true is always stale.
TODAY_OV.busy = false;
function saveToday(){ localStorage.setItem(LS.today, JSON.stringify(TODAY_OV)); }

// The subject vocabulary. Free-form by decision (2026-09-18) rather than a
// fixed list, which buys adaptability and costs drift: "AI" and "Artificial
// Intelligence" would become two regions on a reader's map, which is their
// history quietly being halved. Two things hold that off without constraining
// what the editor can type. draftMeta is shown what is already in use so it
// reuses instead of reinventing, and normalizeSubject folds a new value onto
// an existing one when they differ only in case or spacing.
// Seeded once, only when localStorage has never held a vocabulary, the same
// pattern the Backstory seed once used. Derived on 2026-09-18 from three things rather
// than invented: the 21 Backstory rows, which are already a considered map of
// what NTK follows; the 612 article titles in the current window, where Trump
// and the White House, Russia, Anthropic, Iran, the Pentagon, Medicaid, the
// DOJ and the courts dominate; and the editorial pillars in GLOBAL.
//
// Four Backstory rows were deliberately left out. Order, Power, Equality and
// Faith are a historian's categories and are the right shape for pairing a
// story to a long arc, which is what they were built for. They are the wrong
// shape for a reader, who does not say they follow Power; they say they follow
// the courts, or guns, or abortion. Those are here instead.
//
// This is a starting point, not a fixed list. draftMeta may still coin a new
// subject when none of these fits, and the subjects tab renames and removes.
function seedSubjects() {
  return [
    'Artificial Intelligence', 'Immigration', 'The Courts', 'Executive Power',
    'Elections and Voting', 'Health Care', 'Housing and Cost of Living',
    'Trade and Tariffs', 'Markets', 'Climate', 'Energy', 'Ukraine and Russia',
    'Gaza', 'Iran', 'Taiwan', 'America Abroad', 'Guns and Policing',
    'Abortion and Bodily Autonomy', 'Education', 'The Media', 'Work and Wages',
  ];
}
let SUBJECTS = load(LS.subjects, null) || seedSubjects();

function knownSubjects() {
  var seen = {}, out = [];
  (LINEUP || []).forEach(function(s) {
    var v = (s.subject || '').trim();
    if (v && !seen[v.toLowerCase()]) { seen[v.toLowerCase()] = 1; out.push(v); }
  });
  SUBJECTS.forEach(function(v) {
    if (v && !seen[v.toLowerCase()]) { seen[v.toLowerCase()] = 1; out.push(v); }
  });
  return out;
}

function normalizeSubject(raw) {
  var v = String(raw == null ? '' : raw).replace(/\s+/g, ' ').trim().replace(/[.,;:]+$/, '');
  if (!v) return '';
  var known = knownSubjects();
  for (var i = 0; i < known.length; i++) {
    if (known[i].toLowerCase() === v.toLowerCase()) return known[i];
  }
  return v;
}

function saveSubjects() { localStorage.setItem(LS.subjects, JSON.stringify(SUBJECTS)); }

function rememberSubject(v) {
  if (!v) return;
  if (!SUBJECTS.some(function(x) { return x.toLowerCase() === v.toLowerCase(); })) {
    SUBJECTS.push(v);
    saveSubjects();
  }
}

function esc(s){ const d=document.createElement('span'); d.textContent=s==null?'':s; return d.innerHTML; }
function rel(iso){ if(!iso) return ''; const m=Math.round((Date.now()-new Date(iso))/60000);
  if(m<1) return 'now'; if(m<60) return m+'m'; const h=m/60; return (h<10?h.toFixed(1):Math.round(h))+'h'; }
function pubList(p){ return p.length<=3 ? p.join(', ') : p.slice(0,3).join(', ')+' +'+(p.length-3); }

// Canonical URL: identity key for suppression + RSS/ER dedup (layer 2).
const TRACK_PARAMS = /^(utm_|fbclid|gclid|mc_cid|mc_eid|cmpid|ref$|smid|ocid|ito)/i;
function canon(u){
  try {
    const url = new URL(u);
    let host = url.hostname.toLowerCase().replace(/^(www|m|amp)\./,'');
    let path = url.pathname.replace(/\/amp\/?$/,'/').replace(/\/+$/,'') || '/';
    const keep = [];
    url.searchParams.forEach((v,k)=>{ if(!TRACK_PARAMS.test(k)) keep.push(k+'='+v); });
    return host + path + (keep.length ? '?'+keep.sort().join('&') : '');
  } catch { return (u||'').trim(); }
}
function isSup(u){ return !!SUP[canon(u)]; }
function toggleSup(u){ const c=canon(u); if(SUP[c]) delete SUP[c]; else SUP[c]=true; saveSup(); }

// Syndication detection (layer 3): 8-word shingle Jaccard over body text.
function shingles(text, n=8){
  const w = (text||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(Boolean);
  const out = new Set();
  for (let i=0; i+n<=w.length; i++) out.add(w.slice(i,i+n).join(' '));
  return out;
}
function jaccard(a,b){ if(!a.size||!b.size) return 0; let inter=0;
  const [s,l]=a.size<b.size?[a,b]:[b,a]; for(const x of s) if(l.has(x)) inter++;
  return inter/(a.size+b.size-inter); }
function titleTokens(t){ return new Set((t||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(x=>x.length>2)); }

function parseJSON(raw){
  let c = raw.trim().replace(/^```json?\n?/,'').replace(/\n?```$/,'').trim();
  const i = c.indexOf('['); const j = c.indexOf('{');
  if (i>0 && (j<0 || i<j)) c = c.slice(i);
  else if (j>0 && (i<0 || j<i)) c = c.slice(j);
  try { return JSON.parse(c); }
  catch (e) {
    // Truncated mid-array (a max_tokens ceiling hit on a big response) —
    // salvage whatever complete top-level objects exist before the cutoff
    // rather than losing the entire batch to one unterminated string.
    // Same principle already proven in ledger.py's Python-side parser.
    if (c.trim().startsWith('[')){
      const objs = []; let depth = 0, start = -1, inStr = false, esc = false;
      for (let k = 0; k < c.length; k++){
        const ch = c[k];
        if (inStr){
          if (esc) esc = false;
          else if (ch === '\\') esc = true;
          else if (ch === '"') inStr = false;
          continue;
        }
        if (ch === '"') { inStr = true; continue; }
        if (ch === '{'){ if (depth === 0) start = k; depth++; }
        else if (ch === '}'){ depth--; if (depth === 0 && start >= 0){
          try { objs.push(JSON.parse(c.slice(start, k+1))); } catch {}
        }}
      }
      if (objs.length) return objs;
    }
    throw e;
  }
}

/* ─── API plumbing (ported from ntk-production) ─── */
async function ai(prompt, maxTok=1500){
  if (!SETTINGS.antKey) throw new Error('No Anthropic key — set it in ⚙');
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':SETTINGS.antKey,
      'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    // thinking off via between_tools (2026-08-17; moved from 'disabled' when Sonnet 5.5
    // began returning 400 on it): Sonnet 5 defaults to
    // adaptive thinking when this is omitted, and thinking tokens draw
    // from the SAME max_tokens ceiling as the response text — confirmed
    // in Anthropic's own Sonnet 5 migration notes. That's what produced
    // "[Generation failed: No text content in response (content blocks:
    // thinking)]" on Truths and a mid-word truncation on Possibilities:
    // thinking consumed most or all of the budget before any real text
    // came out, and how much it consumes varies call to call — the same
    // section can succeed on one run and fail on the next. None of Pulse's
    // editorial writing is the kind of multi-step logical/math task
    // thinking is built for, so disabling it trades a marginal, unproven
    // quality gain for actually reliable output.
    body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:maxTok,
      thinking:{type:'between_tools'},messages:[{role:'user',content:prompt}]})
  });
  const d = await r.json();
  if (d.error) throw new Error(d.error.message);
  // T-0044: a safety-classifier refusal comes back as HTTP 200 with
  // content: [] and no error field — d.error above never catches it, so
  // every refusal fell through to the generic "content blocks: empty"
  // message with no indication that's what happened. Confirmed 2026-09-24
  // against a real captured response: stop_reason "refusal",
  // stop_details.category "bio". Checked ahead of the generic empty-text
  // throw below so the editor sees the actual cause instead of a message
  // that looks like a network or parsing failure.
  if (d.stop_reason === 'refusal') {
    const cat = d.stop_details?.category;
    throw new Error('Refused by the model' + (cat ? ` (category: ${cat})` : ''));
  }
  // Defense in depth, kept even with thinking disabled above: still filter
  // by block type rather than trusting position, matching the pattern
  // triage.py already uses server-side for Haiku. Throws a clear,
  // diagnosable error instead of silently handing undefined to a caller
  // three functions away.
  const blocks = d.content || [];
  const text = blocks.filter(b => b.type === 'text').map(b => b.text || '').join('');
  if (!text) {
    const types = blocks.map(b => b.type).join(', ') || 'empty';
    throw new Error(`No text content in response (content blocks: ${types})`);
  }
  return text;
}
// Recraft image generation. Direct browser call, same convention as ai()
// above — key lives in SETTINGS/localStorage only, never written to a file.
// Style is optional and only meaningful on V2/V3 models; the model choice
// itself (not the style string) is what determines raster vs vector output
// — anything ending _vector returns SVG.
// NTK brand defaults — applied to every Recraft call automatically so the
// "global rules" live in code, not in something typed per-prompt. Recraft
// itself has no persistent memory between calls; this is how we fake it
// until there's a real style_id (see the style guide, §7).
const NTK_SWATCHES = [
  {hex:'#0798F2', name:'electric blue'},
  {hex:'#F2AE2E', name:'amber'},
  {hex:'#DC6550', name:'terracotta'},
  {hex:'#01B2A7', name:'teal'},
];
const NTK_BRAND_COLORS = [
  [7,152,242],   // electric blue
  [242,174,46],  // amber
  [220,101,80],  // terracotta
  [1,178,167],   // teal
];
const NTK_PHOTO_SUFFIX = 'Documentary, restrained composition, no embedded text, no generic corporate iconography.';
const NTK_ILLUSTRATION_SUFFIX = 'Loose gouache and ink texture, visible brushwork, imperfect linework, warm human specificity — not vector-clean, not glossy digital rendering, not airbrushed. No embedded text.';

async function recraftGenerate(prompt, model, style, size, n, useBrandColors){
  if (!SETTINGS.recraftKey) throw new Error('No Recraft key — set it in ⚙');
  const body = { prompt, model, size, n, response_format:'url' };
  if (style) body.style = style;
  if (useBrandColors) body.controls = { colors: NTK_BRAND_COLORS.map(rgb=>({rgb})) };
  const r = await fetch('https://external.api.recraft.ai/v1/images/generations', {
    method:'POST',
    headers:{ 'Authorization':'Bearer '+SETTINGS.recraftKey, 'Content-Type':'application/json' },
    body: JSON.stringify(body)
  });
  const raw = await r.text();
  if (!r.ok) throw new Error('Recraft error '+r.status+': '+raw.slice(0,400));
  let d; try { d = JSON.parse(raw); } catch { throw new Error('Non-JSON response: '+raw.slice(0,400)); }
  return (d.data||[]).map(x=>x.url).filter(Boolean);
}
function buildImgPrompt(story){
  const seed = [story.title, story.angle].filter(Boolean).join('. ');
  return `Editorial illustration for a news story. ${seed}. `+
    `Clean composition, no embedded text, suitable as a digest card header image.`;
}
// Pulls a generated image down and runs it through the exact same
// compress-to-800px-JPEG-base64 pipeline as handleStoryImageUpload, so a
// Recraft pick lands in story.featuredImage identically to an uploaded
// photo — same schema, same build script decode step downstream. Falls
// back to storing the bare Recraft URL only if the canvas read is blocked
// (cross-origin without CORS headers) — flag that to the reader in status
// if it happens, since a raw URL skips the usual base64-decode-on-build step.
function lockGeneratedImage(story, url){
  story.status = 'Fetching generated image…'; render();
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    try {
      const canvas = document.createElement('canvas');
      const MAX_W = 800, ratio = Math.min(MAX_W / img.width, 1);
      canvas.width = Math.round(img.width * ratio);
      canvas.height = Math.round(img.height * ratio);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      story.featuredImage = canvas.toDataURL('image/jpeg', 0.75);
    } catch (e) {
      // Tainted canvas — CORS blocked the pixel read. Store the direct URL
      // instead so the pick isn't lost; note this differs from the uploaded-
      // photo path and won't go through the base64 decode step in the build script.
      story.featuredImage = url;
      story.status = 'Locked (stored as a direct URL — canvas read was CORS-blocked, so this bypasses the usual base64 export step).';
    }
    story.overlayColor = story.overlayColor || '#0798F2';
    story.overlayOpacity = story.overlayOpacity || 45;
    story.imgGenOpen = false; story.imgCandidates = null;
    saveLineup(); render();
  };
  img.onerror = () => {
    story.status = 'Could not load the generated image (network or CORS). Try again or download and use "add photo" instead.';
    render();
  };
  img.src = url;
}
async function generateStoryImage(story, promptOverride){
  story.imgBusy = true; story.imgErr = ''; render();
  try {
    const prompt = promptOverride || story.imgGenPrompt || buildImgPrompt(story);
    story.imgGenPrompt = prompt; // stored/displayed unsuffixed — suffix is applied silently below
    const model = story.imgGenModel || 'recraftv4_1';
    const styleCompatible = /^recraftv[23]/.test(model);
    const style = styleCompatible ? (story.imgGenStyle || '') : '';
    const size = story.imgGenSize || '1:1';
    const useBrandColors = story.imgGenUseColors !== false; // default on
    const register = story.imgGenRegister || 'photo';
    const suffix = register === 'illustration' ? NTK_ILLUSTRATION_SUFFIX : NTK_PHOTO_SUFFIX;
    const finalPrompt = prompt + ' ' + suffix;
    story.imgCandidates = await recraftGenerate(finalPrompt, model, style, size, 4, useBrandColors);
  } catch (e) {
    story.imgErr = e.message;
  } finally {
    story.imgBusy = false; saveLineup(); render();
  }
}

// Wikimedia Commons search, ranked toward 16:9. The MediaWiki API supports
// anonymous cross-origin calls via origin=* — no key, no CORS uncertainty,
// unlike Recraft. This can't judge "best" editorially — it surfaces
// landscape-leaning candidates with real width/height so you're picking from
// a shortlist instead of scrolling a wall of portrait crops.
async function commonsSearch(query){
  const url = 'https://commons.wikimedia.org/w/api.php?action=query&generator=search'+
    '&gsrsearch='+encodeURIComponent(query)+'&gsrnamespace=6&gsrlimit=40'+
    '&prop=imageinfo&iiprop=url|size|extmetadata&format=json&origin=*';
  const r = await fetch(url);
  if (!r.ok) throw new Error('Commons error '+r.status);
  const d = await r.json();
  const pages = d.query && d.query.pages ? Object.values(d.query.pages) : [];
  const results = pages.map(p=>{
    const info = p.imageinfo && p.imageinfo[0];
    if (!info || !info.width || !info.height) return null;
    const meta = info.extmetadata || {};
    const strip = html => { const d = document.createElement('div'); d.innerHTML = html||''; return d.textContent.trim(); };
    return {
      title: p.title,
      url: info.url,
      width: info.width,
      height: info.height,
      ratio: info.width / info.height,
      credit: strip(meta.Artist && meta.Artist.value) || strip(meta.Credit && meta.Credit.value) || '',
      license: meta.LicenseShortName ? meta.LicenseShortName.value : '',
      attributionRequired: !(meta.LicenseShortName && /public domain|pd-/i.test(meta.LicenseShortName.value))
    };
  }).filter(Boolean)
    .filter(x=>x.ratio > 1.2) // landscape only — drop portrait crops before ranking
    .sort((a,b)=>Math.abs(a.ratio-16/9)-Math.abs(b.ratio-16/9)); // closest to 16:9 first
  return results.slice(0, 12);
}
async function searchStoryCommons(story, queryOverride){
  story.commonsBusy = true; story.commonsErr = ''; render();
  try {
    const q = queryOverride || story.commonsQuery || story.title;
    story.commonsQuery = q;
    story.commonsResults = await commonsSearch(q);
  } catch (e) {
    story.commonsErr = e.message;
  } finally {
    story.commonsBusy = false; saveLineup(); render();
  }
}
// Same lock pipeline as Recraft — compress to the standard 800px JPEG so a
// Commons pick lands in featuredImage identically either way. Commons images
// are served with CORS headers, so the canvas read should succeed; same
// URL-fallback safety net as the Recraft path if it doesn't.
function lockCommonsImage(story, result){
  story.status = 'Fetching Commons image…'; render();
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    try {
      const canvas = document.createElement('canvas');
      const MAX_W = 800, ratio = Math.min(MAX_W / img.width, 1);
      canvas.width = Math.round(img.width * ratio);
      canvas.height = Math.round(img.height * ratio);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      story.featuredImage = canvas.toDataURL('image/jpeg', 0.85);
    } catch (e) {
      story.featuredImage = result.url;
      story.status = 'Locked (stored as a direct URL — canvas read was CORS-blocked).';
    }
    story.featuredImageCredit = result.attributionRequired
      ? (result.credit + (result.license ? ' · ' + result.license : '')).trim()
      : '';
    story.overlayColor = story.overlayColor || '#0798F2';
    story.overlayOpacity = story.overlayOpacity || 45;
    story.commonsOpen = false; story.commonsResults = null;
    saveLineup(); render();
  };
  img.onerror = () => {
    story.status = 'Could not load that Commons image. Try another candidate.';
    render();
  };
  img.src = result.url;
}

function proxyUrl(params){
  const base = (SETTINGS.proxyBase||'').replace(/\/+$/,'');
  if (!base) throw new Error('No proxy base — set the Netlify domain in ⚙');
  return base + '/.netlify/functions/news?' + new URLSearchParams(params);
}
async function netlifyFetch(params){
  const r = await fetch(proxyUrl(params));
  const raw = await r.text();
  if (!r.ok) throw new Error('Proxy error '+r.status+': '+raw.slice(0,400));
  let data;
  try { data = JSON.parse(raw); }
  catch {
    // EventRegistry sometimes rejects a request with a plain-text response
    // (bad/foreign key, account issue) instead of JSON — that response was
    // getting truncated to a few characters by the generic "not valid
    // JSON" parse error. Surface the actual sentence instead.
    throw new Error('Non-JSON response: '+raw.slice(0,400));
  }
  // The proxy always answers 200 even when EventRegistry itself failed
  // internally (bad key, exhausted quota, malformed request) — ER expresses
  // that as {"error": "..."} in the body, not an HTTP error code. Without
  // this check that failure looks identical to "zero real results."
  if (data && typeof data.error === 'string') throw new Error('EventRegistry: '+data.error);
  if (Array.isArray(data)) return data;
  if (data.events?.results) return data.events.results;
  return data.articles?.results || [];
}
async function fetchUrlBody(url){
  try {
    const r = await fetch(proxyUrl({mode:'fetch-url', url}));
    if (!r.ok) return {url, title:'', body:''};
    const d = await r.json();
    return {url, title:d.title||'', body:d.body||d.description||''};
  } catch { return {url, title:'', body:''}; }
}

const GLOBAL = `You are the journalist-historian for NTK News, a nonprofit news-and-history app. Advanced degree, reads a lot of history, writes for a reader who is anxious about where things are headed, has mostly disengaged from the news as a coping mechanism, and assumes most outlets are spinning them. The expertise is yours. The vocabulary is plain — not because the reader can't handle more, but because anything that sounds like showing off reads as exactly the kind of con this reader has learned to distrust.

EDITORIAL PILLARS:
1. Authoritarian movements are persistently ineffective, corrupt, incompetent, bullying, and wasteful. Pattern, not exception.
2. Income inequality erodes trust. Immigration is a net economic positive. Insufficient childcare and eroding middle-class ladders are structural failures. America's greatness is its people, its capacity for renewal, its flexible founding documents.
3. Climate change undermines stability. Privacy, reproductive rights, freedom of movement are constitutional rights. The Constitution is under stress from all three directions.
4. America is defined by contradictions. Tension between freedom and community obligation is the operating system. Journalism makes truths more durable.

TONE: Tuchman and Halberstam, not Lippmann — scene and consequence before judgment, never a verdict handed down from above. This reader doesn't trust people who sound certain; they trust people who show their work and let the irony land on its own. Grounded, direct, like a colleague who's seen this pattern before — unsurprised by it, but not bored by it either. The stakes are real and the writing should feel like it.

STAKES & PLOT: Every item needs someone or some institution whose situation actually changes — who wins, who loses, who's exposed, who's covering for whom — named specifically, never abstractly. Build toward that; don't open with it. If a named actor isn't a household name, give them one clause that makes them a character — a pattern, a tell, a prior stumble — not just a title. Movements within a section should follow from each other, not sit side by side: use a connective sentence ("That wasn't the only place the story didn't hold up." / "Three miles away, the calculation looked different.") instead of restarting cold at each new bold headline.

STRUCTURAL RULES: Weave all source articles into unified analysis — never summarize separately. Citations: ([Source Name](URL)) in sentence before closing period — this parenthetical is the ONLY attribution. Do not also name the outlet narratively in the sentence ("The New York Times reported...", "according to Reuters") — that's double attribution and reads as padding. Exception: when a sentence is explicitly comparing or contrasting what different outlets reported, narrative naming is allowed since the parenthetical alone can't carry that distinction. **Bold** for item headlines only — never for subheads. A subhead is *italicized*, its own standalone sentence, never bold and never immediately adjacent to a bold headline with nothing between them (they must never read as two bold lines in a row). Every factual claim needs a source. No em dashes anywhere in output: use a period, a colon, a semicolon or a pair of commas instead. This is a hard formatting rule, not a preference (see VOICE RULES 8). Always leave a space after a closing ** before the next word — never let a bold span run directly into the next word or into another bold span with no space between them. A subhead is a sentence that orients the reader inside the story, never the section's own name (Truths/Probabilities/Possibilities/Lies) restated as a label — the reader already knows which section they're in.

SOURCE WEIGHTING: Articles are primary. Historical parallels are seasoning — one sentence max. NTK has a SWIPE LEFT History layer — create curiosity gaps.

QUALITY FLOOR: Clarity (no sentence needs rereading), Stakes (the reader knows within two sentences who specifically gains or loses, and why), Momentum (each sentence raises a question the next one answers — the reader is pulled forward, not handed a list), Aesthetic pleasure (writing moves). All four required.

CROSS-SECTION RULES: Already happened → Truths only. Most likely next step → Probabilities only. Lower-probability scenario → Possibilities only. Identifiable actor making unsupported claim → Lies only.

LENGTH: No word ceiling. Length is governed by what the stakes and plot actually require — cut anything that doesn't deepen stakes, advance the plot, or pay off a setup, the same discipline you'd apply to an unnecessary citation. Most sections will still land around 300-500 words once that's applied honestly; if you're well past that, you're probably padding, not building. If source articles don't support an item, write [INSUFFICIENT SOURCE MATERIAL] — do not invent.`;

const VOICE_REF = `
VOICE. STUDY THESE EXAMPLES:
HEADLINE: "Norway Gave Every Five-Year-Old an iPad in 2016. A Decade Later, 500,000 Norwegians Can't Read a Text Message." Two sentences: scale, then consequence with a unit the reader can feel.
BODY (worked example, illustrative; adjust to taste): "Kash Patel Said the FBI Stopped Snipers and Bomb Drones at a White House UFC Event. The Secret Service Wishes He'd Stayed Quiet. The FBI says it broke up a plot to attack a UFC card at the White House using explosive-rigged drones and at least one sniper position, which is the kind of detail prosecutors keep sealed until they are ready to use it. Patel announced it anyway. Secret Service officials were reportedly furious, telling reporters he had put the case at risk to make himself the man who saved fight night. Then JD Vance, defending his own FBI director without quite agreeing with him, said the plotters 'weren't even in town' when the event happened. Either the plot died early, or 'thwarted' was carrying more weight than the facts could bear. It's Patel's third stumbled rollout this year. Twice before, a case went quiet within a week of him describing it on camera. That's not bad luck anymore. That's a pattern."
DETAIL: "Researchers appended FAQs asking media not to use the words 'stupid,' 'dumb,' or 'brain rot.' A tell that the findings are exactly as bad as they sound." The meta-detail reveals more than the finding.
RULES: (1) Headline = fact + consequence with a unit. (2) Every number needs a unit. (3) One surgical quote from a named person only if it does something prose cannot. (4) Name the real mechanism beneath the stated one. (5) Don't open with the verdict; let the sequence of facts earn it. (6) End with weight, not a moral. (7) No signpost verbs. Banned: underscores, highlights, demonstrates, reveals, showcases, reflects, signals, represents, speaks to, illustrates, emphasizes, spotlights, exemplifies. If a report, memo, study, or "this" is the grammatical subject doing one of these to the reader, nothing happened in the sentence. Find the actor and rewrite so they did something. "The settlement underscores growing scrutiny of social media's effect on kids" → "Meta agreed to pay $18 billion. States said in court filings Meta hid its own research on teen addiction for years." Applies everywhere: headlines, ledes, and every section body alike. (8) No em dashes. Not one, anywhere: headlines, ledes, bodies, subheads. An em dash is almost always a period, a colon, a semicolon or a pair of commas that hasn't been chosen yet, and choosing is the writing. Period when the second half is its own thought: "at least one sniper position. That is the kind of detail prosecutors keep sealed." Colon when it introduces: "Two sentences: scale, then consequence." Commas when it encloses an aside: "If it reads like spin, even spin in the reader's favor, rewrite it flatter." If none of the three works, the sentence is carrying two ideas and wants to be two sentences. Every example above is written this way on purpose; match them. (9) Vary the sentence. Rule 8 pushes every complex sentence toward two simple ones, and a page of simple sentences reads like a machine being careful. Subordination is still free: a relative clause, a conditional, a participial opener. Avoid a succession of loose sentences, especially three in a row that share a shape or hang off "and" and "but": rebuild one of them. Three short declaratives back to back is a drumbeat, not a default; use it once, at a close, when you mean it. (10) Put statements in positive form. Say what is, not what isn't. "The agency did not approve the permit" is "The agency denied the permit." "He was not often on time" is "He was usually late." Save the negative for actual denial, which is most of what Lies does, and it lands harder there when nothing else on the page is hedging in negatives. (11) Express coordinate ideas in similar form. Anything joined by "and," "or," "either," "not only" or a list takes the same grammatical shape. "The bill raises fares, cuts service, and the unions were not consulted" is three ideas wearing two shapes. Parallel construction is how a reader knows which things belong together without being told. (12) Keep related words together. Subject beside verb, modifier beside what it modifies. "He only reported the settlement to the board" and "He reported only the settlement to the board" are different facts. A qualifier that drifts changes the meaning quietly, which is exactly the move this reader is already scanning for. (13) In summaries, keep to one tense. The Today overview and every lede are summaries: choose the tense and hold it for the whole passage. Sliding between what happened, what is happening and what will happen inside one summary makes the reader re-sequence events they were handed in order to save time. (14) Reward the reader for opening this instead of scrolling past. One clause of real personality per section: a wry aside, a specific human-scale observation, the kind of detail you'd actually text a friend, not the kind a pundit prints. Not license to soften a hard fact or joke at someone's expense — the humor has to land on the absurdity already sitting in the story, not decorate around it. If every sentence in a passage could have been written by a competent temp working from the same facts, the personality didn't make it in. The Kash Patel example above is the target: "third stumbled rollout" and "That's not bad luck anymore. That's a pattern" are personality riding on fact, not personality instead of fact.
CYNIC TEST: "Does this sound like someone trying to sell me something, or someone just telling me what happened?" If it reads like spin, even spin in the reader's favor, rewrite it flatter and let the facts carry the weight instead.`;

const SEC_PROMPTS = {
truths:`You are producing the TRUTHS section. Output only the Truths section.

probabilities:`You are producing the PROBABILITIES section. Output only the Probabilities section.

possibilities:`You are producing the POSSIBILITIES section. Output only the Possibilities section.

READER CONTEXT: The reader has already read Truths and Probabilities. Do not re-establish facts or re-quote figures already stated in those sections. Start from what's already known and move into territory neither section covered.

CONCEPTUAL FRAME — THE ADJACENT POSSIBLE: this section runs on Stuart Kauffman's concept, popularized by Jason Kottke — the idea that at any moment, what's newly reachable isn't infinite. It's the specific, finite set of new combinations that just became available because of what already exists right now: a door that just opened because of what's already in the room, not a room three hallways away you're merely imagining. Possibilities are not "anything that could happen" — they are the doors this week's specific combination of actors, institutions, and events just opened that weren't open before. Every possibility must answer one question: what became newly combinable today that wasn't combinable yesterday? If the scenario requires an element that isn't already sitting in the articles — an actor acting wildly out of character, a technology that doesn't exist yet, an institution behaving with no precedent — it's not adjacent, it's a leap into the merely imaginable, and it doesn't belong here.

LENGTH: Aim for 400-450 words. If you're re-stating facts from Truths or Probabilities to set up a possibility, you're padding — assume the reader retained them and skip to the combination.`,

lies:`You are producing the LIES section. Output only the Lies section.

today:`You are producing TODAY — the overview screen a reader sees first, before the full Digest.

function makePrompt(section, articlesText, suppUrls) {
  const suppBlock = suppUrls && suppUrls.length
    ? '\n\nEDITOR-IMPORTED SOURCES:\n' + suppUrls.map(u=>`URL: ${u.url}\n${u.body||'[unavailable]'}`).join('\n\n---\n\n')
    : '';
  const visualBlock = `

VISUAL MARKERS — insert at most one of each per section, only when the element genuinely earns it:

[PULLQUOTE: "verbatim quote from a named source in your articles" | Speaker Name, role or context]
Use only when a direct quote does something your prose cannot — not to break up text. Must be verbatim. Must name the speaker. Place inline where the quote lands in the narrative.
This marker IS your one allowed direct quote for the section (see VOICE_REF rule 3) — it is not a second, separate quote opportunity. If you use PULLQUOTE, do not also render that same line as a quoted sentence in the surrounding prose; paraphrase the moment in prose instead and let the marker carry the verbatim words.

[STAT: the number with its unit | one plain sentence of what it means]
Use only when a specific number is the sharpest way to land the stakes. The number should be surprising or concrete enough to stop the reader. Not a decoration.

A section without a visual marker is not incomplete. Omit both if neither earns its place.`;
  return `${GLOBAL}\n\n${VOICE_REF}\n\n${SEC_PROMPTS[section]}${visualBlock}${suppBlock}\n\nARTICLES TO ANALYZE:\n\n${articlesText}`;
}

// ─── Today overview — digest of the digest ───
// Fed the FINISHED, edited Truths/Probabilities/Possibilities of everything
// in today's lineup — never raw sources, never Lies. Separate from
// makePrompt() deliberately: the input here is already-written prose, not
// source articles, and labeling it "ARTICLES TO ANALYZE" would be wrong.
function todayInputBlock(){
  return LINEUP
    .filter(s => s.packages && s.packages.truths)
    .map((s, i) => {
      const { headline, lede, body } = extractTruthsTags(s.packages.truths || '');
      const prob = s.packages.probabilities || '';
      const poss = s.packages.possibilities || '';
      return `DIGEST POSITION: ${i + 1}${i === 0 ? ' (LEAD STORY — open with this one)' : ''}\nSTORY KEY: ${s.key || s.id}\nHEADLINE: ${headline}\nLEDE: ${lede}\nTRUTHS BODY:\n${body}\n\nPROBABILITIES:\n${prob}\n\nPOSSIBILITIES:\n${poss}`;
    })
    .join('\n\n===\n\n');
}
function makeTodayPrompt(storiesBlock){
  return `${GLOBAL}\n\n${VOICE_REF}\n\n${SEC_PROMPTS.today}\n\nTODAY'S FINISHED STORIES (Truths/Probabilities/Possibilities only — Lies intentionally excluded):\n\n${storiesBlock}`;
}
// Guarantees no paragraph runs longer than ~3 sentences, regardless of
// what the model did. Evaluated per-paragraph, not as an all-or-nothing
// check on the whole text — a text with SOME real breaks but one or two
// overly dense stretches used to skip entirely, since "any break exists
// anywhere" was treated as "trust it completely." Now every paragraph
// (including ones the model already broke out correctly) gets the same
// length check, so uneven output can't ship uneven.
function autoParagraph(text){
  if (!text) return text;
  const existingParagraphs = text.split(/\n\s*\n/);
  const rechunked = existingParagraphs.map(para => {
    const trimmed = para.trim();
    if (!trimmed) return '';
    const protectedText = trimmed.replace(/\[[^\]]*\]/g, m => m.replace(/\./g, '\u0000DOT\u0000'));
    const sentences = protectedText
      .split(/(?<=[.!?])\s+(?=[A-Z"'\u201c*\[])/)
      .map(s => s.replace(/\u0000DOT\u0000/g, '.'));
    if (sentences.length <= 3) return trimmed;
    const chunks = [];
    for (let i = 0; i < sentences.length; i += 3) chunks.push(sentences.slice(i, i + 3).join(' '));
    return chunks.join('\n\n');
  }).filter(Boolean);
  return rechunked.join('\n\n');
}

async function generateToday(){
  const block = todayInputBlock();
  if (!block){ alert('No generated stories in the lineup yet — generate story packages first, then Generate Today.'); return; }
  TODAY_OV.busy = true; saveToday(); render();
  try {
    const raw = await ai(makeTodayPrompt(block), 1200);
    // Same fixBoldSpacing pass every story section gets, plus a defensive
    // strip for a bolded opener that's just restating "Today"/"Overview" —
    // the prompt now forbids it explicitly, but this is the same
    // belt-and-suspenders posture as stripSectionSelfLabel: a prompt
    // instruction reduces the failure, it doesn't guarantee zero.
    let text = fixBoldSpacing(raw || '');
    text = text.replace(/^\s*\*\*\s*(today|overview|in this edition)\s*\*\*\s*\n*/i, '');
    text = autoParagraph(text);
    TODAY_OV.text = text;
    TODAY_OV.generatedAt = new Date().toISOString();
  } catch(e){
    TODAY_OV.text = '[Generation failed: '+e.message+']';
  }
  TODAY_OV.busy = false; saveToday(); render();
}

/* ─── export (ported from ntk-production) ─── */
function jsEsc(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/\r?\n/g,' ').trim(); }
function extractTruthsTags(text){
  const grab = (tag)=>{ const m=text.match(new RegExp('\\['+tag+':\\s*([\\s\\S]*?)\\]')); return m?m[1].trim():''; };
  return { headline: grab('HEADLINE'), lede: grab('LEDE'),
    body: text.replace(/\[HEADLINE:[\s\S]*?\]/,'').replace(/\[LEDE:[\s\S]*?\]/,'').replace(/\[SUBHEAD:[\s\S]*?\]/,'').trim() };
}
function mdToHtml(text){
  const marks=[];
  let out = text.replace(/\[PULLQUOTE:\s*"([^"]+)"\s*\|\s*([^\]]+)\]/g,(f,quote,speaker)=>{
    marks.push({quote,speaker}); return `\u0000PQ${marks.length-1}\u0000`; });
  marks.forEach(({quote})=>{ if(!quote) return;
    const escaped = quote.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    out = out.replace(new RegExp('["\u201c]'+escaped+'["\u201d][,.]?\\s*','g'),''); });
  marks.forEach((m,i)=>{ out = out.replace(`\u0000PQ${i}\u0000`,
    `<div class="ntk-pullquote"><p class="ntk-pq-text">${m.quote}</p><cite class="ntk-pq-cite">${m.speaker}</cite></div>`); });
  return out
    .replace(/\[STAT:\s*([^|\]]+?)\s*\|\s*([^\]]+?)\s*\]/g,
      '<div class="ntk-stat"><div class="ntk-stat-num">$1</div><div class="ntk-stat-ctx">$2</div></div>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g,'<em>$1</em>')
    .replace(/\(\[([^\]]+)\]\(([^)]+)\)\)/g,'(<a href="$2" target="_blank" rel="noopener">$1</a>)')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function toSiteHtml(text){
  const blocks=[];
  let t = text
    .replace(/\[PULLQUOTE:\s*"([^"]+)"\s*\|\s*([^\]]+)\]/g,(m,quote,speaker)=>{
      blocks.push(`<div class="ntk-pullquote"><p class="ntk-pq-text">${quote}</p><cite class="ntk-pq-cite">${speaker}</cite></div>`);
      return `\n\n\u0000BLOCK${blocks.length-1}\u0000\n\n`; })
    .replace(/\[STAT:\s*([^|\]]+?)\s*\|\s*([^\]]+?)\s*\]/g,(m,num,ctx)=>{
      blocks.push(`<div class="ntk-stat"><div class="ntk-stat-num">${num}</div><div class="ntk-stat-ctx">${ctx}</div></div>`);
      return `\n\n\u0000BLOCK${blocks.length-1}\u0000\n\n`; })
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g,'<em>$1</em>')
    .replace(/\(\[([^\]]+)\]\(([^)]+)\)\)/g,'(<a href="$2" target="_blank" rel="noopener">$1</a>)')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return t.split(/\n{2,}/).map(p=>p.trim()).filter(Boolean).map(p=>{
    const m=p.match(/^\u0000BLOCK(\d+)\u0000$/);
    return m ? blocks[+m[1]] : (p.startsWith('<p')?p:`<p>${p}</p>`);
  }).join('');
}
// Same compression pipeline as editor.html's proven handleImageUpload —
// resize to 800px max width preserving aspect ratio, JPEG at 75% quality,
// stored as base64 directly on the story. Ported rather than reimplemented
// so behavior matches exactly what's already been working there.
function handleStoryImageUpload(story, file){
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const MAX_W = 800, ratio = Math.min(MAX_W / img.width, 1);

// T-0097: rank the Object Matrix against the editor's keywords and the story's subject. Plain scoring, no

const MS_STOP=new Set('a an and the of in on for to by with from at as or is are was were be its it this that these those v vs'.split(' '));

const MS_FIELDS=[['title',5],['line',3],['subgenre',3],['about',2],['row',2],['lenses',2],['author',2],['theme',1]];

// "war") counts for less than a rare one ("guard", "wiretap"). Computed once per pool.
const MS_IDF=new WeakMap();
function msIdf(objs){

    objs.forEach(o=>{ if (o.pool!=='matrix' || !o.url || o.link_status==='dead') return; n++;

function matrixSearch(objs, keywords, subject, limit){

    const idx=msIndex(o); let score=0; const why=[];
    terms.forEach(t=>{
      const hit=idx.find(fx=>fx.words.some(x=>msSame(x,t.w)));
      if (hit){ score+=hit.w*t.k*idf(t.w); why.push(t.w+': '+hit.f); }

// One search per topic the editor names (T-0085). It returns up to four candidates to a tray; nothing is added
// to the page until the editor ticks it. A document named by a secondary page but not found readable comes back
// as a lead rather than being thrown away, because a lead is often exactly what the editor wanted.
async function findCandidates(c, topic){
  const p=`You are the researcher for a Backstory category page at NTK, written for college-educated adults at the standard of an Advanced Placement history reader. The page is a dated chronology; each milestone is carried by a source the reader can open.

CATEGORY: ${c.title}
THE EDITOR WANTS SOURCES FOR THIS MILESTONE: ${topic}

Use web search. Return up to FOUR candidates, best first, each one of three kinds:
- "located": the document itself, or the copy held by an archive, library, court, legislature, government agency or the original publisher, readable at the link. A period newspaper page scanned in an archive counts.
- "lead": a specific primary document that a page you read NAMES (an ad, a letter, a filing, a directory entry, a report), where you did not find a readable copy. Give the page that names it.
- "news": a news report that carries the facts of this milestone. Only when you found no adequate primary source for it, and say why in why_no_primary.
Never Wikipedia, retail, homework or study-guide pages as a source (a Wikipedia page may be the cited_by page of a lead).

JSON only: {"candidates":[{"kind":"located|lead|news","title":"exact title of the document or article","author":"who issued or wrote it","year":"YYYY","date":"YYYY-MM-DD or null","source":"archive, publisher or outlet","source_url":"the exact page (located, news)","evidence_quote":"one sentence copied word for word from that page (located, news)","why_no_primary":"news only: why no primary source would do","cited_by_url":"lead only: the page that names it","cited_by":"lead only: who that page is","note":"one sentence for the editor"}]}
If you find nothing at all, answer {"candidates":[]}.`;
  const r=await aiSearch(p,3000), j=catJson(r.text), out=[], refused=[];
  (j.candidates||[]).slice(0,4).forEach(m=>{ const v=verifyCandidate(m, r.urls); if (v.ok) out.push(v.cand); else refused.push(String(m.title||'?').slice(0,50)+': '+v.reason); });
  return {cands:out, refused:refused};
}
// A ticked candidate becomes an object of the category's own. A located or news one carries its quote (CI
// drops a found object without one); a lead with a link the editor supplied is the editor's own source.
function addCandidate(c, t, url){
  const lead=t.kind==='lead', link=lead?String(url||'').trim():t.url;
  if (!link) return 'no link';
  const cid='custom-'+String(t.title).toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,60);
  if ((c.objects||[]).some(o=>o.object_id===cid)) return 'already on the page';
  const cu={id:cid,title:t.title,author:t.author||'',year:t.year,date:t.date||'',source:t.source||link.replace(/^https?:\/\/([^\/]+).*$/,'$1'),url:link};
  if (lead) cu.edited_by='editor';
  else { cu.found_by='search'; cu.evidence_quote=t.evidence_quote; if (t.kind==='news'){ cu.source_kind='news'; cu.why_no_primary=t.why_no_primary; } }
  c.custom_objects=(c.custom_objects||[]).filter(x=>x.id!==cid).concat([cu]);
  c.objects.push({object_id:cid,about:'',by:'editor'}); c.beginnings.push({object_id:cid,line:'',by:'editor'});
  return '';
}
async function searchTopics(c, topics){
  const tray=c.tray=(c.tray||[]), out=[];
  for (let i=0;i<topics.length;i+=3){                 // three searches at a time
    CAT_BUSY[c.id]='Searching '+Math.min(i+3,topics.length)+' of '+topics.length+'…'; render();
    const batch=topics.slice(i,i+3);
    const res=await Promise.all(batch.map(t=>findCandidates(c,t).catch(e=>({cands:[],refused:[],err:e.message}))));
    res.forEach((r,k)=>{
      const topic=batch[k];
      const kept=r.cands.filter(x=>!tray.some(y=>y.title===x.title&&y.topic===topic));
      kept.forEach(x=>tray.push(Object.assign({tid:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), topic:topic}, x)));
      if (!r.cands.length) tray.push({tid:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), topic:topic, kind:'empty', title:'', note:r.err?'search failed: '+r.err:(r.refused.length?'nothing usable: '+r.refused.join('; '):'nothing found')});
      out.push(topic.slice(0,40)+': '+(r.err?'search failed':r.cands.length+' found'));
    });
    saveCats();
  }
  return out;
}

async function findSources(id, text){
  const c=catEnsureLocal(id); if (!c) return;
  const topics=String(text||'').split(/\n+/).map(x=>x.replace(/^\s*(?:[-*\u2022]|\d+[.)])\s*/,'').trim()).filter(Boolean).slice(0,12);
  if (!topics.length) return;

    const res=await searchTopics(c, topics);

    c.revisions=(c.revisions||[]).concat([{at:new Date().toISOString(),request:'(find sources) '+topics.join(' | '),summary:CAT_MSG[id]}]);
  } catch(e){ CAT_MSG[id]='Search failed: '+e.message; }

}

// Capture what you have typed and where your cursor is, and put it back after the tab redraws.
const CAT_FIELDS='textarea, input[type=text], input:not([type])';
function catCaptureInputs(){
  const ed=document.getElementById('cat-editor'); if (!ed) return null;
  const dirty={}; let focus=null; const ae=document.activeElement;
  ed.querySelectorAll(CAT_FIELDS).forEach(el=>{
    const k=catFieldKey(el); if (!k) return;
    if (el.value!==el.defaultValue) dirty[k]=el.value;
    if (el===ae) focus={k:k,s:el.selectionStart,e:el.selectionEnd};
  });
  return {dirty:dirty, focus:focus, y:window.scrollY, sel:CAT_SEL};
}
function catRestoreInputs(st){
  const ed=document.getElementById('cat-editor'); if (!st || !ed || st.sel!==CAT_SEL) return;
  ed.querySelectorAll(CAT_FIELDS).forEach(el=>{
    const k=catFieldKey(el); if (!k) return;
    if (st.dirty[k]!==undefined) el.value=st.dirty[k];
    if (st.focus && st.focus.k===k){ el.focus(); try { el.setSelectionRange(st.focus.s, st.focus.e); } catch(e){} }
  });
  window.scrollTo(0, st.y);
}
