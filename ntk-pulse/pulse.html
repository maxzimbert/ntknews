// One Haiku call drafts angle + concept targeting together.
// Same craft rules as the default triage.py headline generation, applied
// on demand to a specific lineup story — for the moment you're actually
// choosing what leads the edition and want options to compare, not just
// the one the pipeline already committed to. Same guardrail language,
// same governing principle: compression and selection, never invention.
async function punchUpHeadline(story){
  story.busy = true; story.headlineCandidates = null; setStatus(story, 'Punching up the headline…');
  try {
    // T-0038: pull in the enriched body when it's already been fetched —
    // by punch-up time it usually has. Without it this was reasoning over
    // the exact same headline-only input triage.py already tried and
    // failed to sharpen, just asked a second time.
    const arts = activeArts(story).slice(0, 8);
    const context = arts.map(a=>{
      const snippet = (a.body||'').trim().slice(0, 600);
      return `- [${a.source}] ${a.title}` + (snippet ? `\n  ${snippet}` : '');
    }).join('\n');
    const prompt = `${VOICE_REF}\n\n`+
      `Current headline: "${story.title}"\n\nWhat the sources actually say:\n${context}\n\n`+
      `Write 3 alternative headlines for this story. Most true headlines are written at the flattest level — the administrative fact, not the stakes. Find the sharpest TRUE sentence available, not the first true sentence available.\n\n`+
      `Three moves, in order of how much they help:\n`+
      `- STRONGER VERB. "Switches to," "announces," "reports" are administrative. Reach for the verb that carries the actual weight — "scraps," "ends," "kills," "drops," "blocks" — WHEN the sources genuinely support that verb's force.\n`+
      `- STAKES OVER MECHANISM. Given a choice between how something happened and why it matters, lead with why it matters — provided the "why" is already in the sources, not an inference you're adding.\n`+
      `- CUT THE HEDGE-PHRASE. "Amid concerns about," "in a move that," "for [vague] reasons" soften a headline into safety. If the sources name the actual thing being hedged, name it.\n\n`+
      `THE GUARDRAIL, which governs all three: this is compression and selection, never invention. No superlative ("unprecedented," "historic," "shocking") unless the sources establish it. No rhetorical questions. No manufactured urgency for a story that isn't breaking. If a sharper phrasing would require implying anything not already in the sources, write the plainer version instead — a flat accurate headline always beats a sharp inaccurate one. No wordplay. Under 90 characters each.\n\n`+
      `Return ONLY a JSON array of exactly 3 strings, no fences: ["headline one","headline two","headline three"]`;
    const candidates = parseJSON(await ai(prompt, 400));
    story.headlineCandidates = Array.isArray(candidates) ? candidates.slice(0,3) : [];
    setStatus(story, story.headlineCandidates.length ? '' : 'No candidates returned — try again', !story.headlineCandidates.length);
  } catch(e){ setStatus(story, 'Punch-up failed: '+e.message, true); }
  story.busy = false; saveLineup(); render();
}
function applyPunchedHeadline(story, text){
  story.title = text; story.headlineCandidates = null; saveLineup(); render();
}

async function draftMeta(story){
  // Same failure this crashed on before: an empty headline list makes the
  // model answer in plain English ("I don't see any articles...") instead
  // of the JSON it was asked for, and that non-JSON response is what threw
  // the raw parse error. Catching it here means a clear, specific message
  // instead of "Unexpected token 'I'" leaking out of a JSON parser.
  if (activeArts(story).length === 0){
    setStatus(story, 'No source material to draft from — this story has no active articles. Use search or add-URL to bring in real sources first.', true);
    return;
  }
  story.busy=true; setStatus(story,'Drafting angle + concept…');
  try {
    const heds = story.articles.slice(0,8).map(a=>`- [${a.source}] ${a.title}`).join('\n');
    // The known list is shown so the model reuses a subject rather than
    // coining a near-duplicate. A reader's beat on "AI" and a beat on
    // "Artificial Intelligence" are the same attention split in half.
    const known = knownSubjects();
    const knownBlock = known.length
      ? `\n\nSubjects already in use. Reuse one EXACTLY as written if it fits; only coin a new one if none does:\n${known.map(k=>`- ${k}`).join('\n')}`
      : '';
    const prompt = `${VOICE_REF}\n\nToday is ${TODAY}. You are the NTK News editor. Story cluster:\n${heds}${knownBlock}\n\nReturn ONLY a JSON object, no fences:\n{"angle":"one sharp NTK sentence — what is actually happening and what's at stake, plain vocabulary, no hype","subject":"the ongoing subject a reader could follow across months, two or three words, e.g. Housing, Immigration, Artificial Intelligence, Ukraine. NOT the section of the paper and NOT this one story's peg","conceptEntity":"single most distinctive named person/org/place at the story's center, written exactly as a Wikipedia article title (disambiguate surnames), or \\"\\" if none","narrowKeyword":"exactly ONE word likely to appear verbatim in any article about this specific story, or \\"\\""}`;
    const raw = await ai(prompt, 400);
    const d = parseJSON(raw);
    if (d.subject) { story.subject = normalizeSubject(d.subject); rememberSubject(story.subject); }
    if (d.angle && !story.angle) story.angle = d.angle;
    else if (d.angle && story.angle && confirm('Replace current angle with draft?\n\n'+d.angle)) story.angle = d.angle;
    if (d.conceptEntity && d.conceptEntity !== story.conceptEntity){
      story.conceptUri = null; story.conceptMatch = null; story.conceptChecked = false; // entity changed — old resolution is stale
    }
    story.conceptEntity = d.conceptEntity||story.conceptEntity||'';
    story.narrowKeyword = d.narrowKeyword||story.narrowKeyword||'';
    setStatus(story,'');
  } catch(e){ setStatus(story,'Draft failed: '+e.message,true); }
  story.busy=false; saveLineup(); render();
}

/* Enrichment: ER pool search first (real bodies), fetch-url fallback for
   uncovered RSS links (meta/paragraph text), then dedup layers 2+3. */
async function enrich(story){
  story.busy=true;
  let hadError=false;                 // an actual failure occurred somewhere in this run
  let errMsg='';                      // the real cause — captured separately so the
                                       // fetch-url loop's own progress text ("Fetching:
                                       // NBC News…") can never overwrite it before the
                                       // final summary is built.
  let fetchFails=0;                   // count of fetch-url attempts that returned nothing
  try {
    if (!story.conceptEntity && !story.angle) await draftMeta(story);
    else if (!story.conceptEntity){
      setStatus(story,'Resolving concept…');
      try { const raw = await ai(`Story: "${story.title}". Return ONLY JSON, no fences: {"conceptEntity":"single most distinctive named person/org/place, as a Wikipedia article title, or \\"\\"","narrowKeyword":"ONE word likely verbatim in coverage, or \\"\\""}`, 200);
        const d = parseJSON(raw); story.conceptEntity=d.conceptEntity||''; story.narrowKeyword=d.narrowKeyword||'';
      } catch {}
    }

    // 1. ER pool search — the body engine.
    let er = [];
    if (story.conceptEntity){
      setStatus(story,'EventRegistry: resolving "'+story.conceptEntity+'"…');
      try {
        const matches = await netlifyFetch({mode:'resolve-concept', q:story.conceptEntity});
        const conceptUri = matches?.[0]?.uri;
        story.conceptUri = conceptUri || story.conceptUri || null;
        if (conceptUri){
          setStatus(story,'EventRegistry: pool coverage…');
          const base = {mode:'scan-by-concept', conceptUri, pool:'ntk',
            articlesCount:String(SETTINGS.maxArts), bodyLen:String(SETTINGS.bodyLen)};
          if (story.narrowKeyword){
            er = await netlifyFetch({...base, keyword:story.narrowKeyword});
            if (!er.length) er = await netlifyFetch(base);   // guessed keyword missed — concept alone
          } else er = await netlifyFetch(base);
          if (!er.length){ const {pool, ...broad} = base; er = await netlifyFetch(broad); }  // pool empty — go broad
        } else setStatus(story,'ER: no concept match for "'+story.conceptEntity+'" — RSS links only');
      } catch(e){ hadError=true; errMsg='ER unavailable: '+e.message; setStatus(story,errMsg+' — RSS links only',true); }
    } else if (!er.length && !story.conceptEntity){
      hadError=true; errMsg='No concept entity set — type one and hit check, or Draft first';
      setStatus(story,errMsg,true);
    }
    const erArts = er.map(a=>({
      url:a.url||'', title:a.title||'Untitled', source:a.source?.title||'Unknown',
      date:a.date||'', body:(a.body||''), bodyFrom: a.body?'er':'', included:true, dupOf:null, origin:'er'
    })).filter(a=>a.url);

    // 2. Merge (layer 2): canonical-URL match. ER copy wins — it has the body.
    const byCanon = new Map();
    for (const a of erArts) byCanon.set(canon(a.url), a);
    const rssOnly = [];
    for (const a of story.articles.filter(x=>x.origin==='rss')){
      const hit = byCanon.get(canon(a.url));
      if (hit) hit.origin='both';
      else rssOnly.push(a);
    }
    // Editor-added URLs from a previous package survive enrichment.
    const editorArts = story.articles.filter(x=>x.origin==='editor');

    // 3. fetch-url fallback for uncovered, unsuppressed RSS links.
    for (const a of rssOnly){
      if (isSup(a.url)) { a.body=''; a.bodyFrom=''; continue; }
      setStatus(story,'Fetching: '+a.source+'…');
      const r = await fetchUrlBody(a.url);
      a.body = r.body||''; a.bodyFrom = a.body ? 'fetch' : '';
      if (!a.body) fetchFails++;
    }

    let all = [...erArts, ...rssOnly, ...editorArts];

    // 4. Syndication pass (layer 3): near-identical text under different URLs.
    //    Keep the longest body (tie: earliest date); auto-x the copies —
    //    visibly, reversibly, never off-screen.
    const sh = all.map(a=>({ t:titleTokens(a.title), b:shingles(a.body) }));
    for (let i=0;i<all.length;i++){
      for (let j=i+1;j<all.length;j++){
        if (all[i].dupOf||all[j].dupOf) continue;
        const tSim = jaccard(sh[i].t, sh[j].t);
        // Body-similarity dedup only when both bodies are substantial —
        // short identical boilerplate (cookie walls, subscribe stubs) must
        // not collapse distinct articles into "syndicated" false positives.
        const bothFat = all[i].body.length>600 && all[j].body.length>600;
        const bSim = bothFat ? jaccard(sh[i].b, sh[j].b) : 0;
        if (bSim>0.6 || (tSim>0.8 && (bSim>0.3 || !all[i].body || !all[j].body))){
          let keep=i, drop=j;
          if (all[j].body.length>all[i].body.length) { keep=j; drop=i; }
          else if (all[j].body.length===all[i].body.length &&
                   all[j].date && all[i].date && all[j].date<all[i].date) { keep=j; drop=i; }
          all[drop].dupOf = all[keep].source;
          all[drop].included = false;
        }
      }
    }
    story.articles = all;
    story.enrichedAt = new Date().toISOString();
    // Never blindly clear a real mid-run error — summarize instead, always,
    // so "it finished fast and said nothing" can't happen again.
    const nBody = erArts.filter(a=>a.bodyFrom==='er').length;
    const nFetched = rssOnly.filter(a=>a.bodyFrom==='fetch').length;
    if (hadError){
      // Build from errMsg — the captured cause — never from the live
      // story.status, which the fetch-url loop's progress updates have
      // almost certainly overwritten by this point. And set story.err
      // directly rather than via setStatus: every plain progress update
      // in between ("Fetching: NBC News…") called setStatus with no err
      // argument, which resets story.err to false on every call — so by
      // the time we get here the red/error styling has been silently
      // wiped even though the failure is real. Re-assert it explicitly.
      story.status = (errMsg||'Enrichment had an error') +
        ` — result: ${nBody} ER bodies, ${nFetched} fetched, ${fetchFails} fetch failures.`;
      story.err = true;
    } else {
      setStatus(story, `Enriched: ${nBody} ER bodies, ${nFetched} fetched` +
        (fetchFails ? `, ${fetchFails} fetch failures (bot-blocked/paywalled likely)` : '') + '.');
    }
  } catch(e){ hadError=true; setStatus(story,'Enrichment failed: '+e.message,true); }
  story.busy=false; saveLineup(); render();
}

async function addUrl(story, url){
  if (!url.trim()) return;
  story.busy=true; setStatus(story,'Fetching '+url+'…');
  try {
    const r = await fetchUrlBody(url.trim());
    story.articles.push({ url:url.trim(), title:r.title||url.trim(), source:'Editor import',
      date:new Date().toISOString(), body:r.body||'', bodyFrom:r.body?'fetch':'',
      included:true, dupOf:null, origin:'editor' });
    setStatus(story, r.body?'':'Added — no body retrievable, headline only');
  } catch(e){ setStatus(story,'Add failed: '+e.message,true); }
  story.busy=false; saveLineup(); render();
}

/* ─── Summon Context: curated Wikipedia sections + 29-day ER arc ─── */
const WIKI_API = 'https://en.wikipedia.org/w/api.php';

// Crude wikitext → prose. Not a parser — enough for background material.
function stripWikitext(w){
  let t = w;
  for (let i=0;i<6;i++) t = t.replace(/\{\{[^{}]*\}\}/g,'');       // templates, innermost-out
  t = t.replace(/<ref[^>]*\/>/gi,'').replace(/<ref[^>]*>[\s\S]*?<\/ref>/gi,'');
  t = t.replace(/<!--[\s\S]*?-->/g,'');
  t = t.replace(/\[\[(?:File|Image|Category):[^\]]*\]\]/gi,'');
  t = t.replace(/\[\[[^\]|]*\|([^\]]*)\]\]/g,'$1').replace(/\[\[([^\]]*)\]\]/g,'$1');
  t = t.replace(/\[https?:\/\/[^\s\]]+\s*([^\]]*)\]/g,'$1');
  t = t.replace(/'''([^']*)'''/g,'$1').replace(/''([^']*)''/g,'$1');
  t = t.replace(/^==+[^=]+==+\s*$/gm,'').replace(/<[^>]+>/g,' ');
  return t.replace(/&nbsp;/g,' ').replace(/\n{3,}/g,'\n\n').replace(/[ \t]+/g,' ').trim();
}
async function wikiJson(params){
  const r = await fetch(WIKI_API+'?'+new URLSearchParams({format:'json', origin:'*', ...params}));
  if (!r.ok) throw new Error('Wikipedia '+r.status);
  return r.json();
}
// One curated ID -> raw section text. "Page#Anchor" or bare "Page".
async function fetchWikiId(id){
  const [page, anchor] = id.split('#');
  const url = 'https://en.wikipedia.org/wiki/'+page+(anchor?'#'+anchor:'');
  if (anchor){
    const d = await wikiJson({action:'parse', page, prop:'sections'});
    if (d.error) throw new Error(d.error.info||'page not found');
    const sec = (d.parse.sections||[]).find(s=>s.anchor===anchor);
    if (sec){
      const w = await wikiJson({action:'parse', page, section:sec.index, prop:'wikitext'});
      return {id, url, title: page.replace(/_/g,' ')+' § '+sec.line,
              text: stripWikitext(w.parse.wikitext['*']).slice(0,6000), anchorFound:true};
    }
    // Anchor renamed or wrong — fall through to the lead, but say so.
  }
  const d = await wikiJson({action:'query', prop:'extracts', titles:page,
    exintro:'1', explaintext:'1', redirects:'1'});
  const pages = d.query?.pages||{}; const first = pages[Object.keys(pages)[0]];
  if (!first || first.missing !== undefined) throw new Error('page not found');
  return {id, url, title: (first.title||page.replace(/_/g,' '))+(anchor?' (anchor not found — page lead used)':''),
          text: (first.extract||'').slice(0,6000), anchorFound: !anchor};
}
async function ensureConceptUri(story, force){
  if (story.conceptUri && !force) return story.conceptUri;
  if (!story.conceptEntity) return null;
  const matches = await netlifyFetch({mode:'resolve-concept', q:story.conceptEntity});
  story.conceptUri = matches?.[0]?.uri || null;
  story.conceptMatch = matches?.[0]?.label?.eng || (matches?.[0]?.uri ? story.conceptEntity : null);
  story.conceptChecked = true;
  return story.conceptUri;
}
// Standalone resolve check — the "vibe check" step. No Enrich, no search,
// just: does this entity string actually match something, and what.
async function checkConcept(story){
  if (!story.conceptEntity.trim()){ setStatus(story,'Enter an entity to check',true); return; }
  story.busy=true; story.conceptUri=null; setStatus(story,'Resolving "'+story.conceptEntity+'"…');
  try {
    await ensureConceptUri(story, true);
    setStatus(story, story.conceptUri ? '' : 'No Wikipedia match for "'+story.conceptEntity+'"', !story.conceptUri);
  } catch(e){ setStatus(story,'Resolve failed: '+e.message,true); }
  story.busy=false; saveLineup(); render();
}
const WIKI_CATEGORY_CAP = 15;  // most-recently-modified members expanded per category

// "Category:X" -> its N most-recently-modified member page titles. Lets a
// whole category ("Category:Donald_Trump_controversies") be dropped in as
// one line instead of hand-listing every page in it. Capped and sorted by
// recency rather than "all of them" — categories can run to hundreds of
// pages, and what's freshest is almost always what's relevant to today's
// story, not the exhaustive historical list.
async function expandWikiCategory(catId){
  const name = catId.replace(/^category:/i,'').trim().replace(/ /g,'_');
  const title = 'Category:'+name;
  const params = new URLSearchParams({
    format:'json', origin:'*', action:'query', list:'categorymembers',
    cmtitle:title, cmlimit:String(WIKI_CATEGORY_CAP),
    cmsort:'timestamp', cmdir:'desc',   // most-recently-modified first
    cmtype:'page',                      // pages only — skip subcategories/files
  });
  const r = await fetch('https://en.wikipedia.org/w/api.php?'+params);
  if (!r.ok) throw new Error('Category lookup failed: '+r.status);
  const d = await r.json();
  // Defensive filter: cmtype=page above SHOULD already exclude subcategories,
  // but real API responses have been observed returning ns:14 (Category)
  // entries anyway (confirmed against the live API while building this).
  // Trust the response's own namespace field, not just the request param.
  const members = (d.query?.categorymembers || []).filter(m=>m.ns===0);
  if (!members.length) throw new Error('no article pages found in "'+title+'"');
  return members.map(m=>m.title);
}

async function summonContext(story){
  story.busy=true;
  const ctx = [];
  try {
    // 1. Curated Wikipedia sections — editor-selected precedent threads.
    //    A line can be a page, a page#section, OR a whole category, which
    //    gets expanded into its most-recent member pages before fetching.
    const rawIds = (story.wikiIds||'').split(/[\n,]+/).map(s=>s.trim()).filter(Boolean);
    const ids = [];
    for (const id of rawIds){
      if (/^category:/i.test(id)){
        setStatus(story,'Expanding category: '+id+'…');
        try {
          const members = await expandWikiCategory(id);
          ids.push(...members);
        } catch(e){
          ctx.push({kind:'wiki', id, url:'https://en.wikipedia.org/wiki/'+id,
            title:id, note:'[category unavailable: '+e.message+']', included:false});
        }
      } else {
        ids.push(id);
      }
    }
    const raws = [];
    for (const id of ids){
      setStatus(story,'Wikipedia: '+id+'…');
      try { raws.push(await fetchWikiId(id)); }
      catch(e){ ctx.push({kind:'wiki', id, url:'https://en.wikipedia.org/wiki/'+id.split('#')[0],
        title:id, note:'[unavailable: '+e.message+']', included:false}); }
    }
    // 2. Haiku condenses fetched sections into per-ID notes, each keeping
    //    its URL so generation can cite each thread separately. Batched —
    //    a category expansion can hand this up to WIKI_CATEGORY_CAP (15)
    //    sources at once, and 15 notes at ~120 words each needs well over
    //    2000 tokens of output, which used to truncate against a 1200
    //    ceiling sized for the original few-hand-picked-IDs case. Same
    //    fix already proven in ledger.py: cap items per call so no single
    //    response is ever asked to hold more than it safely can.
    const CONDENSE_BATCH = 6;
    if (raws.length){
      for (let start = 0; start < raws.length; start += CONDENSE_BATCH){
        const batch = raws.slice(start, start + CONDENSE_BATCH);
        setStatus(story, `Condensing background… (${start+1}-${start+batch.length} of ${raws.length})`);
        const prompt = `You are preparing BACKGROUND notes for an NTK News story: "${story.title}".\n`+
          `For each Wikipedia source below, write one factual note of at most 120 words: the prior events and their dates, plainly told, selected for what makes TODAY's incremental news legible. No commentary, no analysis of today's news itself.\n\n`+
          batch.map((r,i)=>`SOURCE ${i} — ${r.title}:\n${r.text}`).join('\n\n')+
          `\n\nReturn ONLY a JSON array, no fences: [{"i":0,"note":"..."}]`;
        try {
          const notes = parseJSON(await ai(prompt, 2000));
          batch.forEach((r,i)=>{
            const n = notes.find(x=>x.i===i);
            ctx.push({kind:'wiki', id:r.id, url:r.url, title:r.title,
              note:(n&&n.note)||r.text.slice(0,600), included:true});
          });
        } catch(e){
          // One bad batch shouldn't cost the others — fall back to the raw
          // (uncondensed) extract for just this batch rather than losing
          // everything summoned so far.
          batch.forEach(r=>ctx.push({kind:'wiki', id:r.id, url:r.url, title:r.title,
            note:r.text.slice(0,600), included:true}));
        }
      }
    }
    // 3. ER arc: concept-scoped, 29-day, relevance-sorted — the story so far.
    const uri = await ensureConceptUri(story).catch(()=>null);
    if (uri){
      setStatus(story,'EventRegistry: 29-day arc…');
      try {
        const arc = await netlifyFetch({mode:'context-scan', conceptUri:uri,
          articlesCount:'5', windowDays:'29', bodyLen:'1200'});
        for (const a of arc){
          if (!a.url || isSup(a.url)) continue;
          // Skip arc items already in the source package — they're news, not background.
          if (story.articles.some(x=>canon(x.url)===canon(a.url))) continue;
          ctx.push({kind:'arc', url:a.url, title:a.title||'Untitled',
            source:a.source?.title||'Unknown', date:a.date||'',
            note:(a.body||'').slice(0,1200), included:true});
        }
      } catch(e){ setStatus(story,'Arc unavailable: '+e.message,true); }
    }
    story.context = ctx; story.contextAt = new Date().toISOString();
    setStatus(story, ctx.length ? '' : 'No context retrieved — check wiki IDs / concept');
  } catch(e){ setStatus(story,'Summon failed: '+e.message,true); }
  story.busy=false; saveLineup(); render();
}
function contextBlock(story){
  const items = (story.context||[]).filter(c=>c.included);
  if (!items.length) return '';
  const wiki = items.filter(c=>c.kind==='wiki');
  const arc = items.filter(c=>c.kind==='arc');
  return `\n\nBACKGROUND — NOT today's news. Today's source articles above remain the ground truth; this block exists only for the History Scoping Rule: name the precedent, date it, make the rhyme land in one sentence, cite the free reference link. Seasoning, not the main course — background should never displace today's development as the subject of a movement.\n`+
    (wiki.length ? `\nPRECEDENT THREADS (editor-curated, cite as ([Wikipedia](URL))):\n`+
      wiki.map(c=>`- ${c.title} — URL: ${c.url}\n  ${c.note}`).join('\n') : '')+
    (arc.length ? `\nTHE STORY SO FAR (last 29 days of coverage, for continuity — not fresh news):\n`+
      arc.map(c=>`- [${c.source}, ${c.date}] ${c.title} — URL: ${c.url}\n  ${c.note}`).join('\n') : '');
}

function activeArts(story){
  return story.articles.filter(a=>a.included && !a.dupOf && !isSup(a.url));
}

function spentStats(pkg, includeList){
  const list = includeList || SECS;
  const spent = [];
  for (const sec of list){
    const t = pkg[sec]; if (!t) continue;
    let m; const statRe = /\[STAT:\s*([^|\]]+?)\s*\|/g;
    while ((m = statRe.exec(t))) spent.push(`"${m[1].trim()}" (${sec} STAT)`);
  }
  if (list.includes('truths')){
    const hed = (pkg.truths||'').match(/\[HEADLINE:\s*([\s\S]*?)\]/);
    if (hed){ const nums = hed[1].match(/\$?[\d,.]+%?/g)||[];
      nums.forEach(n=>{ if(/\d/.test(n)) spent.push(`"${n}" (Truths headline)`); }); }
  }
  return spent;
}
function sectionsBlock(pkg, includeList, label){
  const written = includeList.filter(s=>pkg[s]);
  if (!written.length) return '';
  const spent = spentStats(pkg, includeList);
  return `\n\n${label||'ALREADY WRITTEN'} — the reader has read these sections in full. This is the actual text, not a summary:\n\n`+
    written.map(s=>`═══ ${s.toUpperCase()} (already published) ═══\n${pkg[s]}`).join('\n\n')+
    `\n\nCROSS-SECTION DISCIPLINE:\n`+
    `- Never re-establish, re-quote, or re-summarize facts, figures, or quotes that appear above. The reader holds them.\n`+
    (spent.length ? `- SPENT NUMBERS — already deployed as a STAT or headline figure: ${spent.join('; ')}. A spent number may be referred to obliquely ("the toll," "that figure") but never re-stated digit-for-digit and never used in another [STAT:] marker. If your sharpest number is spent, your section's sharpest number is a different one — or none.\n` : '')+
    `- Build forward, not sideways: a thread opened in an earlier section can be advanced, escalated, or paid off — never reopened as if new. Referring back in shorthand is encouraged; the sections should read as one mind thinking, not four writers briefed separately.`;
}
function priorSectionsBlock(pkg){ return sectionsBlock(pkg, SECS); }
/* ─── deterministic post-generation cleanup ───
   The GLOBAL prompt now instructs the model to leave a space after a
   closing bold marker and never self-label a section. That reduces how
   often it happens; it can't guarantee zero, and it hasn't (confirmed:
   "ForIf", "WhoKevin", "The Lies Section" all recurred after the prompt
   fix shipped). So this runs on every generated section regardless of
   compliance — a deterministic safety net layered on TOP of the prompt
   instruction, not a replacement for it. Applied once, at the moment text
   is received, so the corrected version is what's stored, rendered,
   copied, exported, AND fed to later sections as "already written"
   context — nothing downstream ever sees the raw artifact. */
const NO_SPACE_AFTER = new Set('.,;:\'\u2019")]}-\u2013\u2014!?'.split(''));
function fixBoldSpacing(text){
  let out = '', inBold = false, i = 0;
  while (i < text.length){
    if (text[i]==='*' && text[i+1]==='*'){
      out += '**'; inBold = !inBold; i += 2;
      // Just closed a bold span — if what follows isn't whitespace and
      // isn't punctuation that legitimately hugs the close (a period, an
      // apostrophe for a possessive, a closing paren), insert the space
      // the model dropped. Catches both "**For**If" (letter runs on) and
      // "**Lies****Trump's**" (a second bold span runs on with no gap).
      if (!inBold && i < text.length && text[i]!==' ' && text[i]!=='\n' && !NO_SPACE_AFTER.has(text[i])){
        out += ' ';
      }
      continue;
    }
    out += text[i]; i++;
  }
  return out;
}
function stripSectionSelfLabel(sec, text){
  // A leading bold span that's just the section's own name echoed back
  // ("**Lies**", "**The Lies Section**") is always redundant — the h3
  // header already says LIES — and never intentional content. Matched
  // against THIS section's name specifically, not all four, so a
  // legitimate subhead that happens to share a word stays untouched.
  const re = new RegExp('^\\s*\\*\\*\\s*(the\\s+)?'+sec.toLowerCase()+'(\\s+section)?\\s*\\*\\*\\s*\\n*','i');
  return text.replace(re, '');
}
function cleanSectionText(sec, text){
  return fixBoldSpacing(stripSectionSelfLabel(sec, text||''));
}

async function generateStory(story){
  const arts = activeArts(story);
  if (!arts.length){ setStatus(story,'No active sources — enrich or add URLs first',true); return; }
  story.busy=true;
  const artsText = arts.map(a=>
    `TITLE: ${a.title}\nSOURCE: ${a.source}\nURL: ${a.url}\nDATE: ${a.date}\n\n${(a.body||'[body unavailable — headline only]').slice(0,SETTINGS.bodyLen)}`
  ).join('\n\n---\n\n');
  const angleBlock = story.angle ? `\n\nEDITOR'S ANGLE (the editorial frame for this story — honor it): ${story.angle}` : '';
  // Chained generation: sections run in reading order and each call receives
  // the sections already written, verbatim, plus the spent-numbers ledger.
  // This is what makes the prompts' long-standing "the reader has already
  // read Truths" instruction actually checkable instead of aspirational.
  // A regenerate starts a fresh package — chaining stale sections into new
  // ones would freeze yesterday's text into today's context.
  const pkg = {};
  for (const sec of SECS){
    setStatus(story, story.title.slice(0,40)+' · '+sec+'…');
    try { pkg[sec] = cleanSectionText(sec, await ai(makePrompt(sec, artsText+angleBlock+contextBlock(story)+priorSectionsBlock(pkg)+notesBlock(), []), 2500)); }
    catch(e){ pkg[sec] = '[Generation failed: '+e.message+']'; }
  }
  story.packages = pkg; story.generatedAt = new Date().toISOString(); story.outOpen = true;
  NOTES.genCounter = (NOTES.genCounter||0) + 1; saveNotes();
  story.busy=false; setStatus(story,''); saveLineup(); render();
}
async function reviseSection(story, sectionName, note){
  const arts = activeArts(story);
  if (!arts.length){ setStatus(story,'No active sources — enrich first',true); return; }
  story.busy=true; setStatus(story,'Revising '+sectionName+'…'); render();
  const artsText = arts.map(a=>
    `TITLE: ${a.title}\nSOURCE: ${a.source}\nURL: ${a.url}\nDATE: ${a.date}\n\n${(a.body||'[body unavailable — headline only]').slice(0,SETTINGS.bodyLen)}`
  ).join('\n\n---\n\n');
  const angleBlock = story.angle ? `\n\nEDITOR'S ANGLE (the editorial frame for this story — honor it): ${story.angle}` : '';
  // Siblings, not "prior": revise keeps the OTHER three sections fixed
  // regardless of reading order, so a mid-package rewrite stays consistent
  // on both sides of it, not just with what came before.
  const siblings = sectionsBlock(story.packages, SECS.filter(s=>s!==sectionName),
    'ALREADY PUBLISHED — SIBLING SECTIONS (unaffected by this revision)');
  const revisionNote = (note||'').trim()
    ? `\n\nEDITOR'S REVISION NOTE — the specific reason this section is being rewritten; apply it directly and concretely, not just in spirit: ${note.trim()}`
    : '\n\nThis section is being regenerated at the editor\'s request with no specific note — reconsider it freshly against the source material and the standing editorial notes above.';
  try {
    story.packages[sectionName] = cleanSectionText(sectionName, await ai(makePrompt(sectionName,
      artsText+angleBlock+contextBlock(story)+siblings+revisionNote+notesBlock(), []), 2500));
    setStatus(story,'Revised '+sectionName+'.');
  } catch(e){ setStatus(story,'Revise failed: '+e.message,true); }
  story.busy=false; saveLineup(); render();
}
async function generateAll(){
  for (const s of LINEUP) if (!s.packages) await generateStory(s);

// Clean structured JSON for the automated build — deliberately NOT the

function buildStoryPayload(){

    const {headline, lede, body} = extractTruthsTags(s.packages.truths||'');
    return {

      // subject is what Expertise keys to; entity is texture beneath it and
      // carries no status. Both were captured in Pulse and dropped here until

      subject: normalizeSubject(s.subject || ''),
      entity: (s.conceptMatch || s.conceptEntity || '').trim(),

      poss: toSiteHtml(s.packages.possibilities||''),
      lies: toSiteHtml(s.packages.lies||''),

      overlayOpacity: s.overlayOpacity || 45,
      featuredImageCredit: s.featuredImageCredit || null,

function bsEditsOut(s){

function storyDataExport(stories, extra){

// ─── Publish preflight (T-0022) ───
// What a dialog at the publish button can honestly check is presence, not
// taste: it counts and it resolves, and it cannot tell you whether the lede
// lands. The deeper pass is the prepublish skill (T-0008), which is run
// deliberately rather than in the half-second before a click.
//
// DROP and WARN are different on purpose. A story with no headline is one the
// model refused to write, and build_digest.py now builds nothing for it, so
// "publish it anyway" is not a real choice: offering a path the pipeline
// silently ignores is worse than not offering it. Everything else is the
// editor's call and the dialog only has to make it visible.
const PUBLISH_MIN = 4, PUBLISH_MAX = 10;   // docs/decisions.md, corrected 2026-09-18
const INSUFFICIENT = 'INSUFFICIENT SOURCE MATERIAL';

// T-0102: an object ticked under a Lineup story (s.bsPicks) reaches the reader only once it is added to a
// category. Publish never adds it (adding unapproves an approved category), so it says which stories have
// some left behind.
function keptPreflight(lineup, cats){
  return (lineup||[]).map(s=>{
    const c=cats[s.backstoryRow], on=new Set(((c&&c.objects)||[]).map(x=>x.object_id));
    // T-0110: a pick already on the story's own drafted page reaches the reader with it
    const d=typeof bsrDraftFor==='function'?bsrDraftFor(s):null;
    if (d && d.fresh && d.composed) (d.composed.case||[]).forEach(x=>on.add(x.object_id));
    const n=(s.bsPicks||[]).filter(id=>!on.has(id)).length;
    if (!n) return null;
    return ((s.title||'').trim().slice(0,52)||('story '+(s.key||'?')))+' \u2014 '+n+' kept object'+(n===1?' was':'s were')+
      ' never added to a category, so the reader will not get '+(n===1?'it':'them')+' (Backstory tab: add, or start a new category)';
  }).filter(Boolean);
}
function publishPreflight(stories){
  const drop = [], warn = [];
  stories.forEach(s => {
    const label = (s.headline || '').trim().slice(0, 52) || ('story ' + (s.key || '?'));
    if (!(s.headline || '').trim()){
      drop.push((s.key || '?') + ' (' + (s.category || 'no category') +
                ') — no headline, so the model returned no usable story');
      return;
    }
    if (['truth','prob','poss','lies'].every(f => (s[f] || '').indexOf(INSUFFICIENT) >= 0))
      warn.push(label + ' — every section is [' + INSUFFICIENT + ']');
    if (!s.featuredImage) warn.push(label + ' — no image');
  });
  const shipping = stories.length - drop.length;
  if (shipping < PUBLISH_MIN || shipping > PUBLISH_MAX)
    warn.push(shipping + (shipping === 1 ? ' story' : ' stories') +
              ' would publish; the digest is ' + PUBLISH_MIN +
              '\u2013' + PUBLISH_MAX + ' (docs/decisions.md)');
  return { drop, warn, shipping };

// ─── Today-overview guard (T-0072) ───
// The digest's Today tab publishes whatever overview text Pulse is holding.
// Nothing used to check that it was finished, or that it was from today, so a
// publish while Generate Today was still running (or with last week's essay)
// shipped a stale overview with fresh stories. BLOCK is a hard stop: publishing
// would silently ship the wrong thing. WARN is the editor's call.
function todayPreflight(now, keys){
  const block = [], warn = [];
  const t = (TODAY_OV.text || '').trim();
  if (TODAY_OV.busy)
    block.push('Generate Today is still running. Wait until it finishes, then publish.');
  else if (t.indexOf('[Generation failed') === 0)
    block.push('Generate Today failed: ' + t + '\nRun it again before publishing.');
  else if (!t)
    warn.push('No Today overview has been generated; the Today tab will keep the previous one.');
  else {
    const at = TODAY_OV.generatedAt ? new Date(TODAY_OV.generatedAt) : null;
    const today = (now || new Date()).toDateString();
    if (!at) warn.push('The Today overview has no generation time, so it may not be from today.');
    else if (at.toDateString() !== today)
      warn.push('The Today overview was generated on ' + at.toDateString() + ', not today.');
    // T-0096: an overview written before a story left the lineup still talks about it. The reader sees
    // the paragraph with no story behind it (the 2026-10-15 edition's "Ukraine warning gap").
    if (keys){
      const have = new Set(keys), gone = [];
      t.replace(/\[STORY:\s*([^|\]]+?)\s*\|\s*([^\]]+?)\s*\]/g, (m, k, label) => { if (!have.has(k.trim())) gone.push('"' + label.trim() + '"'); return m; });
      if (gone.length)
        warn.push('The Today overview mentions ' + (gone.length === 1 ? 'a story' : gone.length + ' stories') + ' no longer in the lineup (' + gone.join(', ') + '). Run Generate Today again.');
    }
  }
  return { block, warn };
}

// Publish: commits the current lineup's story data straight to the repo
// via GitHub's Contents API — confirmed to support direct browser CORS
// requests before this was built, not assumed. That commit itself is the
// trigger for pulse-publish.yml (a path-scoped push trigger), so this one
// call is the entire "zero clicks after this" chain: no separate
// workflow-start call needed.

function pulseMayPublish(loc){
  if (loc.hostname === 'ntknews.org' || loc.hostname === 'www.ntknews.org') return true;

// "Draft Backstory" commits the Lineup to lineup-draft.json on the branch this Pulse is served from

const GH_DRAFT_LINEUP = 'ntk-pulse/data/lineup-draft.json';
const GH_DRAFT_OUT = 'ntk-pulse/data/backstory-draft.json';
function pulseBranch(loc){
  if (pulseMayPublish(loc)) return 'main';
  if (loc.hostname === 'maxzimbert.github.io' && loc.pathname.indexOf('/ntknews-staging/') === 0) return 'staging';

// The fields that decide a story's Backstory, fingerprinted here and only compared in Python
// (editorial/backstory_draft.py), so there is one implementation.
// bs_text_hash leaves out the editor's Backstory edits (T-0110): when only edits differ, applying them reruns
// that story's page alone; when the text differs, the whole draft has to run again.
async function sha256hex(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
// A rejection reaches the hash through the stories it touches: rejecting a document also marks it "off" on
// every story whose drafted page uses it (bsrReject), so only those stories wait on their edits.
async function bsHash(s, cats, withEdits){
  const cat = s.backstory_row ? (cats.find(c => c.id === s.backstory_row) || null) : null;
  const base = [s.key, s.headline||'', s.lede||'', s.truth||'', s.prob||'', s.poss||'', s.lies||'', s.backstory_row||'', cat];
  return sha256hex(JSON.stringify(withEdits ? base.concat([s.bs_edits||null]) : base));
}
async function bsWithHashes(stories){
  const cats = catsForPublish();
  for (const s of stories){ s.bs_hash = await bsHash(s, cats, true); s.bs_text_hash = await bsHash(s, cats, false); }
  return stories;
}

function bsrDraftStatusText(){

// The first draft of a Lineup, on GitHub: the classifier, new categories and origins, the same code publish runs.
// Each story's own page is then composed here, in Pulse (bsxRun); edits never go through GitHub.
async function draftBackstory(){
  const br = pulseBranch(location);
  if (!br){ alert('This copy of Pulse cannot draft (not the live Pulse or staging Pulse).'); return; }
  if (!SETTINGS.ghToken){ alert('Add a GitHub token in ⚙ first — scoped to contents:write on this repo only.'); return; }
  const stories = buildStoryPayload().filter(s => (s.headline || '').trim());
  if (!stories.length){ alert('Nothing generated yet — nothing to draft.'); return; }
  if (!confirm(`Draft the Backstory for ${stories.length} stor${stories.length===1?'y':'ies'}?\n\nRuns the publish-time Backstory steps on the ${br} branch's code, in a few minutes, then Pulse composes each story's page. Nothing readers see changes. It spends from the same Anthropic key as a publish; a publish that follows with nothing changed does not spend it again.`)) return;
  await bsWithHashes(stories);
  BSR_DRAFT_STATE = 'Sending the Lineup…'; render();
  try {
    // requested_at makes every request a change to the file: an identical request (the same nudge sent again)
    // was saved as no change, so the workflow, which wakes on a change to this file, never ran (2026-10-30).
    const content = storyDataExport(stories, {requested_at: new Date().toISOString()});
    const b64 = btoa(unescape(encodeURIComponent(content)));
    const apiUrl = `https://api.github.com/repos/${GH_REPO}/contents/${GH_DRAFT_LINEUP}`;
    const headers = { 'Authorization': 'Bearer '+SETTINGS.ghToken, 'Accept': 'application/vnd.github+json' };
    let sha = null;
    const g = await fetch(apiUrl + '?ref=' + br, {headers, cache:'no-store'});
    if (g.ok) sha = (await g.json()).sha; else if (g.status !== 404) throw new Error('GitHub GET failed: '+g.status);
    const p = await fetch(apiUrl, {method:'PUT', headers:{...headers,'Content-Type':'application/json'},
      body: JSON.stringify({message:'backstory draft request: '+stories.length+' stories from Pulse', content:b64, branch:br, ...(sha?{sha}:{})})});
    if (!p.ok){ const t = await p.text(); throw new Error('GitHub PUT failed: '+p.status+' '+t.slice(0,200)); }
    BSR_DRAFT_SENT = Date.now(); BSR_POLLING = true;
    BSR_DRAFT_BEFORE = (BSR_DRAFT && BSR_DRAFT.generated) || '';   // the run's answer is a draft newer than this one
    BSR_DRAFT_STATE = 'Drafting on ' + br + '… usually 2 to 5 minutes, then each page is composed here. This updates by itself.';
    render(); bsrPollDraft();
  } catch(e){ BSR_POLLING = false; BSR_DRAFT_STATE = 'Draft failed: ' + e.message; render(); }
}
function bsrPollDraft(){
  clearTimeout(BSR_DRAFT_TIMER);
  BSR_DRAFT_TIMER = setTimeout(async () => {
    const d = await loadBsrDraft();
    if (d && d.generated !== BSR_DRAFT_BEFORE && new Date(d.generated).getTime() > new Date(BSR_DRAFT_BEFORE || 0).getTime()){
      BSR_POLLING = false; BSR_DRAFT_STATE = ''; render();
      // GitHub made the first draft; each story's own page is composed here (T-0110)
      const keys = (d.stories || []).filter(x => x.pairing && !x.composed).map(x => x.story_id);
      if (keys.length) bsxRun(keys);
      return; }
    if (Date.now() - BSR_DRAFT_SENT > 15*60000){
      BSR_POLLING = false; BSR_DRAFT_STATE = 'No draft after 15 minutes. Check the "Backstory — Draft before publish" run on GitHub.'; render(); return; }
    bsrPollDraft();
  }, Date.now() - BSR_DRAFT_SENT < 180000 ? 4000 : 15000);   // a rerun lands in about 20 seconds; checking every 20 doubled the wait
}
// A draft ships only whole (editorial/backstory_draft.py apply), so one changed story means publish chooses

function draftPreflight(stories){
  if (!BSR_DRAFT) return [];
  const have = Object.fromEntries((BSR_DRAFT.stories||[]).map(d => [d.story_id, d.bs_hash]));

}

    const headers = { 'Authorization': 'Bearer '+SETTINGS.ghToken, 'Accept': 'application/vnd.github+json' };

/* ─── client-side entity/cosine matcher — ported from cluster.py, WITH
   both fixes from the indie-clustering test baked in from the start:
   entities read title+summary (not title alone), and omnipresent names
   are blocklisted. Powers manual-cluster Rescan — the only place Pulse
   runs join logic in the browser rather than the pipeline. ─── */
const MC_STOPWORDS = new Set(("a an and are as at be but by for from has have he her his i if in into is it its "+
  "of on or she that the their they this to was were will with you your we our not no new says said "+
  "after over more than about up out how what who when why").split(/\s+/));
function mcStem(w){
  const rules = [["ization","iz"],["izations","iz"],["ized","iz"],["izes","iz"],["ize","iz"],
    ["ational","ate"],["ations","ate"],["ation","ate"],["ies","y"],["ing",""],["ers","er"],
    ["ed",""],["es",""],["s",""]];
  for (const [suf,rep] of rules) if (w.endsWith(suf) && w.length-suf.length>=3) return w.slice(0,w.length-suf.length)+rep;
  return w;
}
function mcTokenize(text){
  return ((text||'').toLowerCase().match(/[a-z0-9']+/g)||[]).filter(w=>!MC_STOPWORDS.has(w)&&w.length>2).map(mcStem);
}
const MC_ENTITY_BLOCKLIST = new Set(("here theres there this that these those city council report reports "+
  "new news today yesterday tomorrow first second third last update updates live also "+
  "where when what why how who whom whose which world global national local state states "+
  "country countries government congress senate house president secretary official officials "+
  "top bottom fresh breaking latest exclusive analysis opinion editorial comment view "+
  "trump white house administration").split(/\s+/));
const MC_ENTITY_ALIASES = {fed:["federal","reserv"],feds:["federal","reserv"],scotus:["supreme","court"],
  gop:["republican"],dems:["democrat"],dem:["democrat"]};
function mcEntities(title, summary){
  const tokens = (title+' '+(summary||'')).match(/[A-Za-z][a-zA-Z0-9’']+/g)||[];
  const ents = new Set();
  for (const tok of tokens){
    if (!/[A-Z]/.test(tok[0])) continue;
    let low = tok.toLowerCase();
    for (const suf of ["’s","'s","’","'"]) if (low.endsWith(suf)){ low = low.slice(0,-suf.length); break; }
    low = low.replace(/\.$/,'');
    if (MC_ENTITY_ALIASES[low]){ MC_ENTITY_ALIASES[low].forEach(t=>ents.add(mcStem(t))); continue; }
    if (MC_STOPWORDS.has(low) || MC_ENTITY_BLOCKLIST.has(low) || low.length<3) continue;
    ents.add(mcStem(low));
  }
  return ents;
}
function mcBuildVectors(items){
  // items: [{id, title, summary}]. TF-IDF over the given pool, same shape as cluster.py.
  const tfMaps = {};
  items.forEach(it=>{ const tf={}; mcTokenize(it.title+' '+(it.summary||'')).forEach(t=>tf[t]=(tf[t]||0)+1); tfMaps[it.id]=tf; });
  const df = {};
  Object.values(tfMaps).forEach(tf=>Object.keys(tf).forEach(t=>df[t]=(df[t]||0)+1));
  const n = Math.max(items.length,1);
  const idf = {}; Object.keys(df).forEach(t=>idf[t]=Math.log(n/(1+df[t]))+1);
  const vecs = {};
  items.forEach(it=>{
    const v={}; Object.entries(tfMaps[it.id]).forEach(([t,c])=>{ v[t]=(1+Math.log(c))*(idf[t]||1); });
    let norm=Math.sqrt(Object.values(v).reduce((s,x)=>s+x*x,0))||1;
    Object.keys(v).forEach(t=>v[t]/=norm);
    vecs[it.id]=v;
  });
  return vecs;
}
function mcCosine(a,b){
  const [s,l] = Object.keys(a).length<Object.keys(b).length ? [a,b] : [b,a];
  let sum=0; for (const t in s) if (l[t]) sum += s[t]*l[t];
  return sum;
}
function mcCentroid(vecs){
  const agg={};
  vecs.forEach(v=>Object.entries(v).forEach(([t,x])=>{ agg[t]=(agg[t]||0)+x; }));
  let norm=Math.sqrt(Object.values(agg).reduce((s,x)=>s+x*x,0))||1;
  Object.keys(agg).forEach(t=>agg[t]/=norm);
  return agg;
}

/* ─── Manual clusters: singletons (or any clusters) merged by hand in the
   stream, with rescan/add/search to keep building the set. Persist across
   pipeline runs — unlike organic clusters, which are fully regenerated by
   every cluster.py run and would otherwise wipe a manual merge out. ─── */
let MANUAL = load(LS.manual, []);
// Manual clusters live only in this browser, so nothing else ever cleans them
// up. One that goes MANUAL_TTL_DAYS without being used is dropped on load.
// "Used" = changed (items, rescan, search, merge) or expanded or certified;
// saveManual() stamps lastUsedAt on whatever changed, so call sites need no
// touch. Certify snapshots into the lineup, so expiry never hurts a lineup story.
const MANUAL_TTL_DAYS = 5;
function manualExpired(mc, now){
  const t = Date.parse(mc.lastUsedAt || mc.createdAt || '');
  return Number.isFinite(t) && now - t > MANUAL_TTL_DAYS*86400000;
}
const MANUAL_SIG = new Map();   // key -> JSON at last save, to spot what changed
function manualSig(mc){ return JSON.stringify({...mc, lastUsedAt:0}); }
function touchManual(key){
  const mc = MANUAL.find(m=>m.key===key);
  if (mc){ mc.lastUsedAt = new Date().toISOString(); localStorage.setItem(LS.manual, JSON.stringify(MANUAL)); }
}
// Clusters saved before this existed have no lastUsedAt: start their clock now
// rather than deleting the editor's existing work on first load.
MANUAL.forEach(mc=>{ if (!mc.lastUsedAt) mc.lastUsedAt = new Date().toISOString(); });
MANUAL = MANUAL.filter(mc=>!manualExpired(mc, Date.now()));
MANUAL.forEach(mc=>MANUAL_SIG.set(mc.key, manualSig(mc)));
localStorage.setItem(LS.manual, JSON.stringify(MANUAL));   // persist the prune and backfill now, not at the next edit
let SELECTED = new Set();  // cluster keys currently checked for merging
// Which organic cluster cards are expanded. Session-only (not persisted),
// but crucially it's the ONLY thing that decides openness — previously
// openness was partly inferred from EXTRACT_SEL's size, which resets to 0
// the instant an extraction succeeds, collapsing the card you were just
// looking at right when it should stay put so you can see the result.
let OPEN_CLUSTERS = new Set();
// Items extracted out of a specific organic cluster: sourceClusterKey ->
// Map(itemId -> {targetKey, targetTitle}). Deliberately NOT the same
// mechanism as global suppression (SUP) — suppression is keyed by URL and
// applies everywhere an item appears, which would hide an extracted item
// in its NEW cluster just as much as its old one. This is scoped to one
// specific source cluster, so the item reads inactive where it came from
// and completely normal where it landed.
let EXTRACTED_ELSEWHERE = new Map();
// Organic cluster keys fully consumed by a merge (every item moved out) —
// hidden from the stream entirely rather than shown as an empty husk.
let MERGED_AWAY = new Set();
function isExtracted(clusterKey, itemId){ return EXTRACTED_ELSEWHERE.get(clusterKey)?.has(itemId) || false; }
function unextract(clusterKey, itemId){ EXTRACTED_ELSEWHERE.get(clusterKey)?.delete(itemId); render(); }

    const sig = manualSig(mc);
    if (MANUAL_SIG.get(mc.key) !== sig || !mc.lastUsedAt){ mc.lastUsedAt = now; MANUAL_SIG.set(mc.key, sig); }
  });

}
function manualScore(mc){
  const pubs = new Set(mc.items.map(it=>it.publisher));
  const latest = mc.items.reduce((mx,it)=> (it.published||'')>mx?it.published:mx, '');
  const ageH = latest ? Math.max((Date.now()-new Date(latest))/3600000, 0) : 999;
  return pubs.size*0.5 - ageH;
}
function toggleSelect(key){ if (SELECTED.has(key)) SELECTED.delete(key); else SELECTED.add(key); render(); }
function mergeSelected(){
  if (SELECTED.size < 2){ alert('Select at least 2 clusters to merge.'); return; }
  const all = [...(STREAM?.clusters||[]), ...MANUAL];
  const picked = all.filter(c=>SELECTED.has(c.key));
  const items = []; picked.forEach(c=>items.push(...c.items));
  const mc = { key:'manual-'+Date.now(), title: picked[0].title+(picked.length>1?' (+'+(picked.length-1)+' merged)':''),
    items, manual:true, createdAt:new Date().toISOString(), beat_hint:'other', triage:null,
    rescanResults:null, rescanAt:null, search:{open:false,kw:'',src:'',results:[],busy:false,note:''} };
  MANUAL.push(mc);
  // A merged source is fully consumed — every one of its items moved into
  // the new cluster, so there's nothing left to show. Organic sources get
  // hidden from the stream (their data is untouched, just not rendered);
  // manual sources get deleted outright, since keeping an empty duplicate
  // manual card around would just be clutter.
  picked.forEach(c=>{
    if (STREAM?.clusters?.some(oc=>oc.key===c.key)) MERGED_AWAY.add(c.key);
    else MANUAL = MANUAL.filter(m=>m.key!==c.key);

// EXTRACT_SEL: clusterKey -> Set(itemId). Independent of SELECTED (whole-
// cluster merge picks) — this tracks individual article checkboxes inside
// one expanded cluster, for pulling a subset out into its own cluster.
// Non-destructive, same philosophy as certify's snapshot: the source
// cluster is untouched, the extracted items just also exist elsewhere now.
let EXTRACT_SEL = new Map();
function toggleExtractItem(clusterKey, itemId){
  if (!EXTRACT_SEL.has(clusterKey)) EXTRACT_SEL.set(clusterKey, new Set());
  const s = EXTRACT_SEL.get(clusterKey);
  if (s.has(itemId)) s.delete(itemId); else s.add(itemId);

}
function extractSelected(sourceCluster){
  const ids = EXTRACT_SEL.get(sourceCluster.key);
  if (!ids || ids.size < 1){ alert('Check at least one article to extract.'); return; }
  const items = sourceCluster.items.filter(it=>ids.has(it.id));
  const mc = { key:'manual-'+Date.now(),
    title: items[0].title+(items.length>1?' (+'+(items.length-1)+' extracted)':' (extracted)'),
    items, manual:true, createdAt:new Date().toISOString(), beat_hint:'other', triage:null,
    rescanResults:null, rescanAt:null, search:{open:false,kw:'',src:'',results:[],busy:false,note:''} };
  MANUAL.push(mc);
  EXTRACT_SEL.delete(sourceCluster.key);
  OPEN_CLUSTERS.add(sourceCluster.key);   // stay open — you were just looking at it
  if (!EXTRACTED_ELSEWHERE.has(sourceCluster.key)) EXTRACTED_ELSEWHERE.set(sourceCluster.key, new Map());
  const tracker = EXTRACTED_ELSEWHERE.get(sourceCluster.key);
  ids.forEach(id=>tracker.set(id, {targetKey: mc.key, targetTitle: mc.title}));

  // Scroll the newly created cluster into view and flash it — otherwise it
  // can land anywhere in the score-sorted list, far from where you're looking,
  // and a silent success reads exactly like a silent failure.
  requestAnimationFrame(()=>{
    const card = document.querySelector(`.cluster[data-mc-key="${mc.key}"]`);
    if (card){ card.scrollIntoView({behavior:'smooth', block:'center'});
      card.style.outline='2px solid #5a2d82'; setTimeout(()=>{ card.style.outline=''; }, 2000); }
  });
}

function deleteManual(key){
  if (!confirm('Delete this manual cluster? (Certify it into the lineup first if you want to keep it.)')) return;
  MANUAL = MANUAL.filter(m=>m.key!==key); saveManual(); render();
}
function rescanManual(mc){
  if (!STREAM || !STREAM.clusters){ alert('No stream data loaded — nothing to rescan against.'); return; }
  const poolItems = [];
  STREAM.clusters.forEach(c=>c.items.forEach(it=>poolItems.push({id:it.id, title:it.title, summary:'', _ref:{...it, _fromCluster:c.title}})));
  const mcShape = mc.items.map(it=>({id:it.id, title:it.title, summary:''}));
  const existingIds = new Set(mc.items.map(it=>it.id));
  const vecs = mcBuildVectors([...poolItems.map(p=>({id:p.id,title:p.title,summary:p.summary})), ...mcShape]);
  const centroid = mcCentroid(mcShape.map(it=>vecs[it.id]));
  const mcEnts = new Set(); mc.items.forEach(it=>mcEntities(it.title,'').forEach(e=>mcEnts.add(e)));
  const candidates = [];
  poolItems.forEach(pi=>{
    if (existingIds.has(pi.id)) return;
    const sim = mcCosine(centroid, vecs[pi.id]);
    const ents = mcEntities(pi.title,'');
    const shared = [...ents].filter(e=>mcEnts.has(e));
    if (shared.length>=1 && sim>=0.12) candidates.push({item:pi._ref, sim, shared});
  });
  candidates.sort((a,b)=>b.sim-a.sim);
  mc.rescanResults = candidates.slice(0,15).map(c=>({...c, pick:true}));
  mc.rescanAt = new Date().toISOString();
  saveManual(); render();
}
function applyRescan(mc){
  const picked = (mc.rescanResults||[]).filter(c=>c.pick);
  picked.forEach(c=>mc.items.push(c.item));
  mc.rescanResults = null; saveManual(); render();
}

    items: [{ id:'manual-add-'+Date.now(), title:r.title||url.trim(), url:url.trim(),
               publisher:'Editor import', published:new Date().toISOString() }],
    manual:true, createdAt:new Date().toISOString(), beat_hint:'other', triage:null,
    rescanResults:null, rescanAt:null, search:{open:false,kw:'',src:'',results:[],busy:false,note:''} };
  MANUAL.push(mc);
  saveManual(); render();
  // Same scroll-and-flash as extractSelected() — a card sorted by score can
  // land anywhere in the list, far from where the editor is looking.
  requestAnimationFrame(()=>{
    const card = document.querySelector(`.cluster[data-mc-key="${mc.key}"]`);
    if (card){ card.scrollIntoView({behavior:'smooth', block:'center'});
      card.style.outline='2px solid #5a2d82'; setTimeout(()=>{ card.style.outline=''; }, 2000); }
  });
}
async function mcWindowSearch(mc){
  const kws = mc.search.kw.toLowerCase().split(/\s+/).filter(Boolean);
  if (!kws.length || !STREAM){ mc.search.note='Enter a keyword first.'; render(); return; }
  const srcF = mc.search.src.toLowerCase().trim();
  const existingIds = new Set(mc.items.map(it=>it.id));
  const out = [];
  STREAM.clusters.forEach(c=>c.items.forEach(it=>{
    if (existingIds.has(it.id)) return;
    const hay = (it.title+' '+it.publisher).toLowerCase();
    if (!kws.every(k=>hay.includes(k))) return;
    if (srcF && !it.publisher.toLowerCase().includes(srcF)) return;
    out.push({...it, pick:true});
  }));
  mc.search.results = out;
  mc.search.note = out.length ? '' : 'Nothing in the current window matches.';
  saveManual(); render();
}
async function mcErSearch(mc){
  mc.search.busy = true; mc.search.note = 'Searching EventRegistry…'; render();
  try {
    const raw = await netlifyFetch({mode:'keyword-scan', q:mc.search.kw, articlesCount:'10', bodyLen:String(SETTINGS.bodyLen)});
    const srcF = mc.search.src.toLowerCase().trim();
    const have = new Set(mc.search.results.map(r=>canon(r.url)));
    let added = 0;
    for (const a of raw){
      if (!a.url || have.has(canon(a.url))) continue;
      const sname = a.source?.title||'Unknown';
      if (srcF && !sname.toLowerCase().includes(srcF)) continue;
      mc.search.results.push({id:'er-'+canon(a.url), url:a.url, title:a.title||'Untitled',
        publisher:sname, published:a.date||'', pick:true});
      added++;
    }
    mc.search.note = added ? '' : 'EventRegistry found nothing new.';
  } catch(e){ mc.search.note = 'ER search failed: '+e.message; }
  mc.search.busy = false; saveManual(); render();
}
function mcApplySearch(mc){
  const picked = (mc.search.results||[]).filter(r=>r.pick);
  picked.forEach(r=>mc.items.push({id:r.id, title:r.title, url:r.url, publisher:r.publisher, published:r.published}));
  mc.search = {open:false, kw:'', src:'', results:[], busy:false, note:''};
  saveManual(); render();
}

/* ─── Stream search box: comma-separated terms → a new manual cluster.
   Each term is a phrase, any one matches. Pulls from the current window
   first (already held to feeds.json), then EventRegistry twice: the
   NTK_SOURCES list and ER's top 20% of sources, so nothing below the
   scan's publisher bar gets in. Two ER calls per search. ─── */
let STREAM_Q = { text:'', busy:false, note:'' };
function streamTerms(text){ return text.split(',').map(t=>t.trim()).filter(Boolean).slice(0,10); }
async function streamSearch(text){
  const terms = streamTerms(text);
  if (!terms.length || STREAM_Q.busy) return;
  STREAM_Q = { text, busy:true, note:'Searching the window and EventRegistry…' }; render();
  const res = terms.map(t=>new RegExp('\\b'+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i'));
  const seen = new Set(); const items = []; let nWin = 0, nEr = 0; const errs = [];
  for (const c of (STREAM?.clusters||[])) for (const it of c.items){
    if (!res.some(r=>r.test(it.title))) continue;
    const cn = canon(it.url); if (seen.has(cn)) continue; seen.add(cn);
    items.push({...it}); nWin++;
  }
  for (const pool of ['ntk','top']){
    try {
      const r = await fetch(proxyUrl({mode:'keyword-search', q:terms.join(','), pool, articlesCount:'15'}));
      const d = await r.json();
      // An older news.js answers with its unfiltered fallback; refuse it.
      if (d.ntkMode !== 'keyword-search') throw new Error('the deployed news function has no keyword-search mode yet');
      if (typeof d.error === 'string') throw new Error(d.error);
      const raw = d.articles?.results || [];
      for (const a of raw){
        if (!a.url) continue;
        const cn = canon(a.url); if (seen.has(cn)) continue; seen.add(cn);
        items.push({id:'er-'+cn, title:a.title||'Untitled', url:a.url,
          publisher:a.source?.title||'Unknown', published:a.dateTimePub||a.date||''});
        nEr++;
      }
    } catch(e){ errs.push(e.message); }
  }
  const err = errs.length ? ' · EventRegistry: '+errs[0].slice(0,120) : '';
  if (!items.length){ STREAM_Q = { text, busy:false, note:'Nothing found for '+terms.join(', ')+err }; render(); return; }
  const mc = { key:'manual-'+Date.now(), title:'Search: '+terms.join(', '), query:terms,
    items, manual:true, createdAt:new Date().toISOString(), beat_hint:'other', triage:null,
    rescanResults:null, rescanAt:null, search:{open:false,kw:'',src:'',results:[],busy:false,note:''} };
  MANUAL.push(mc); saveManual();
  STREAM_Q = { text:'', busy:false, note:nWin+' from the window, '+nEr+' from EventRegistry → new cluster'+err };
  render();
  requestAnimationFrame(()=>{
    const card = document.querySelector(`.cluster[data-mc-key="${mc.key}"]`);
    if (card){ card.scrollIntoView({behavior:'smooth', block:'center'});
      card.style.outline='2px solid #5a2d82'; setTimeout(()=>{ card.style.outline=''; }, 2000); }
  });
}

/* ─── Create cluster by query (2b) ─── */
let Q = { open:false, kw:'', src:'', results:[], busy:false, note:'' };
function windowSearch(){
  // Tier 1 — instant, free: search the current 6h window client-side.
  const kws = Q.kw.toLowerCase().split(/\s+/).filter(Boolean);
  if (!kws.length || !STREAM) return [];
  const srcF = Q.src.toLowerCase().trim();
  const seen = new Set(); const out = [];
  for (const c of (STREAM.clusters||[])){
    for (const it of c.items){
      const hay = (it.title+' '+it.publisher).toLowerCase();
      if (!kws.every(k=>hay.includes(k))) continue;
      if (srcF && !it.publisher.toLowerCase().includes(srcF)) continue;
      const cn = canon(it.url); if (seen.has(cn)) continue; seen.add(cn);
      out.push({url:it.url, title:it.title, source:it.publisher, date:it.published||'',
        body:'', bodyFrom:'', included:true, dupOf:null, origin:'rss', pick:true});
    }
  }
  return out;
}
async function erSearch(){
  // Tier 2 — ER keyword reach-back (7-day window, bodies included).
  Q.busy=true; Q.note='Searching EventRegistry…'; render();
  try {
    const raw = await netlifyFetch({mode:'keyword-scan', q:Q.kw,
      articlesCount:'10', bodyLen:String(SETTINGS.bodyLen)});
    const srcF = Q.src.toLowerCase().trim();
    const have = new Set(Q.results.map(r=>canon(r.url)));
    let added = 0;
    for (const a of raw){
      if (!a.url || have.has(canon(a.url))) continue;
      const sname = a.source?.title||'Unknown';
      if (srcF && !sname.toLowerCase().includes(srcF)) continue;
      Q.results.push({url:a.url, title:a.title||'Untitled', source:sname, date:a.date||'',
        body:a.body||'', bodyFrom:a.body?'er':'', included:true, dupOf:null, origin:'er', pick:true});
      added++;
    }
    Q.note = added ? '' : 'EventRegistry found nothing new for that query.';
  } catch(e){ Q.note='ER search failed: '+e.message; }
  Q.busy=false; render();
}
function createStoryFromQuery(){
  const picked = Q.results.filter(r=>r.pick);
  if (!picked.length) return;
  if (LINEUP.length>=LINEUP_MAX){ alert('Lineup is full ('+LINEUP_MAX+').'); return; }
  LINEUP.push({
    id:'ln-'+Date.now(), key:'query-'+Date.now(),
    title: Q.kw.trim()||'New story', beat:'other', category:'Nation', categoryCustom:'',
    angle:'', conceptEntity:'', narrowKeyword:'', conceptUri:null,
    articles: picked.map(({pick,...a})=>a),
    enrichedAt:null, packages:null, open:true, outOpen:false,
  });
  Q = { open:false, kw:'', src:'', results:[], busy:false, note:'' };
  saveLineup(); render();
}

/* ─── render: stream ─── */
function renderStream(root){
  const data = STREAM;
  if (!data && !MANUAL.length){ root.innerHTML = '<div class="empty">No data yet — data/clusters.json not found. Run the pipeline once.</div>'; return; }
  const organic = (data&&data.clusters)||[];
  document.getElementById('count').textContent = (organic.length+MANUAL.length) + ((organic.length+MANUAL.length)===1?' story':' stories');
  if (data){
    const ageMin = Math.round((Date.now()-new Date(data.updated))/60000);
    document.getElementById('stale').textContent = ageMin>60 ? '· data '+rel(data.updated)+' old' : '';
  }
  if (!organic.length && !MANUAL.length){ root.innerHTML='<div class="empty">Nothing in the window. Run the pipeline.</div>'; return; }

  // Merge organic + manual into one sorted list, each tagged with its kind.
  const combined = [
    ...organic.map(c=>({kind:'organic', c, score:c.pulse_score})),
    ...MANUAL.map(c=>({kind:'manual', c, score:manualScore(c)})),
  ].sort((a,b)=>b.score-a.score);

  root.innerHTML = `<div class="selbar${SELECTED.size?' show':''}">`+
    `<span>${SELECTED.size} selected</span>`+
    `<button class="mini go" id="merge-btn">merge into one cluster</button>`+
    `<button class="mini" id="clear-sel">clear</button></div>`+
    `<div class="addurl" title="Comma-separated words or phrases; any one matches. Searches the current window plus EventRegistry (NTK source list and ER's top 20% of publishers) and makes a new cluster from what it finds.">`+
    `<input class="stream-q" placeholder="search: keywords or phrases, comma-separated, Enter" value="${esc(STREAM_Q.text)}" ${STREAM_Q.busy?'disabled':''}></div>`+
    (STREAM_Q.note?`<div style="font-size:11px;color:var(--dim);margin-top:3px">${esc(STREAM_Q.note)}</div>`:'')+
    `<div class="addurl" style="margin-bottom:10px" title="For a single-outlet scoop that isn't corroborated or wasn't in the window at all — it becomes a candidate you can certify like any other.">`+
    `<input class="scoop-add-in" placeholder="https:// add a one-source scoop as a candidate">`+
    `<button class="mini go scoop-add-go">add</button></div>`+
    `<div id="stream-list"></div>`;
  document.getElementById('merge-btn')?.addEventListener('click', mergeSelected);
  document.getElementById('clear-sel')?.addEventListener('click', ()=>{ SELECTED.clear(); render(); });
  document.querySelector('.scoop-add-go')?.addEventListener('click', ()=>{
    const inp = document.querySelector('.scoop-add-in');
    newManualFromUrl(inp.value); inp.value='';
  });
  document.querySelector('.stream-q')?.addEventListener('keydown', e=>{
    if (e.key==='Enter') streamSearch(e.target.value);
  });
  const list = document.getElementById('stream-list');

  for (const {kind, c} of combined){
    if (kind === 'manual') { renderManualCard(list, c); continue; }
    if (MERGED_AWAY.has(c.key)) continue;   // fully consumed by a merge — nothing left to show
    const beat=(c.triage&&c.triage.beat)||c.beat_hint||'other';
    const verdict=c.triage&&c.triage.verdict;
    const line=c.triage&&c.triage.line;
    const solo=c.publisher_count<=1;
    const el=document.createElement('div');
    el.className='cluster'+(solo?' solo':'')+(verdict==='NO'?' no-verdict-no':'')+(SELECTED.has(c.key)?' selected':'');
    const nSup = c.items.filter(it=>isSup(it.url)).length;
    const extSel = EXTRACT_SEL.get(c.key) || new Set();
    const multi = c.items.length > 1;   // extraction only makes sense out of a multi-item cluster
    const articles=c.items.map((it,i)=>{
      const extracted = isExtracted(c.key, it.id);
      const target = extracted ? EXTRACTED_ELSEWHERE.get(c.key).get(it.id) : null;
      const inactive = isSup(it.url) || extracted;
      return `<div class="article${inactive?' suppressed':''}" data-i="${i}">`+
      (multi && !extracted?`<input type="checkbox" class="extchk" data-id="${esc(it.id)}" ${extSel.has(it.id)?'checked':''}>`:'')+
      `<span class="pub">${esc(it.publisher)}</span> · `+
      `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a> `+
      (extracted ? `<span class="t">→ moved to "${esc(target.targetTitle.slice(0,40))}"</span>` : `<span class="t">${rel(it.published)}</span>`)+
      (extracted
        ? `<button class="x unext" data-id="${esc(it.id)}" title="bring back — undo the extraction">↩</button>`
        : `<button class="x" title="${isSup(it.url)?'restore':'suppress from digest work'}">✕</button>`)+
      `</div>`;
    }).join('');
    const extractBar = multi ? `<div class="addurl" style="border:none;padding-top:6px">`+
      `<span style="flex:1;color:var(--dim);font-size:11px">${extSel.size} checked</span>`+
      `<button class="mini go extract-btn" ${extSel.size?'':'disabled'}>extract into new cluster</button></div>` : '';
    el.innerHTML=
      `<div class="hed"><input type="checkbox" class="selchk" ${SELECTED.has(c.key)?'checked':''}> ${esc(c.title)}${c.echo?' <span class="manual-badge" style="background:#006b6b">echoed by indie</span>':''}</div>`+
      `<div class="meta-line"><span class="beat beat-${esc(beat)}">${esc(beat)}</span>`+
      `${esc(pubList(c.publishers))} · ${rel(c.latest)}`+
      (nSup?` · <span style="color:var(--stale)">${nSup} suppressed</span>`:'')+`</div>`+
      (line&&!solo?`<div class="line">${esc(line)}</div>`:'')+
      `<div class="articles">${articles}${extractBar}`+
      `<button class="certify${inLineup(c.key)?' done':''}">${inLineup(c.key)?'✓ in lineup — click to remove':'→ lineup'}</button></div>`;
    el.querySelector('.selchk').addEventListener('click',e=>{ e.stopPropagation(); toggleSelect(c.key); });
    el.querySelector('.hed').addEventListener('click',e=>{
      if(e.target.classList.contains('selchk'))return;
      if (OPEN_CLUSTERS.has(c.key)) OPEN_CLUSTERS.delete(c.key); else OPEN_CLUSTERS.add(c.key);
      if (c.manual) touchManual(c.key);
      render();
    });
    el.querySelectorAll('.article .x:not(.unext)').forEach(btn=>{
      btn.addEventListener('click',e=>{
        const i=+e.target.closest('.article').dataset.i;
        toggleSup(c.items[i].url); render();
        e.target.closest('.cluster')?.classList.add('open');
      });
    });
    el.querySelectorAll('.article .x.unext').forEach(btn=>{
      btn.addEventListener('click',e=>{ e.stopPropagation(); unextract(c.key, e.target.dataset.id); });
    });
    el.querySelectorAll('.article .extchk').forEach(cb=>{
      cb.addEventListener('click',e=>{ e.stopPropagation(); toggleExtractItem(c.key, e.target.dataset.id); });
    });
    el.querySelector('.extract-btn')?.addEventListener('click',()=>extractSelected(c));
    el.querySelector('.certify').addEventListener('click',()=>certify(c));
    list.appendChild(el);
    if (OPEN_CLUSTERS.has(c.key)||el.querySelector('.certify.done')||nSup) el.classList.add('open');
  }
}

/* ─── render: lineup ─── */
function bodyChip(a){
  if (a.dupOf) return `<span class="chip dup">syndicated · ${esc(a.dupOf)}</span>`;
  if (isSup(a.url)) return `<span class="chip dup">suppressed</span>`;
  if (a.bodyFrom==='er') return `<span class="chip body">er body ${(a.body.length/1000).toFixed(1)}k</span>`;
  if (a.bodyFrom==='fetch') return `<span class="chip thin">meta ${a.body.length}ch</span>`;
  return `<span class="chip thin">headline only</span>`;
}
function editionScoreChips(key){
  if (!EDITION) return '';
  const s = (EDITION.stories||[]).find(x=>x.key===key);
  if (!s || !s.scores) return '';
  const sc = s.scores;
  const hot = sc.emotional_load>=4 ? ' style="color:var(--stale)"' : '';
  return ` · <span${hot}>emotion ${sc.emotional_load}</span> · action ${sc.actionability} · currency ${sc.conversational_currency}`+
    (s.ledger_class ? ` · <b>${esc(s.ledger_class)}</b>` : '');
}

// ─── recommended-zone (edition candidates) selection/expand state ───
// Ephemeral — resets on reload, same posture as Stream's SELECTED/OPEN_CLUSTERS.
let CAND_SELECTED = new Set();   // candidate keys checked for batch dismiss
let OPEN_CANDIDATES = new Set(); // candidate keys currently expanded to show sources
let candLastIndex = null;        // last clicked row index, for shift-click range select

function visibleCandidates(){
  return (EDITION?._candidates||[]).filter(s=>!DISMISSED[s.key]);
}
function dismissedCandidateCount(){
  return (EDITION?._candidates||[]).filter(s=>DISMISSED[s.key]).length;
}
function dismissCandidate(key){
  DISMISSED[key]=true; CAND_SELECTED.delete(key); saveDismissed(); render();
}
function dismissSelectedCandidates(){
  if (!CAND_SELECTED.size) return;
  for (const k of CAND_SELECTED) DISMISSED[k]=true;
  CAND_SELECTED.clear(); saveDismissed(); render();
}
function restoreDismissedCandidates(){
  if (!dismissedCandidateCount()) return;
  if (!confirm('Restore all dismissed candidates back into the recommended list?')) return;
  DISMISSED = {}; saveDismissed(); render();
}
function toggleCandOpen(key){
  if (OPEN_CANDIDATES.has(key)) OPEN_CANDIDATES.delete(key); else OPEN_CANDIDATES.add(key);
  render();
}
function toggleCandSelect(key, shiftKey, index, visibleKeys){
  if (shiftKey && candLastIndex!==null){
    const [a,b] = [candLastIndex, index].sort((x,y)=>x-y);
    for (let i=a;i<=b;i++) CAND_SELECTED.add(visibleKeys[i]);
  } else if (CAND_SELECTED.has(key)) {
    CAND_SELECTED.delete(key);
  } else {
    CAND_SELECTED.add(key);
  }
  candLastIndex = index;
  render();
}
function toggleCandSelectAll(visibleKeys, checked){
  if (checked) visibleKeys.forEach(k=>CAND_SELECTED.add(k)); else CAND_SELECTED.clear();
  render();
}
// Same source detail Stream shows — pulled from the live 6h window when the
// cluster is still there. Clusters age out of that window over the course
// of a day, so candidates promoted earlier fall back to the canonical URLs
// lineup_promote.py recorded at promotion time (no per-article title/pub
// pairing in that case — best available, not the full picture).
// T-0105. True when candidateArticles() would have something to show: a live
// stream cluster with items, or URLs recorded at promotion time.
function candidateHasSources(key){
  const sc = (STREAM?.clusters||[]).find(c=>c.key===key);
  if (sc && sc.items && sc.items.length) return true;
  const s = (EDITION?._candidates||[]).find(x=>x.key===key);
  return !!(s && s.urls && s.urls.length);
}
function candidateArticles(key){
  const sc = (STREAM?.clusters||[]).find(c=>c.key===key);
  if (sc && sc.items && sc.items.length){
    return sc.items.map(it=>
      `<div class="article"><span class="pub">${esc(it.publisher)}</span> · `+
      `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a> `+
      `<span class="t">${rel(it.published)}</span></div>`
    ).join('');
  }
  const s = (EDITION?._candidates||[]).find(x=>x.key===key);
  const urls = (s && s.urls) || [];
  if (!urls.length){
    return `<div style="font-size:11px;color:var(--dim);padding:2px 0">No source detail available — cluster aged out of the stream window and no URLs were recorded.</div>`;
  }
  return `<div style="font-size:10.5px;color:var(--dim);padding:2px 0 4px">cluster aged out of the stream window — showing recorded source URLs only</div>`+
    urls.map(u=>`<div class="article"><a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a></div>`).join('');
}

function wireCandidateButtons(root){
  const keys = visibleCandidates().map(s=>s.key);
  root.querySelectorAll('.add-candidate').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if (!candidateHasSources(btn.dataset.key) &&
          !confirm('This story has no source URLs on file, so Jefferson will have nothing to write from. Add it anyway?')) return;
      addEditionCandidate(btn.dataset.key);
    });
  });
  root.querySelectorAll('.cand-dismiss').forEach(btn=>{
    btn.addEventListener('click',()=>dismissCandidate(btn.dataset.key));
  });
  root.querySelectorAll('.cand-label').forEach(lbl=>{
    lbl.addEventListener('click',()=>toggleCandOpen(lbl.dataset.key));
  });
  root.querySelectorAll('.cand-chk').forEach(cb=>{
    cb.addEventListener('click',e=>{
      e.stopPropagation();
      toggleCandSelect(cb.dataset.key, e.shiftKey, +cb.dataset.i, keys);
    });
  });
  root.querySelector('#cand-select-all')?.addEventListener('change', e=>{
    toggleCandSelectAll(keys, e.target.checked);
  });
  root.querySelector('#cand-dismiss-sel')?.addEventListener('click', dismissSelectedCandidates);
  root.querySelector('#cand-restore-dismissed')?.addEventListener('click', restoreDismissedCandidates);
}

function candidatesPanel(){

      </div>`+
      (cands.length ? `<div style="display:flex;gap:10px;align-items:center">
        <label style="font-size:11px;display:flex;gap:4px;align-items:center;cursor:pointer">
          <input type="checkbox" id="cand-select-all" ${allSelected?'checked':''}> select all
        </label>
        <button class="mini" id="cand-dismiss-sel" ${CAND_SELECTED.size?'':'disabled'}>dismiss selected (${CAND_SELECTED.size})</button>
      </div>` : '')+

  const rows = cands.map((s,i)=>{

      </div>`+
