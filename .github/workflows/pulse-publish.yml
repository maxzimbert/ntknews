name: NTK Pulse — Publish to Digest

# Triggered by the commit itself — Pulse's Publish button writes
# ntk-pulse/data/lineup-publish.json directly to the repo via GitHub's
# Contents API, and that push is the trigger. No polling, no separate
# "start this workflow" call needed — the file landing IS the signal.
on:
  push:
    branches: [main]
    paths:
      - 'ntk-pulse/data/lineup-publish.json'
  workflow_dispatch: {}   # manual re-run, e.g. if a build needs retrying

permissions:
  contents: write

# Deliberately its OWN concurrency group, not shared with ntk-pulse — a
# publish should never wait behind a routine 4-hour pipeline run just
# because both happened to fire close together. If two publishes somehow
# overlap, THAT should serialize (hence a group at all) — but a publish
# and a scan/full-pipeline run genuinely don't touch the same files, so
# there's no git-race reason to block one on the other.
concurrency:
  group: ntk-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # T-0114, the contract: each story ships the Backstory the editor built and reviewed in Pulse, or none.
      # Nothing is chosen at publish (the classifier and origin steps that did are gone). Must run before
      # "Build digest", which cross-links each story to its pairing (T-0046). continue-on-error: the digest is
      # the product and Backstory is additive, so a failure here never blocks a publish.
      - name: Ship the Backstory pages built in Pulse
        id: draft
        continue-on-error: true
        run: python editorial/backstory_draft.py apply --github-output "$GITHUB_OUTPUT"

      # T-0107: what renders each story's link-preview card (share-cards/), which
      # build_digest.py calls per story. continue-on-error for the same reason as
      # the steps above: without the renderer the pages use the photo as og:image,
      # exactly as before, and the digest still ships.
      - name: Install share-card renderer
        continue-on-error: true
        run: |
          python -m pip install --quiet -r share-cards/render/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Build digest
        working-directory: ntk-pulse
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python build_digest.py data/lineup-publish.json

      # Depends on the digest step above having just enriched
      # digest/data/backstory.json with real story permalinks — must run
      # after it, not before. continue-on-error for the same reason as the
      # pairings step: Backstory's permalink pages are additive, never a
      # reason to block the actual digest from shipping.
      - name: Build Backstory permalink pages
        continue-on-error: true
        run: python editorial/build_backstory_pages.py

      # T-0111: documents the editor approved in Pulse join the Object Matrix (primary sources; news from the 91
      # approved publishers, marked as news: docs/decisions.md 2026-11-02), and the pool
      # Pulse searches is rebuilt from it. continue-on-error for the same reason as the Backstory steps above.
      - name: Approved documents join the Object Matrix
        continue-on-error: true
        run: |
          python -m pip install --quiet openpyxl
          python editorial/graduate_finds.py
          python editorial/export_for_pulse.py

      - name: Commit
        run: |
          git config user.name "ntk-publish-bot"
          git config user.email "publish@ntknews.org"
          git add digest/ index.html backstory/ ntk-pulse/data/last-published.json ntk-pulse/data/provisional-rows.json editorial/origins.json \
            editorial/NTK_Backstory_Object_Matrix.xlsx editorial/matrix-additions.json ntk-pulse/data/backstory-pool.json
          git diff --cached --quiet || git commit -m "publish: $(date -u +%Y-%m-%dT%H:%MZ)"
          # T-0093: retry with a rebase, as newscast.yml does. A bare push lost the 2026-10-15 17:16Z
          # publish to "[rejected] (fetch first)" when main moved during the run. Every other writer to
          # main touches other files or other lines (a PR merge to digest/index.html changes code, a publish
          # changes the pasted stories), so the rebase is clean; if it is not, stop and fail loudly.
          for i in 1 2 3; do
            git push && exit 0
            echo "push rejected, rebasing onto origin/main and retrying ($i/3)"
            git pull --rebase origin main || { git rebase --abort; echo "rebase conflicted; nothing was pushed"; exit 1; }
          done
          echo "push still rejected after 3 tries"; exit 1
