name: NTK Pulse

on:
  workflow_dispatch:
    inputs:
      slot_plan:
        description: "Digest slot plan: A (reader-relationship slots) or B (4 hard + 4 reserved)"
        required: false
        default: "A"
        type: choice
        options: ["A", "B"]
      run_ledger:
        description: "Run the Story Ledger pass (Sonnet — the expensive stage)"
        required: false
        default: true
        type: boolean
  # Runs the full chain unattended. Cadence is deliberately conservative to
  # start — every 4 hours, 6 runs/day — because ledger.py has no prompt
  # caching or batch-API cost reduction built in yet (that optimization was
  # scoped in the requirements doc but never implemented), so real per-run
  # cost is closer to the naive end of the earlier estimate than the
  # optimized end. Widen this only after a few days of real numbers from
  # the Anthropic console, not before. Times are UTC.
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: write

concurrency:
  group: ntk-pulse
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Ingest (6h window)
        working-directory: ntk-pulse
        run: python ingest.py

      - name: Cluster
        working-directory: ntk-pulse
        run: python cluster.py

      - name: Triage (beat, line, verdict + assembly scores)
        working-directory: ntk-pulse
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PULSE_MAX_CALLS: "25"
        run: python triage.py

      # Layer 3 — the epistemic dedup. Sonnet, capped at 15 calls/run, and
      # only touches clusters that triage graded YES or MAYBE.
      #
      # continue-on-error: true — a bug in this stage (there have been two
      # already) must NOT cost the fresh window/clusters/triage data that
      # already exists on disk at this point. Without this, GitHub Actions'
      # default behavior on a failed step is to skip every step after it,
      # including Commit — so a ledger crash was silently discarding a full
      # ingest+cluster+triage run every time it happened. That is almost
      # certainly why Pulse has been showing "data 48h old": several runs in
      # a row did real work and then threw it away at the finish line.
      #
      # The `if` below is trigger-aware on purpose. `inputs.run_ledger` is
      # only ever populated on a manual workflow_dispatch run — its default
      # does NOT apply on a schedule-triggered run, which has no dispatch
      # inputs at all. Without the `github.event_name != 'workflow_dispatch'`
      # half of this condition, every scheduled run would silently skip the
      # ledger stage entirely, forever, with no error and nothing in the
      # log to suggest why. This was caught and fixed before scheduling was
      # turned on, not after.
      - name: Story Ledger
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_ledger }}
        continue-on-error: true
        working-directory: ntk-pulse
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python ledger.py

      # No API calls — every judgment used here was already paid for above.
      # Also continue-on-error: assembly depends on ledger annotations being
      # PRESENT, not on the ledger step having SUCCEEDED — if ledger.py
      # failed above, assembly.py still runs fine against triage data alone
      # (ledger_class() returns None gracefully for unannotated clusters).
      - name: Assemble digest
        continue-on-error: true
        working-directory: ntk-pulse
        env:
          NTK_SLOT_PLAN: ${{ inputs.slot_plan }}
          NTK_DISPLACEMENT: MANUAL
        run: python assembly.py

      # if: always() — this is the actual fix. Commit whatever exists in
      # data/ regardless of whether every prior step succeeded. A fresh
      # window and fresh clusters are worth saving even if ledger or
      # assembly had a bad run; partial freshness beats total staleness.
      - name: Commit data
        if: always()
        run: |
          git config user.name "ntk-pulse-bot"
          git config user.email "pulse@ntknews.org"
          git add ntk-pulse/data/
          git diff --cached --quiet || git commit -m "pulse: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
