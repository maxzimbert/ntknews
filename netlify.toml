[build]
  ignore = "git diff --quiet HEAD^ HEAD -- . ':(exclude)ntk-desk/data/' ':(exclude)ntk-desk/data/**' ':(exclude)ntk-pulse/data/' ':(exclude)ntk-pulse/data/**'"

# ── Legacy front doors → /today (301, keep forever) ──────────────────
# Old dated permalinks and archive pages already shared under /digest/v2/
# are left exactly where they are — they still work as real pages, no
# redirect needed. Only these two ever pointed at the whole app.
[[redirects]]
  from = "/digest/latest"
  to = "/today"
  status = 301

[[redirects]]
  from = "/digest/v2"
  to = "/today"
  status = 301

# ── App tabs (200 = rewrite; the address bar keeps the clean path) ───
# /digest needs no rule of its own — that path already serves
# digest/index.html directly. These three route into the same file;
# the app reads the URL on load and opens the matching tab.
[[redirects]]
  from = "/today"
  to = "/digest/index.html"
  status = 200

[[redirects]]
  from = "/backstory"
  to = "/digest/index.html"
  status = 200

[[redirects]]
  from = "/me"
  to = "/digest/index.html"
  status = 200
